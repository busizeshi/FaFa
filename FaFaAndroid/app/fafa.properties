# ============================================================
# FaFa Android 唯一配置文件（构建期默认值）
# ============================================================
# 用法：
#   1. 修改本文件后重新构建即可生效（模拟器默认 10.0.2.2 即宿主机 localhost）。
#   2. 真机联调不想重新打包时，可在设备上放置运行时覆盖文件：
#        /sdcard/Android/data/com.jwd.fafa/files/fafa.properties
#      文件内容同格式（如 baseUrl=http://192.168.1.100:8080），
#      App 启动时优先读取；删除该文件即恢复本文件的构建期默认值。
#   3. 本文件应提交仓库（不含密钥）；密钥类配置一律走环境变量/服务端。

# 服务端网关地址（APP 端所有请求的 Base URL）
baseUrl=http://192.168.1.254:9090

# 网络超时（秒）
connectTimeoutSeconds=10
readTimeoutSeconds=30

# 是否打印 HTTP 日志（仅 debug 构建生效；联调期建议 true）
enableHttpLogging=true
