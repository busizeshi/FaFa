components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Device:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 100
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - deviceId
      - deviceName
    EmailChallengeRequest:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum:
          - REGISTER
          - RESET_PASSWORD
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - purpose
      - email
    LegalVersions:
      type: object
      additionalProperties: false
      properties:
        TERMS:
          type: string
          maxLength: 64
        PRIVACY:
          type: string
          maxLength: 64
      required:
      - TERMS
      - PRIVACY
    RegistrationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
          writeOnly: true
        confirmedPassword:
          type: string
          format: password
          maxLength: 256
          writeOnly: true
        challengeId:
          type: string
          maxLength: 36
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
        legalVersions:
          $ref: '#/components/schemas/LegalVersions'
        device:
          $ref: '#/components/schemas/Device'
      required:
      - email
      - password
      - confirmedPassword
      - challengeId
      - code
      - legalVersions
      - device
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 256
          writeOnly: true
        device:
          $ref: '#/components/schemas/Device'
      required:
      - email
      - password
      - device
    VerifyResetRequest:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          type: string
          maxLength: 36
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
      required:
      - challengeId
      - code
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        resetTicket:
          type: string
          maxLength: 128
          writeOnly: true
        password:
          type: string
          format: password
          maxLength: 256
          writeOnly: true
        confirmedPassword:
          type: string
          format: password
          maxLength: 256
          writeOnly: true
      required:
      - resetTicket
      - password
      - confirmedPassword
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        signature:
          type: string
          nullable: true
        avatarMediaId:
          type: string
          nullable: true
        timezone:
          type: string
          example: Asia/Hong_Kong
        version:
          type: integer
          format: int64
      required:
      - id
      - email
      - nickname
      - signature
      - avatarMediaId
      - timezone
      - version
    Grant:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          format: int64
      required:
      - token
      - tokenType
      - expiresIn
    ChallengeReceipt:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          example: '0'
        message:
          type: string
          example: OK
        data:
          type: object
          additionalProperties: false
          properties:
            challengeId:
              type: string
              format: uuid
            expiresAt:
              type: string
              format: date-time
            resendAfter:
              type: integer
              minimum: 1
          required:
          - challengeId
          - expiresAt
          - resendAfter
          nullable: true
        requestId:
          type: string
          maxLength: 80
      required:
      - code
      - message
      - data
      - requestId
    RegistrationResponse:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          example: '0'
        message:
          type: string
          example: OK
        data:
          type: object
          additionalProperties: false
          properties:
            user:
              $ref: '#/components/schemas/User'
            session:
              allOf:
              - $ref: '#/components/schemas/Grant'
              nullable: true
            nextAction:
              type: string
              enum:
              - NO_PET
              - LOGIN
          required:
          - user
          - session
          - nextAction
          nullable: true
        requestId:
          type: string
          maxLength: 80
      required:
      - code
      - message
      - data
      - requestId
    LoginResponse:
      type: object
      additionalProperties: false
      properties:
        code:
