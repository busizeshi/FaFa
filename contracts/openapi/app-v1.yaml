  /auth/registrations:
    post:
      operationId: registerAccount
      x-pages:
      - auth.verify
      x-stage: WP00-WP01
      x-idempotency-required: false
      security: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      description: Challenge consumption and account creation are atomic. If session storage fails after commit,
        account remains created and nextAction=LOGIN. On a lost response, sign in with the supplied password; do
        not create a second account.
