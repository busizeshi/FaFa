          required:
          - authenticated
          - user
          - pets
          - currentPetId
          - nextRoute
          - features
          nullable: true
        requestId:
          type: string
          maxLength: 80
      required:
      - code
      - message
      - data
      - requestId
    LegalDocument:
      type: object
      additionalProperties: false
      properties:
        type:
