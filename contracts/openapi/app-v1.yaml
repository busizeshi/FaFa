openapi: 3.0.3
info:
  title: FaFa 移动端后端接口
  version: 0.2.0
  description: WP00—WP03 后端契约。字节额度使用十进制字符串；宠物资料支持版本控制与幂等。密码按 Unicode 码点计数，至少 8 位且包含字母和数字。
servers:
- url: /api/v1
paths:
  /legal-documents:
    get:
      operationId: listLegalDocuments
      x-pages:
      - auth.legal
      - auth.welcome
      x-stage: WP00-WP01
      x-idempotency-required: false
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: type
        in: query
        schema:
          type: string
          enum:
          - TERMS
          - PRIVACY
      - name: version
        in: query
        schema:
          type: string
          maxLength: 64
        description: Requires type; returns published version only
  /auth/email-challenges:
    post:
      operationId: createEmailChallenge
      x-pages:
      - auth.register
      - auth.forgot
      x-stage: WP00-WP01
      x-idempotency-required: false
      security: []
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeReceipt'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
