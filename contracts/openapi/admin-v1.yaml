openapi: 3.0.3
info:
  title: FaFa 管理端后端接口
  version: 0.2.0
  description: 独立管理员认证与 RBAC。业务写入经签名 Dubbo 契约，所有管理写入要求幂等键和原因。
servers:
- url: /api/admin/v1
paths:
  /users/{id}:set-status:
    post:
      tags:
      - admin-business-controller
      operationId: setAdminUserStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChange'
        required: true
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RUserSummary'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 限制或恢复用户并撤销旧会话
      x-pages:
      - admin.users
      x-stage: WP03
      x-idempotency-required: true
      x-permission: USER_WRITE
  /users/{id}/quota-adjustments:
    post:
      tags:
      - admin-business-controller
      operationId: grantAdminUserQuota
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Grant'
        required: true
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RQuotaView'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 赠送永久存储字节额度
      x-pages:
      - admin.quotaAdjustments
      x-stage: WP03
      x-idempotency-required: true
      x-permission: QUOTA_WRITE
  /quota-grant-requests/{id}:decide:
    post:
      tags:
      - admin-business-controller
      operationId: decideAdminQuotaRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
        required: true
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RQuotaRequest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 批准或拒绝存储额度申请
      x-pages:
      - admin.quotaRequests
      x-stage: WP03
      x-idempotency-required: true
      x-permission: QUOTA_WRITE
  /pet-breeds:
    post:
      tags:
      - admin-business-controller
      operationId: createAdminPetBreed
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreedWrite'
        required: true
      responses:
        '201':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBreed'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 创建品种字典项
      x-pages:
      - admin.breeds
      x-stage: WP03
      x-idempotency-required: true
      x-permission: BREED_WRITE
  /auth/sessions:
    post:
      tags:
      - admin-auth-controller
      operationId: createAdminSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
        required: true
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RLogin'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      summary: 管理员登录
      x-pages:
      - admin.login
      x-stage: WP03
      x-idempotency-required: false
      security: []
  /pet-breeds/{id}:
    patch:
      tags:
      - admin-business-controller
      operationId: updateAdminPetBreed
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreedWrite'
        required: true
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBreed'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 按版本修改或停用品种字典项
      x-pages:
      - admin.breeds
      x-stage: WP03
      x-idempotency-required: true
      x-permission: BREED_WRITE
  /users:
    get:
      tags:
      - admin-business-controller
      operationId: listAdminUsers
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCursorPageUserSummary'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 分页查询脱敏用户
      x-pages:
      - admin.users
      x-stage: WP03
      x-idempotency-required: false
      x-permission: USER_READ
  /users/{id}:
    get:
      tags:
      - admin-business-controller
      operationId: getAdminUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RUserSummary'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 读取脱敏用户详情
      x-pages:
      - admin.users
      x-stage: WP03
      x-idempotency-required: false
      x-permission: USER_READ
  /quota-grant-requests:
    get:
      tags:
      - admin-business-controller
      operationId: listAdminQuotaRequests
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCursorPageQuotaRequest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 查询额度申请
      x-pages:
      - admin.quotaRequests
      x-stage: WP03
      x-idempotency-required: false
      x-permission: QUOTA_READ
  /me:
    get:
      tags:
      - admin-auth-controller
      operationId: getAdminProfile
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RPrincipal'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 读取当前管理员及有效权限
      x-pages:
      - admin.profile
      x-stage: WP03
      x-idempotency-required: false
  /dictionaries/pet-breeds:
    get:
      tags:
      - admin-business-controller
      operationId: listAdminPetBreeds
      parameters:
      - name: species
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCursorPageBreed'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 查询包含停用品种的字典
      x-pages:
      - admin.breeds
      x-stage: WP03
      x-idempotency-required: false
      x-permission: BREED_READ
  /audit-logs:
    get:
      tags:
      - admin-business-controller
      operationId: listAdminAuditLogs
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RCursorPageEntry'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 查询管理操作及未知结果审计
      x-pages:
      - admin.audit
      x-stage: WP03
      x-idempotency-required: false
      x-permission: AUDIT_READ
  /auth/session:
    delete:
      tags:
      - admin-auth-controller
      operationId: deleteAdminSession
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RVoid'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      summary: 管理员退出
      x-pages:
      - admin.logout
      x-stage: WP03
      x-idempotency-required: false
components:
  schemas:
    StatusChange:
      type: object
      properties:
        status:
          type: string
          minLength: 1
          pattern: ACTIVE|DISABLED
        reason:
          type: string
          maxLength: 500
          minLength: 0
        version:
          type: integer
          format: int64
      required:
      - reason
      - status
      - version
    RUserSummary:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserSummary'
          nullable: true
        requestId:
          type: string
      required:
      - code
      - message
      - data
      - requestId
    UserSummary:
      type: object
      properties:
        id:
          type: string
        maskedEmail:
          type: string
        nickname:
          type: string
        status:
          type: string
        version:
          type: integer
          format: int64
    Grant:
      type: object
      properties:
        bucket:
          type: string
          minLength: 1
          pattern: STORAGE_BYTES
        amount:
          type: string
          minLength: 1
          pattern: '[1-9][0-9]{0,18}'
        entryType:
          type: string
          minLength: 1
          pattern: GRANT
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - amount
      - bucket
      - entryType
      - reason
    QuotaView:
      type: object
      properties:
        bucket:
          type: string
        granted:
          type: string
        used:
          type: string
        reserved:
          type: string
        available:
          type: string
        version:
          type: integer
          format: int64
    RQuotaView:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/QuotaView'
          nullable: true
        requestId:
          type: string
      required:
      - code
      - message
      - data
      - requestId
    Decision:
      type: object
      properties:
        approved:
          type: boolean
        amount:
          type: string
          pattern: '[1-9][0-9]{0,18}'
        reason:
          type: string
          maxLength: 500
          minLength: 0
        version:
          type: integer
          format: int64
      required:
      - approved
      - reason
      - version
    QuotaRequest:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        bucket:
          type: string
        amount:
          type: string
        reason:
          type: string
        state:
          type: string
        grantedAmount:
          type: string
          nullable: true
        decisionReason:
          type: string
          nullable: true
        operatorId:
          type: string
          nullable: true
        version:
          type: integer
          format: int64
    RQuotaRequest:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/QuotaRequest'
          nullable: true
        requestId:
          type: string
      required:
      - code
      - message
      - data
      - requestId
    BreedWrite:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          pattern: '[A-Z0-9_]{1,64}'
        species:
          type: string
          minLength: 1
          pattern: CAT|DOG|OTHER
        name:
          type: string
          maxLength: 80
          minLength: 0
        status:
          type: string
          minLength: 1
          pattern: ACTIVE|INACTIVE
        version:
          type: integer
          format: int64
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - id
      - name
      - reason
      - species
      - status
    Breed:
      type: object
      properties:
        id:
          type: string
        species:
          type: string
        name:
          type: string
        status:
          type: string
        version:
          type: integer
          format: int64
    RBreed:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/Breed'
          nullable: true
        requestId:
          type: string
      required:
      - code
      - message
      - data
      - requestId
    Credentials:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          pattern: '[a-zA-Z0-9._-]{3,64}'
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - password
      - username
    Login:
      type: object
      properties:
        admin:
          $ref: '#/components/schemas/Principal'
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    Principal:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        permissions:
          type: array
          items:
            type: string
          uniqueItems: true
    RLogin:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/Login'
          nullable: true
        requestId:
          type: string
      required:
      - code
      - message
      - data
      - requestId
    CursorPageUserSummary:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        nextCursor:
          type: string
          nullable: true
    RCursorPageUserSummary:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/CursorPageUserSummary'
          nullable: true
        requestId:
          type: string
      required:
      - code
      - message
      - data
      - requestId
    CursorPageQuotaRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuotaRequest'
        nextCursor:
          type: string
          nullable: true
    RCursorPageQuotaRequest:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/CursorPageQuotaRequest'
          nullable: true
        requestId:
          type: string
      required:
      - code
      - message
      - data
      - requestId
    RPrincipal:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/Principal'
          nullable: true
        requestId:
          type: string
      required:
      - code
      - message
      - data
      - requestId
