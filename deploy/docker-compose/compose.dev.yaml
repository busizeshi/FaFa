name: fafa-dev

services:
  mysql:
    image: mysql:8.4
    profiles: [core]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: fafa_biz
      MYSQL_USER: fafa
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ADMIN_PASSWORD:?Set MYSQL_ADMIN_PASSWORD in .env}
      TZ: Asia/Hong_Kong
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [fafa-dev]

  redis:
    image: redis:7.4-alpine
    profiles: [core]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [fafa-dev]

  nacos:
    image: nacos/nacos-server:v3.0.3
    profiles: [core]
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_SERVER_PORT: 8848
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:18080:8080"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness | grep -q '\"data\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks: [fafa-dev]

  fafa-gateway:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: fafa-java/fafa-gateway/Dockerfile
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      FAFA_ADMIN_URL: http://fafa-admin:8081
      FAFA_BIZ_URL: http://fafa-biz:8082
      FAFA_PYTHON_URL: http://fafa-python:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
    networks: [fafa-dev]

  fafa-admin:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: fafa-java/fafa-admin/Dockerfile
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      DUBBO_PORT: -1
      FAFA_ADMIN_DB_URL: jdbc:mysql://mysql:3306/fafa_admin?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      FAFA_ADMIN_DB_USERNAME: fafa_admin
      FAFA_ADMIN_DB_PASSWORD: ${MYSQL_ADMIN_PASSWORD:?Set MYSQL_ADMIN_PASSWORD in .env}
      FAFA_INTERNAL_RPC_SECRET: ${FAFA_INTERNAL_RPC_SECRET:?Set an internal RPC secret of at least 32 characters}
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks: [fafa-dev]

  fafa-biz:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: fafa-java/fafa-biz/Dockerfile
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      DUBBO_PORT: 50051
      FAFA_DB_URL: jdbc:mysql://mysql:3306/fafa_biz?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      FAFA_DB_USERNAME: fafa
      FAFA_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      FAFA_REDIS_HOST: redis
      FAFA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      FAFA_AUTH_HMAC_SECRET: ${FAFA_AUTH_HMAC_SECRET:?Set a random HMAC secret of at least 32 characters}
      FAFA_INTERNAL_RPC_SECRET: ${FAFA_INTERNAL_RPC_SECRET:?Set an internal RPC secret of at least 32 characters}
      FAFA_INITIAL_STORAGE_BYTES: ${FAFA_INITIAL_STORAGE_BYTES:-0}
      FAFA_MAIL_FROM: ${FAFA_MAIL_FROM:-dev@fafa.invalid}
      FAFA_SMTP_HOST: mailpit
      FAFA_SMTP_PORT: 1025
      FAFA_SMTP_AUTH: "false"
      FAFA_SMTP_STARTTLS: "false"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fafa-dev]

  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: [mail]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks: [fafa-dev]

  fafa-python:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: fafa-python/Dockerfile
    restart: unless-stopped
    environment:
      FAFA_PYTHON_ENVIRONMENT: development
      FAFA_PYTHON_API_DOCS_ENABLED: "true"
    networks: [fafa-dev]

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:

networks:
  fafa-dev:
    name: fafa-dev
