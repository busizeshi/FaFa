services:
  fafa-nacos:
    image: nacos-registry.cn-hangzhou.cr.aliyuncs.com/nacos/nacos-server:v3.2.4
    container_name: fafa-nacos
    hostname: fafa-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD}
      MYSQL_DATABASE_NUM: "1"
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=3000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TZ: Asia/Shanghai
    volumes:
      - ./nacos/data:/home/nacos/data
      - ./nacos/logs:/home/nacos/logs
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    networks:
      - fafa-network

  fafa-rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: fafa-rabbitmq
    hostname: fafa-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: fafa
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /fafa
      TZ: Asia/Shanghai
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/logs:/var/log/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - fafa-network

  fafa-powerjob:
    image: powerjob/powerjob-server:v5.1.2
    container_name: fafa-powerjob
    hostname: fafa-powerjob
    restart: unless-stopped
    environment:
      JVMOPTIONS: "-Xms512m -Xmx1024m"
      PARAMS: >-
        --oms.mongodb.enable=false
        --oms.storage.type=database
        --oms.auth.openapi.enable=true
        --oms.auth.initialize.admin.password=${POWERJOB_ADMIN_PASSWORD}
        --oms.auth.security.jwt.secret=${POWERJOB_JWT_SECRET}
        --spring.datasource.core.jdbc-url=jdbc:mysql://mysql:3306/powerjob
        --spring.datasource.core.username=powerjob
        --spring.datasource.core.password=${POWERJOB_DB_PASSWORD}
        --oms.storage.dfs.mysql_series.driver=com.mysql.cj.jdbc.Driver
        --oms.storage.dfs.mysql_series.url=jdbc:mysql://mysql:3306/powerjob
        --oms.storage.dfs.mysql_series.username=powerjob
        --oms.storage.dfs.mysql_series.password=${POWERJOB_DB_PASSWORD}
        --oms.storage.dfs.mysql_series.auto_create_table=true
    volumes:
      - ./powerjob/data:/root/powerjob/server
    ports:
      - "7700:7700"
      - "10010:10010"
      - "10086:10086"
      - "10077:10077"
    networks:
      - fafa-network

networks:
  fafa-network:
    external: true
    name: docker_fafa-network
