version: '3.8'

services:
  mysql:
    image: mysql:8.0.46
    container_name: fafa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fafa_root_123456
      MYSQL_DATABASE: fafa
      MYSQL_USER: fafa
      MYSQL_PASSWORD: fafa_123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/config:/etc/mysql/conf.d
      - ./mysql/logs:/var/log/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - fafa-network

  redis:
    image: redis:7.2-alpine
    container_name: fafa-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
      - ./redis/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - fafa-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: fafa-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请设置MinIO管理账号}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置MinIO管理密码}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
      - ./minio/config:/root/.minio
    command: server /data --console-address ":9001"
    networks:
      - fafa-network

networks:
  fafa-network:
    driver: bridge
