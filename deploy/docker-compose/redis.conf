# FaFa Redis development configuration
bind 0.0.0.0
protected-mode no
port 6379
timeout 300
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
maxmemory 512mb
maxmemory-policy allkeys-lru
loglevel notice
requirepass fafa-redis
