# 公共配置：所有环境共享，环境差异见 application-{env}.yml
spring:
  application:
    name: fafa-java
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Java 21 虚拟线程：Tomcat 请求处理走虚拟线程
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # 小程序请求头携带：Authorization: {token}
  token-name: Authorization
  # 会话 30 天
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-cookie: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  file:
    path: ${LOG_PATH:./logs}
