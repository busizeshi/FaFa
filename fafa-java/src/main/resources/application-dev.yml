# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://192.168.1.14:3306/fafa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: fafa
    password: fafa_123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: 192.168.1.14
      port: 6379
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

# 日志级别
logging:
  level:
    root: INFO
    com.fafa: DEBUG
    com.baomidou.mybatisplus: DEBUG
    org.springframework.web: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/fafa-java-dev.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 10GB

# RocketMQ
rocketmq:
  name-server: 192.168.1.14:9876
  producer:
    group: fafa-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
  consumer:
    group: fafa-consumer-group

# MinIO
minio:
  endpoint: http://192.168.1.14:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket-name: fafa

# Knife4j 配置 (开发环境开启)
knife4j:
  enable: true
  setting:
    language: zh_cn

# 微信小程序配置 (开发环境)
wechat:
  appid: ${WECHAT_APPID:wx8cb5c0e52b67b79c}
  secret: ${WECHAT_SECRET:9f9724f24267bd238dcbbd5547f558cf}
  reminder-template-id: ${WECHAT_REMINDER_TEMPLATE_ID:}
  miniapp:
    appid: ${WECHAT_APPID:wx8cb5c0e52b67b79c}
    secret: ${WECHAT_SECRET:9f9724f24267bd238dcbbd5547f558cf}
    code2-session-url: https://api.weixin.qq.com/sns/jscode2session?appid={appid}&secret={secret}&js_code={code}&grant_type=authorization_code

# AI 服务
fafa:
  ai-service:
    base-url: http://127.0.0.1:8000
    timeout: 30000
