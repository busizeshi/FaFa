# 开发环境：中间件指向内网服务器 192.168.1.14（见 docs/服务器与中间件部署信息.md）
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.14:3306/fafa?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: fafa
    password: fafa_123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      validation-query: SELECT 1
      # 开发环境暴露监控页 /druid
      stat-view-servlet:
        enabled: true
        login-username: fafa
        login-password: fafa123
  data:
    redis:
      host: 192.168.1.14
      port: 6379
      database: 0

rocketmq:
  name-server: 192.168.1.14:9876
  producer:
    group: fafa_java_producer
    send-message-timeout: 5000

fafa:
  wechat:
    appid: ${WECHAT_APPID:wx8cb5c0e52b67b79c}
    secret: ${WECHAT_SECRET:9f9724f24267bd238dcbbd5547f558cf}
  python:
    base-url: http://localhost:8000
  internal-token: ${INTERNAL_TOKEN:fafa-internal-dev-2026}
  storage:
    # 开发环境使用腾讯云 COS（公有读桶，直链展示/AI 拉图）
    type: cos
  ai:
    dispatcher: http
    # 视频向量化需要百炼可访问的临时对象存储 URL
    media-url-expire-seconds: 3600
  pet:
    limit:
      normal: 2
      vip: 999
  media:
    # 单个照片大小上限（字节）
    photo-max-size-bytes: 10485760
    # 单个视频大小上限（字节）
    video-max-size-bytes: 52428800
    # 单批上传文件数上限
    batch-max-count: 20
  quota:
    storage:
      # 普通用户存储空间（字节）
      normal-bytes: 2147483648
      # VIP 存储空间（字节）
      vip-bytes: 21474836480
    ai-search:
      # 普通用户每月 AI 语义检索次数（VIP 不限）
      monthly-normal: 10
    food-recognition:
      # 普通用户每月食品包装识别次数
      monthly-normal: 5
      # VIP 用户每月食品包装识别次数
      monthly-vip: 50
    report-content:
      # 普通用户每月报告与内容生成次数；VIP 使用独立上限
      monthly-normal: 3
      monthly-vip: 10
  food:
    recognition:
      timeout-seconds: 90
      draft-retention-days: 7
      max-image-bytes: 10485760
      prompt-version: food-recognition-v1
    transition:
      min-days: 3
      max-days: 30
    score:
      policy-version: v1
      protein-source-partial-score: 12
      additive-flag-penalty: 5
      calcium-phosphorus-min-ratio: 1.0
      calcium-phosphorus-max-ratio: 2.0
  feeding:
    max-range-days: 366
    max-items-per-plan: 12
    recommendation-timeout-seconds: 45
    policy-version: v1
  expense:
    default-currency: CNY
    max-amount: 1000000.00
    max-range-days: 3660
    auto-sync-medical: true
    calculation-version: v1
  report:
    max-range-days: 3660
    max-media-count: 12
    generation-timeout-seconds: 90
    snapshot-version: report-facts-v1
    prompt-version: report-content-v1
    calculation-version: v1
    schedule-scan-cron: "0 */10 * * * *"
  collaboration:
    enabled: true
    normal-max-members: 0
    vip-max-members: 5
    caregiver-max-days: 30
    invitation-expire-minutes: 30
    invite-rate-limit-per-hour: 20
    accept-rate-limit-per-hour: 30
    audit-retention-days: 730
    reminder-max-retries: 3
    reminder-delivery-cron: "0 */5 * * * *"
  medical:
    visit-max-range-days: 366
    summary-max-range-days: 90
    summary-timeout-seconds: 45
    medication-future-tolerance-minutes: 5
    max-administration-times: 6
  health-alert:
    enabled: true
    scan-cron: "0 */30 * * * *"
    daily-window-days: 7
    increased-water-days: 3
    appetite-energy-decline-days: 2
    diarrhea-days: 2
    missed-medication-count: 2
    red-repeat-hours: 24
    retention-days: 180
  minio:
    # 视频 Embedding 需要百炼可访问的地址；本地联调可保持内网地址，云端联调通过 FAFA_MINIO_ENDPOINT 覆盖
    endpoint: ${FAFA_MINIO_ENDPOINT:http://192.168.1.14:9000}
    access-key: minioadmin
    secret-key: minioadmin123
    bucket-media: fafa-media
  cos:
    secret-id: ${FAFA_COS_SECRET_ID:}
    secret-key: ${FAFA_COS_SECRET_KEY:}
    region: ap-guangzhou
    bucket-name: fafa-dev-2026-1335105367

springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: auth
      paths-to-match: /auth/**
    - group: pet
      paths-to-match: /api/pets/**
    - group: record
      paths-to-match: /api/records/**
    - group: photo
      paths-to-match: /api/photos/**
    - group: tag
      paths-to-match: /api/tags/**
    - group: event-record
      paths-to-match: /api/event-records/**
    - group: quota
      paths-to-match: /api/quota/**
    - group: reminder
      paths-to-match: /api/reminders/**
    - group: medical
      paths-to-match: /api/medical/**
    - group: health-alert
      paths-to-match: /api/health-alerts/**
    - group: expense
      paths-to-match: /api/expenses/**
    - group: chat
      paths-to-match: /api/chat/**
    - group: food
      paths-to-match: /api/foods/**,/api/food-transitions/**
    - group: feeding
      paths-to-match: /api/feeding-plans/**,/api/feeding-analysis/**
    - group: report
      paths-to-match: /api/reports/**
    - group: content
      paths-to-match: /api/content-drafts/**,/api/content-schedules/**
    - group: collaboration
      paths-to-match: /api/pets/*/access,/api/pets/*/members/**,/api/pets/*/invitations/**,/api/pet-invitations/**
    - group: emergency
      paths-to-match: /api/pets/*/emergency-profile,/api/pets/*/emergency-card
    - group: audit
      paths-to-match: /api/pets/*/audit-logs/**

knife4j:
  enable: true
  production: false

logging:
  level:
    com.fafa: debug
