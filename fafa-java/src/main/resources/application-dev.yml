# 开发环境：中间件指向内网服务器 192.168.1.14（见 docs/服务器与中间件部署信息.md）
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.14:3306/fafa?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: fafa
    password: fafa_123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      validation-query: SELECT 1
      # 开发环境暴露监控页 /druid
      stat-view-servlet:
        enabled: true
        login-username: fafa
        login-password: fafa123
  data:
    redis:
      host: 192.168.1.14
      port: 6379
      database: 0

rocketmq:
  name-server: 192.168.1.14:9876
  producer:
    group: fafa_java_producer
    send-message-timeout: 5000

fafa:
  wechat:
    appid: ${WECHAT_APPID:wx8cb5c0e52b67b79c}
    secret: ${WECHAT_SECRET:9f9724f24267bd238dcbbd5547f558cf}
  python:
    base-url: http://localhost:8000
  internal-token: ${INTERNAL_TOKEN:fafa-internal-dev-2026}
  storage:
    type: minio
  ai:
    dispatcher: http
  pet:
    limit:
      normal: 2
      vip: 999
  minio:
    endpoint: http://192.168.1.14:9000
    access-key: minioadmin
    secret-key: minioadmin123
    bucket-media: fafa-media
    bucket-avatar: fafa-avatar

springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: auth
      paths-to-match: /auth/**
    - group: pet
      paths-to-match: /api/pets/**
    - group: record
      paths-to-match: /api/records/**
    - group: photo
      paths-to-match: /api/photos/**
    - group: reminder
      paths-to-match: /api/reminders/**
    - group: medical
      paths-to-match: /api/medical/**
    - group: expense
      paths-to-match: /api/expenses/**

knife4j:
  enable: true
  production: false

logging:
  level:
    com.fafa: debug
