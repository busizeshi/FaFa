# 生产环境：使用阿里云服务
spring:
  flyway:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/fafa?useUnicode=true&characterEncoding=UTF-8&useSSL=true&serverTimezone=Asia/Shanghai
    user: ${DB_USERNAME:fafa}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:3306/fafa?useUnicode=true&characterEncoding=UTF-8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:fafa}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 100
      validation-query: SELECT 1
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: 0

rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER}
  producer:
    group: fafa_java_producer
    send-message-timeout: 5000

fafa:
  wechat:
    appid: ${WECHAT_APPID}
    secret: ${WECHAT_SECRET}
  python:
    base-url: ${PYTHON_BASE_URL}
  internal-token: ${INTERNAL_TOKEN}
  storage:
    type: oss
  ai:
    dispatcher: rocketmq
  quota:
    food-recognition:
      monthly-normal: ${FOOD_RECOGNITION_MONTHLY_NORMAL:5}
      monthly-vip: ${FOOD_RECOGNITION_MONTHLY_VIP:50}
  food:
    recognition:
      timeout-seconds: ${FOOD_RECOGNITION_TIMEOUT_SECONDS:90}
      draft-retention-days: ${FOOD_RECOGNITION_DRAFT_RETENTION_DAYS:7}
      max-image-bytes: ${FOOD_RECOGNITION_MAX_IMAGE_BYTES:10485760}
      prompt-version: ${FOOD_RECOGNITION_PROMPT_VERSION:food-recognition-v1}
    score:
      policy-version: ${FOOD_SCORE_POLICY_VERSION:v1}
  feeding:
    max-range-days: ${FEEDING_MAX_RANGE_DAYS:366}
    max-items-per-plan: ${FEEDING_MAX_ITEMS_PER_PLAN:12}
    recommendation-timeout-seconds: ${FEEDING_RECOMMENDATION_TIMEOUT_SECONDS:45}
    policy-version: ${FEEDING_POLICY_VERSION:v1}
  expense:
    default-currency: ${EXPENSE_DEFAULT_CURRENCY:CNY}
    max-amount: ${EXPENSE_MAX_AMOUNT:1000000.00}
    max-range-days: ${EXPENSE_MAX_RANGE_DAYS:3660}
    auto-sync-medical: ${EXPENSE_AUTO_SYNC_MEDICAL:true}
    calculation-version: ${EXPENSE_CALCULATION_VERSION:v1}
  collaboration:
    enabled: ${FAFA_COLLABORATION_ENABLED:false}
    normal-max-members: ${FAFA_COLLABORATION_NORMAL_MAX_MEMBERS:0}
    vip-max-members: ${FAFA_COLLABORATION_VIP_MAX_MEMBERS:5}
    caregiver-max-days: ${FAFA_COLLABORATION_CAREGIVER_MAX_DAYS:30}
    invitation-expire-minutes: ${FAFA_COLLABORATION_INVITATION_EXPIRE_MINUTES:30}
    invite-rate-limit-per-hour: ${FAFA_COLLABORATION_INVITE_RATE_LIMIT:20}
    accept-rate-limit-per-hour: ${FAFA_COLLABORATION_ACCEPT_RATE_LIMIT:30}
    audit-retention-days: ${FAFA_COLLABORATION_AUDIT_RETENTION_DAYS:730}
    reminder-max-retries: ${FAFA_COLLABORATION_REMINDER_MAX_RETRIES:3}
    reminder-delivery-cron: "${FAFA_COLLABORATION_REMINDER_CRON:0 */5 * * * *}"
  pet:
    limit:
      normal: 2
      vip: 999
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME:fafa-prod}

springdoc:
  api-docs:
    enabled: false

knife4j:
  enable: false
  production: true

logging:
  level:
    com.fafa: info
