# 生产环境配置
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/fafa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

# 日志级别
logging:
  level:
    root: INFO
    com.fafa: INFO
    com.baomidou.mybatisplus: WARN

# RocketMQ
rocketmq:
  name-server: ${ROCKETMQ_HOST}:${ROCKETMQ_PORT}

# MinIO
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}

# AI 服务
fafa:
  ai-service:
    base-url: ${AI_SERVICE_URL}
