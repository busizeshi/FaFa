spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/fafa?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV}
  producer:
    group: fafa_java_producer
    send-message-timeout: 5000

fafa:
  storage:
    # 生产切换为阿里云 OSS（需引入 OSS SDK 并实现 OssStorageService）
    type: minio
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:fafa-media}

knife4j:
  enable: false
  production: true

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    com.fafa: info
    root: warn
