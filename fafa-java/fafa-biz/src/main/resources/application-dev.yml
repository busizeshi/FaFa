spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  mail:
    properties:
      "[mail.smtp.auth]": false
      "[mail.smtp.starttls.enable]": false
      "[mail.smtp.starttls.required]": false
dubbo:
  protocol:
    port: ${DUBBO_PORT:20882}
  registry:
    address: N/A
  application:
    qos-enable: false
fafa:
  identity:
    mail-from: dev@fafa.invalid
knife4j:
  enable: true
