# ==================================================================
# fafa-biz 入口配置（只做环境选择）
#
# 职责（2026-10-26 重构）：
#   本文件只负责「激活哪个环境的配置文件」；
#   全部通用配置（数据源/Redis/MQ/SMTP/Dubbo/Jackson/Flyway/MyBatis/Sa-Token/
#   management/springdoc/server 端口）已下沉到 application-{profile}.yml，
#   中间件连接信息在 Nacos 配置中心（namespace=fafa，见 docs/nacos配置文件/）。
#
# 环境切换：设环境变量 SPRING_PROFILES_ACTIVE=dev|test|prod（默认 dev）
# ==================================================================

spring:
  application:
    name: fafa-biz
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
