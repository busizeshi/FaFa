spring:
  application:
    name: identity-test
  datasource:
    url: jdbc:h2:mem:identity;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: false
  mail:
    host: localhost
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 3600
  is-concurrent: false
  is-share: false
  is-read-cookie: false
  is-read-body: false
  is-print: false
fafa:
  api:
    default-page-size: 20
    max-page-size: 100
  pet:
    deletion-waiting-days: 15
  quota:
    initial-storage-bytes: 0
  internal-rpc:
    secret: test-only-rpc-secret-at-least-thirty-two-characters
  identity:
    hmac-secret: test-only-secret-not-for-any-deployed-environment
    mail-from: tests@fafa.invalid
    challenge-ttl-seconds: 600
    resend-seconds: 60
    max-attempts: 5
    email-daily-limit: 10
    ip-hourly-limit: 30
    login-window-limit: 10
    reset-ticket-ttl-seconds: 600
    default-timezone: Asia/Hong_Kong
    password-memory-kib: 19456
    password-iterations: 2
logging:
  level:
    root: WARN
