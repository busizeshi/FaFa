spring:
  application:
    name: fafa-gateway
  profiles:
    default: nacos
---
spring:
  config:
    activate:
      on-profile: nacos
    import:
      - nacos:common.properties?group=FAFA_GROUP&refreshEnabled=true
      - nacos:fafa-gateway.properties?group=FAFA_GROUP&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.1.254:8848}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE:fafa}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.1.254:8848}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE:fafa}
