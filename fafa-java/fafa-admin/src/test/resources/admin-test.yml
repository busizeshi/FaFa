spring:
  application:
    name: admin-test
  datasource:
    url: jdbc:h2:mem:admin;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      accept-float-as-int: false
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
fafa:
  internal-rpc:
    secret: test-only-rpc-secret-at-least-thirty-two-characters
  admin:
    session-ttl-seconds: 3600
    login-window-seconds: 900
    login-attempt-limit: 10
    default-page-size: 20
    max-page-size: 100
    password-memory-kib: 19456
    password-iterations: 2
logging:
  level:
    root: WARN
dubbo:
  enabled: false
