# Redis 配置文件

# 绑定地址
bind 0.0.0.0

# 保护模式（生产环境建议开启密码后禁用）
protected-mode no

# 端口
port 6379

# 密码（建议设置）
# requirepass fafa_redis_123456

# 数据持久化 - RDB
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# 数据持久化 - AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 最大内存
maxmemory 2gb
maxmemory-policy allkeys-lru

# 日志
loglevel notice
logfile ""

# 其他优化
tcp-backlog 511
timeout 0
tcp-keepalive 300
