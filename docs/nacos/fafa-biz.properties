server.port=8082

# Biz 独占业务库与 Redis；连接主机/端口继承 common.properties。
spring.datasource.url=jdbc:mysql://${fafa.infrastructure.mysql.host}:${fafa.infrastructure.mysql.port}/${FAFA_BIZ_DB_NAME:fafa_wp02_biz_test}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${FAFA_DB_USERNAME:fafa_wp02_biz}
spring.datasource.password=${FAFA_DB_PASSWORD}
spring.flyway.enabled=true
spring.data.redis.host=${fafa.infrastructure.redis.host}
spring.data.redis.port=${fafa.infrastructure.redis.port}
spring.data.redis.password=${FAFA_REDIS_PASSWORD}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s

# SMTP 不在 Nacos 保存凭证；当前环境未部署 SMTP 时邮件功能保持不可用。
spring.mail.host=${FAFA_SMTP_HOST:localhost}
spring.mail.port=${FAFA_SMTP_PORT:1025}
spring.mail.username=${FAFA_SMTP_USERNAME:}
spring.mail.password=${FAFA_SMTP_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${FAFA_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${FAFA_SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=${FAFA_SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

dubbo.application.name=fafa-biz
dubbo.application.logger=slf4j
dubbo.config-center.address=N/A
dubbo.protocol.name=tri
dubbo.protocol.port=${DUBBO_PORT:20882}
dubbo.registry.address=nacos://${NACOS_SERVER_ADDR:192.168.1.254:8848}
dubbo.registry.check=false
dubbo.registry.username=${NACOS_USERNAME}
dubbo.registry.password=${NACOS_PASSWORD}
dubbo.registry.parameters.namespace=${NACOS_NAMESPACE:fafa}

knife4j.enable=false
knife4j.setting.language=zh_cn
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.arg-name-based-constructor-auto-mapping=true
sa-token.token-name=Authorization
sa-token.token-prefix=Bearer
sa-token.timeout=604800
sa-token.is-concurrent=false
sa-token.is-share=false
sa-token.is-read-cookie=false
sa-token.is-read-body=false
sa-token.is-print=false

fafa.api.default-page-size=20
fafa.api.max-page-size=100
fafa.pet.deletion-waiting-days=15
fafa.quota.initial-storage-bytes=${FAFA_INITIAL_STORAGE_BYTES:0}
fafa.internal-rpc.secret=${FAFA_INTERNAL_RPC_SECRET}
fafa.internal-rpc.max-skew-seconds=120
fafa.identity.hmac-secret=${FAFA_AUTH_HMAC_SECRET}
fafa.identity.mail-from=${FAFA_MAIL_FROM:}
fafa.identity.challenge-ttl-seconds=600
fafa.identity.resend-seconds=60
fafa.identity.max-attempts=5
fafa.identity.email-daily-limit=10
fafa.identity.ip-hourly-limit=30
fafa.identity.login-window-limit=10
fafa.identity.reset-ticket-ttl-seconds=600
fafa.identity.default-timezone=Asia/Hong_Kong
fafa.identity.password-memory-kib=19456
fafa.identity.password-iterations=2
fafa.identity.trusted-proxy-addresses=${FAFA_TRUSTED_PROXY_ADDRESSES:}

# WP04-A 私有图片上传；bucket 必须预先创建且禁止匿名读取。
fafa.media.storage.endpoint=${FAFA_MEDIA_ENDPOINT:}
fafa.media.storage.public-endpoint=${FAFA_MEDIA_PUBLIC_ENDPOINT:}
fafa.media.storage.bucket=${FAFA_MEDIA_BUCKET:fafa-media}
fafa.media.storage.access-key=${FAFA_MEDIA_ACCESS_KEY:}
fafa.media.storage.secret-key=${FAFA_MEDIA_SECRET_KEY:}
fafa.media.max-image-bytes=20971520
fafa.media.max-pixels=16000000
fafa.media.preview-edge=1024
fafa.media.upload-seconds=300
fafa.media.access-seconds=60
fafa.media.cleanup-enabled=true
fafa.media.cleanup-delay-ms=60000

# WP04 PDF/视频与持久化消息。不要把真实凭证写进 Data ID。
fafa.media.processing.max-document-bytes=20971520
fafa.media.processing.max-video-bytes=209715200
fafa.media.processing.max-playback-bytes=67108864
fafa.media.processing.max-video-seconds=180
fafa.media.processing.max-pdf-pages=200
fafa.media.processing.process-seconds=180
fafa.media.processing.lease-seconds=600
fafa.media.processing.max-attempts=3
fafa.media.processing.retention-seconds=86400
fafa.media.processing.ffmpeg=${FAFA_FFMPEG:ffmpeg}
fafa.media.processing.ffprobe=${FAFA_FFPROBE:ffprobe}
fafa.media.messaging-enabled=${FAFA_MEDIA_MESSAGING_ENABLED:false}
fafa.media.exchange=${FAFA_MEDIA_EXCHANGE:fafa.media}
fafa.media.queue=${FAFA_MEDIA_QUEUE:fafa.media.process}
fafa.media.dispatch-delay-ms=2000
spring.rabbitmq.host=${FAFA_RABBITMQ_HOST:192.168.1.254}
spring.rabbitmq.port=${FAFA_RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${FAFA_RABBITMQ_VHOST:/fafa}
spring.rabbitmq.username=${FAFA_RABBITMQ_USERNAME:}
spring.rabbitmq.password=${FAFA_RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.prefetch=1
management.health.rabbit.enabled=${FAFA_MEDIA_MESSAGING_ENABLED:false}
