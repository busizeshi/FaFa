# 所有 Java 服务共享的非敏感配置。数据库/Redis 密码不放入公共配置。
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.pattern.level=%5p [${spring.application.name:},%X{requestId:-}]

# 共享基础设施地址；不同运行环境通过同名环境变量覆盖。
fafa.infrastructure.mysql.host=${FAFA_MYSQL_HOST:192.168.1.254}
fafa.infrastructure.mysql.port=${FAFA_MYSQL_PORT:3306}
fafa.infrastructure.redis.host=${FAFA_REDIS_HOST:192.168.1.254}
fafa.infrastructure.redis.port=${FAFA_REDIS_PORT:6379}

# Admin 与 Biz 共用连接池约束；Gateway 不创建数据源。
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
