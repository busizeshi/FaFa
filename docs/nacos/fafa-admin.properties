server.port=8081

# 管理库账号与业务库账号隔离。连接主机/端口继承 common.properties。
spring.datasource.url=jdbc:mysql://${fafa.infrastructure.mysql.host}:${fafa.infrastructure.mysql.port}/${FAFA_ADMIN_DB_NAME:fafa_wp02_admin_test}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=${FAFA_ADMIN_DB_USERNAME:fafa_wp02_admin}
spring.datasource.password=${FAFA_ADMIN_DB_PASSWORD}
spring.flyway.locations=classpath:db/admin-migration

# Admin 通过签名 Dubbo 调用 Biz；RPC 密钥由运行环境注入。
dubbo.application.name=fafa-admin
dubbo.application.logger=slf4j
dubbo.consumer.timeout=5000
dubbo.consumer.retries=0
dubbo.config-center.address=N/A
dubbo.protocol.name=tri
dubbo.protocol.port=${DUBBO_PORT:-1}
dubbo.registry.address=nacos://${NACOS_SERVER_ADDR:192.168.1.254:8848}
dubbo.registry.check=false
dubbo.registry.username=${NACOS_USERNAME}
dubbo.registry.password=${NACOS_PASSWORD}
dubbo.registry.parameters.namespace=${NACOS_NAMESPACE:fafa}

knife4j.enable=true
knife4j.setting.language=zh_cn
fafa.internal-rpc.secret=${FAFA_INTERNAL_RPC_SECRET}
fafa.internal-rpc.max-skew-seconds=120
fafa.admin.session-ttl-seconds=3600
fafa.admin.login-window-seconds=900
fafa.admin.login-attempt-limit=10
fafa.admin.default-page-size=20
fafa.admin.max-page-size=100
fafa.admin.password-memory-kib=19456
fafa.admin.password-iterations=2
