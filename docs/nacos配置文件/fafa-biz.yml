# ==================================================================
# Nacos 服务专属配置（fafa-biz）
#
# 导入位置：
#   Namespace : fafa（Namespace ID，开发环境）
#   Group     : DEFAULT_GROUP
#   dataId    : fafa-biz.yml
#   格式      : yaml
#
# 使用约定：
#   1. 放 fafa-biz 服务专属的中间件连接（数据源、对象存储）与运营期可调整参数；
#      共享中间件（Redis/RabbitMQ/SMTP/Dubbo）在 common.yml；
#      仅启动引导项（Nacos 连接、应用名、端口）留本地 yml；
#   2. ⚠️ 密码类凭据（MySQL/Redis/RabbitMQ/SMTP）一律 ${ENV_VAR} 占位符，由环境变量注入；
#      COS 凭据为开发联调专用子账号（最小权限 QcloudCOSDataFullControl），
#      SecretId/SecretKey 明文存放于本配置中心（生产环境必须改为环境变量注入并轮换密钥）；
#   3. 优先级：application-{profile}.yml > 本文件 > application.yml > 代码默认值。
# ==================================================================

spring:
  datasource:
    # 单一业务库 fafa（biz/admin 共库，见中间件文档 §4.1；DDL 脚本见 docs/MySQL脚本.sql）
    # 注意：characterEncoding 需用 Java 编码名 UTF-8（Connector/J 自动映射 utf8mb4），
    # 写 utf8mb4 会导致 "Unsupported character encoding" 连接失败
    url: jdbc:mysql://${MYSQL_HOST:192.168.1.254}:3306/fafa?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:fafa}
    password: ${MYSQL_PASSWORD:fafa_123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池上限：开发环境收紧，防止个人机器占满服务端连接
      maximum-pool-size: 10
      minimum-idle: 2
      # 连接获取超时（毫秒）：超时快速失败优于线程堆积
      connection-timeout: 3000

# ---- 腾讯云 COS：正式对象存储（私有桶 + 短时签名 URL，见中间件文档 §5.1） ----
# 凭据一律经环境变量 COS_SECRET_ID / COS_SECRET_KEY 注入；
# ⚠️ 本文件是 Nacos 配置的仓库副本，仅保留占位符：开发环境实际值只在
#    Nacos 控制台（namespace=fafa）维护，禁止把 SecretId/SecretKey 提交到 Git。
cos:
  secret-id: ${COS_SECRET_ID}
  secret-key: ${COS_SECRET_KEY}
  bucket: fafa-dev-2026-1335105367
  region: ap-guangzhou
  # 短时签名 URL 有效期（秒）
  presign-expire-seconds: 600
  # 上传大小上限（字节）：与 bootstrap 的 uploadCapabilities 对齐（M06 媒体模块启用）
  max-image-bytes: 20971520
  max-video-bytes: 524288000
