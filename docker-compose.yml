services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fafa}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-nameserver:
    image: apache/rocketmq:5.5.1
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    volumes:
      - ./data/rocketmq/nameserver-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.5.1
    restart: unless-stopped
    depends_on:
      - rocketmq-nameserver
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    command: ["sh", "mqbroker", "-n", "rocketmq-nameserver:9876"]
    volumes:
      - ./data/rocketmq/broker-logs:/home/rocketmq/logs
      - ./data/rocketmq/store:/home/rocketmq/store

  fafa-python:
    build:
      context: ./fafa-python
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in .env.production}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QDRANT_URL: ${QDRANT_URL:-http://192.168.1.14:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      JAVA_BASE_URL: http://fafa-java:8080
      INTERNAL_TOKEN: ${FAFA_INTERNAL_TOKEN:?Set FAFA_INTERNAL_TOKEN in .env.production}
      CONSUMER_ENABLED: "false"
      LOG_PATH: /app/logs/fafa-python
    volumes:
      - ./logs/python:/app/logs/fafa-python
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  fafa-java:
    build:
      context: ./fafa-java
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-nameserver:
        condition: service_started
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
      LOG_PATH: /app/logs/fafa-java
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
      ROCKETMQ_NAMESERVER: rocketmq-nameserver:9876
      PYTHON_BASE_URL: http://fafa-python:8000
      INTERNAL_TOKEN: ${FAFA_INTERNAL_TOKEN:?Set FAFA_INTERNAL_TOKEN in .env.production}
      WECHAT_APPID: ${WECHAT_APP_ID:?Set WECHAT_APP_ID in .env.production}
      WECHAT_SECRET: ${WECHAT_APP_SECRET:?Set WECHAT_APP_SECRET in .env.production}
      FAFA_STORAGE_TYPE: cos
      FAFA_AI_DISPATCHER: http
      FAFA_COS_SECRETID: ${COS_SECRET_ID:?Set COS_SECRET_ID in .env.production}
      FAFA_COS_SECRETKEY: ${COS_SECRET_KEY:?Set COS_SECRET_KEY in .env.production}
      FAFA_COS_REGION: ${COS_REGION:-ap-guangzhou}
      FAFA_COS_BUCKETNAME: ${COS_BUCKET_NAME:?Set COS_BUCKET_NAME in .env.production}
    ports:
      - "192.168.1.15:${JAVA_HTTP_PORT:-8081}:8080"
    volumes:
      - ./logs/java:/app/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true
