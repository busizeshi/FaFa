[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "fafa-python"
version = "0.1.0"
description = "FaFa AI service built with FastAPI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.140.12,<0.141.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
