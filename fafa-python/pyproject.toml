# ==================================================================
# FaFa Python AI 服务项目定义（uv 管理）
#
# 结构对应《FaFa_企业级技术架构与服务端开发规范_v1.0》§5.2：
#   src/fafa_ai/{api, application, workflows, integrations, tools, messaging, config}
#
# 使用方式（首次）：
#   1. 安装 uv：pip install uv  （或官方安装脚本）
#   2. 同步依赖（生成虚拟环境 .venv 并按 uv.lock 精确安装）：uv sync
#   3. 启动服务：uv run uvicorn fafa_ai.main:app --host 0.0.0.0 --port 8090
# ==================================================================

[project]
name = "fafa-ai"
version = "0.1.0"
description = "FaFa AI 服务：LangGraph/LangChain 工作流、Qwen 模型适配、OCR/语义处理（不直连业务 MySQL，不拥有业务事实）"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "FaFa 项目组" }]

dependencies = [
    # ---- Web 框架 ----
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # ---- 配置与契约校验（架构规范：Pydantic 验证一切边界输入） ----
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # ---- 模型编排：LangChain（模型/提示/检索器集成）+ LangGraph（有状态工作流） ----
    "langchain>=0.3,<2.0",
    "langchain-core>=0.3,<2.0",
    "langgraph>=0.2,<2.0",
    # ---- 阿里云 DashScope SDK（Qwen 模型统一入口） ----
    "dashscope>=1.20,<2.0",
    # ---- 向量检索：Qdrant（可重建的语义索引，不作为授权依据） ----
    "qdrant-client>=1.12,<2.0",
    # ---- 异步消息：RabbitMQ 消费（Python AI Worker） ----
    "aio-pika>=9.4,<10.0",
    # ---- 对象存储：开发期 MinIO（生产为阿里云 OSS，适配器层隔离差异） ----
    "minio>=7.2,<8.0",
    # ---- HTTP 客户端：调用 biz 内网接口 / 模型 API ----
    "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

# ---- 构建后端：src 布局打包 ----
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fafa_ai"]

# ---- Ruff 代码质量基线 ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]  # 基础正确性 + import 排序 + py312 升级建议 + bugbear

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
