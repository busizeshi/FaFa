<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>照片墙</title>
  <style id="theme-vars">
:root, html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
.no-scrollbar::-webkit-scrollbar { display:none; }
.no-scrollbar { scrollbar-width:none; -ms-overflow-style:none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh; padding-bottom:56px;">

  <!-- Header -->
  <header class="sticky top-0 z-20 flex items-center gap-3 px-4 py-3" style="background-color:var(--fafa-card); border-bottom:1px solid var(--fafa-border);">
    <button data-dom-id="back-timeline" class="flex items-center justify-center w-9 h-9 rounded-full" style="background-color:var(--fafa-neutral-100);" aria-label="返回">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-900);"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="text-lg font-semibold" style="color:var(--fafa-neutral-900);">照片墙</h1>
    <span class="ml-auto text-xs" style="color:var(--fafa-neutral-500);">共 12 张</span>
  </header>

  <!-- AI search bar -->
  <div class="px-4 pt-3">
    <div class="ai-element flex items-center gap-2 px-4 py-2.5">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-primary-500); flex-shrink:0;">
        <path d="M12 3l1.6 4.3L18 9l-4.4 1.7L12 15l-1.6-4.3L6 9l4.4-1.7L12 3z"/>
        <path d="M19 14l.8 2.1L22 17l-2.2.9L19 20l-.8-2.1L16 17l2.2-.9L19 14z"/>
      </svg>
      <input data-dom-id="ai-photo-search" type="text" placeholder="找一下去年夏天在阳台睡觉的照片..." class="flex-1 bg-transparent outline-none text-sm" style="color:var(--fafa-neutral-900);" />
      <span class="text-[10px] px-2 py-0.5 rounded-full" style="background-color:var(--fafa-primary-500); color:var(--fafa-primary-foreground);">AI</span>
    </div>
  </div>

  <!-- Tag filter row -->
  <div class="pt-3 no-scrollbar" style="overflow-x:auto;">
    <div class="flex gap-2 whitespace-nowrap px-4">
      <button data-dom-id="tag-all" class="px-3.5 py-1.5 rounded-full text-sm font-medium" style="background-color:var(--fafa-primary-500); color:var(--fafa-primary-foreground);">全部</button>
      <button data-dom-id="tag-balcony" class="px-3.5 py-1.5 rounded-full text-sm" style="background-color:var(--fafa-card); color:var(--fafa-neutral-700); border:1px solid var(--fafa-border);">阳台</button>
      <button data-dom-id="tag-sleep" class="px-3.5 py-1.5 rounded-full text-sm" style="background-color:var(--fafa-card); color:var(--fafa-neutral-700); border:1px solid var(--fafa-border);">睡觉</button>
      <button data-dom-id="tag-play" class="px-3.5 py-1.5 rounded-full text-sm" style="background-color:var(--fafa-card); color:var(--fafa-neutral-700); border:1px solid var(--fafa-border);">玩耍</button>
      <button data-dom-id="tag-eat" class="px-3.5 py-1.5 rounded-full text-sm" style="background-color:var(--fafa-card); color:var(--fafa-neutral-700); border:1px solid var(--fafa-border);">吃饭</button>
      <button data-dom-id="tag-outdoor" class="px-3.5 py-1.5 rounded-full text-sm" style="background-color:var(--fafa-card); color:var(--fafa-neutral-700); border:1px solid var(--fafa-border);">户外</button>
      <button data-dom-id="tag-box" class="px-3.5 py-1.5 rounded-full text-sm" style="background-color:var(--fafa-card); color:var(--fafa-neutral-700); border:1px solid var(--fafa-border);">纸箱</button>
    </div>
  </div>

  <!-- Photo grid -->
  <div class="px-4 pt-4 pb-4">

    <!-- 2026年8月 -->
    <div class="flex items-center gap-2 mb-2.5">
      <h2 class="text-sm font-semibold" style="color:var(--fafa-neutral-900);">2026年8月</h2>
      <span class="text-xs" style="color:var(--fafa-neutral-500);">6 张</span>
      <div class="flex-1 h-px" style="background-color:var(--fafa-border);"></div>
    </div>
    <div class="grid grid-cols-3 gap-2 mb-5">
      <div data-dom-id="photo-thumb-1" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#F5E0D5,#D38057);"></div>
      <div data-dom-id="photo-thumb-2" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#EFEAE1,#D4CDC0);"></div>
      <div data-dom-id="photo-thumb-3" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#FAF0EB,#E0A585);">
        <div data-dom-id="photo-identifying" class="absolute inset-0 flex items-center justify-center" style="background:rgba(31,36,33,0.32);">
          <div class="flex flex-col items-center gap-1">
            <svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            <span class="text-[10px] font-medium" style="color:#FFFFFF;">AI识别中</span>
          </div>
        </div>
      </div>
      <div data-dom-id="photo-thumb-4" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#E7E1D7,#B8B0A3);"></div>
      <div data-dom-id="photo-thumb-5" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#F5E0D5,#D38057);"></div>
      <div data-dom-id="photo-thumb-6" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#EFEAE1,#D4CDC0);"></div>
    </div>

    <!-- 2026年7月 -->
    <div class="flex items-center gap-2 mb-2.5">
      <h2 class="text-sm font-semibold" style="color:var(--fafa-neutral-900);">2026年7月</h2>
      <span class="text-xs" style="color:var(--fafa-neutral-500);">6 张</span>
      <div class="flex-1 h-px" style="background-color:var(--fafa-border);"></div>
    </div>
    <div class="grid grid-cols-3 gap-2">
      <div data-dom-id="photo-thumb-7" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#FAF0EB,#E0A585);"></div>
      <div data-dom-id="photo-thumb-8" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#E7E1D7,#B8B0A3);"></div>
      <div data-dom-id="photo-thumb-9" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#F5E0D5,#D38057);"></div>
      <div data-dom-id="photo-thumb-10" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#EFEAE1,#D4CDC0);"></div>
      <div data-dom-id="photo-thumb-11" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#FAF0EB,#E0A585);"></div>
      <div data-dom-id="photo-thumb-12" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#E7E1D7,#B8B0A3);"></div>
    </div>

  </div>

  <!-- Floating upload button + batch manage (centered fixed container) -->
  <div class="fixed bottom-0 left-0 right-0 z-30" style="max-width:414px; margin:0 auto; pointer-events:none;">
    <button data-dom-id="upload-photo-btn" class="absolute w-12 h-12 rounded-full flex items-center justify-center" style="bottom:64px; right:16px; background-color:var(--fafa-primary-500); color:var(--fafa-primary-foreground); box-shadow:0 6px 16px rgba(196,97,47,0.32); pointer-events:auto;" aria-label="上传照片">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
        <circle cx="12" cy="13" r="3"/>
      </svg>
    </button>
    <div class="flex items-center justify-center py-3" style="background-color:var(--fafa-card); border-top:1px solid var(--fafa-border); pointer-events:auto;">
      <button data-dom-id="batch-manage" class="text-sm font-medium" style="color:var(--fafa-primary-600);">批量管理</button>
    </div>
  </div>

</body>
</html>
