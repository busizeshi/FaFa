<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>排便记录</title>
  <style id="theme-vars">
    :root, html.light {
      --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
      --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
      --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
      --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
      --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
      --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
      --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06);
    }
    body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
    .card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
    .ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
    .tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
    * { box-sizing:border-box; }
    input, textarea, button, select { font-family:inherit; }
    .field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
    .field-input { width:100%; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; }
    .type-card { flex:1; padding:18px 12px; border-radius:var(--fafa-radius-lg); border:1.5px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; }
    .type-card-active { border:1.5px solid var(--fafa-primary-500); background:var(--fafa-primary-50); }
    .status-btn { padding:6px 16px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); }
    .status-btn-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-500); color:#fff; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

  <!-- Header -->
  <header style="position:sticky; top:0; z-index:10; background-color:var(--fafa-neutral-100); border-bottom:1px solid var(--fafa-neutral-200); padding:10px 12px; display:flex; align-items:center; gap:4px;">
    <button data-dom-id="back-excretion-list" style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; background:transparent; border:none; cursor:pointer; color:var(--fafa-neutral-900);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 style="font-size:17px; font-weight:600; color:var(--fafa-neutral-900); margin:0;">排便记录</h1>
  </header>

  <!-- 记录时间 -->
  <div class="card-surface" style="margin:16px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between;">
    <span class="field-label">记录时间</span>
    <button data-dom-id="input-time" style="display:flex; align-items:center; gap:4px; background:transparent; border:none; cursor:pointer; font-size:15px; color:var(--fafa-primary-600);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="color:var(--fafa-neutral-600);"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>10:20</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- 类型 -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:12px;">类型</label>
    <div style="display:flex; gap:12px;">
      <button data-dom-id="type-poop" class="type-card type-card-active">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="color:var(--fafa-primary-500);"><path d="M7 14a4 4 0 010-8 5 5 0 019.9-1 3.5 3.5 0 01.6 6.95L7 14z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 18l-1 2M13 18l-1 2M17 18l-1 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span style="font-size:14px; font-weight:600; color:var(--fafa-primary-700);">排便</span>
      </button>
      <button data-dom-id="type-pee" class="type-card">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="color:var(--fafa-neutral-500);"><path d="M12 3s6 7 6 11a6 6 0 01-12 0c0-4 6-11 6-11z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span style="font-size:14px; font-weight:600; color:var(--fafa-neutral-700);">排尿</span>
      </button>
    </div>
  </div>

  <!-- 状态 (排便) -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:10px;">状态</label>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button data-dom-id="status-normal" class="status-btn status-btn-active">正常</button>
      <button data-dom-id="status-soft" class="status-btn">偏软</button>
      <button data-dom-id="status-diarrhea" class="status-btn">腹泻</button>
      <button data-dom-id="status-hard" class="status-btn">便秘</button>
      <button data-dom-id="status-blood" class="status-btn">带血</button>
    </div>
  </div>

  <!-- 颜色描述 -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:8px;">颜色描述</label>
    <input type="text" data-dom-id="input-color" placeholder="如：深棕色" class="field-input">
  </div>

  <!-- 照片上传 -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:10px;">照片</label>
    <button data-dom-id="upload-photo" class="ai-element" style="width:100%; padding:24px 12px; display:flex; flex-direction:column; align-items:center; gap:6px; border:none; cursor:pointer;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="color:var(--fafa-primary-400);"><rect x="3" y="6" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="13" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 6l1.5-2h5L16 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size:13px; color:var(--fafa-primary-600); font-weight:500;">点击上传照片</span>
    </button>
    <div style="display:flex; align-items:center; gap:4px; margin-top:8px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="color:var(--fafa-neutral-400);"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.5"/></svg>
      <span style="font-size:11px; color:var(--fafa-neutral-500);">默认仅自己可见</span>
    </div>
  </div>

  <!-- 备注 -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:8px;">备注</label>
    <textarea data-dom-id="input-notes" rows="3" placeholder="补充说明..." style="width:100%; padding:10px 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; resize:none;"></textarea>
  </div>

  <!-- Bottom action -->
  <div style="padding:4px 16px 32px;">
    <button data-dom-id="btn-save" style="width:100%; height:48px; border:none; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; font-size:16px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(196,97,47,0.25);">保存</button>
  </div>

</body>
</html>
