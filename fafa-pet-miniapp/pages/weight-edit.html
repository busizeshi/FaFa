<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>体重记录</title>
  <style id="theme-vars">
    :root, html.light {
      --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
      --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
      --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
      --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
      --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
      --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
      --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06);
    }
    body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
    .card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
    .ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
    .tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
    * { box-sizing:border-box; }
    input, textarea, button, select { font-family:inherit; }
    .field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
    .field-input { width:100%; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; }
    .bcs-btn { flex:1; height:36px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); font-size:14px; font-weight:600; cursor:pointer; }
    .bcs-btn-active { border:1px solid var(--state-success); background:var(--state-success); color:#fff; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

  <!-- Header -->
  <header style="position:sticky; top:0; z-index:10; background-color:var(--fafa-neutral-100); border-bottom:1px solid var(--fafa-neutral-200); padding:10px 12px; display:flex; align-items:center; gap:4px;">
    <button data-dom-id="back-weight-list" style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; background:transparent; border:none; cursor:pointer; color:var(--fafa-neutral-900);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 style="font-size:17px; font-weight:600; color:var(--fafa-neutral-900); margin:0;">体重记录</h1>
  </header>

  <!-- Date picker -->
  <div class="card-surface" style="margin:16px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between;">
    <span class="field-label">日期</span>
    <button data-dom-id="input-date" style="display:flex; align-items:center; gap:6px; background:transparent; border:none; cursor:pointer; font-size:15px; color:var(--fafa-primary-600);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="color:var(--fafa-neutral-600);"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>2026年8月18日</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- Large weight display -->
  <div class="card-surface" style="margin:0 16px 16px; padding:28px 16px; text-align:center;">
    <div style="font-size:13px; color:var(--fafa-neutral-600); margin-bottom:6px;">当前体重</div>
    <div data-dom-id="input-weight-display" style="display:flex; align-items:baseline; justify-content:center; gap:6px; cursor:pointer;">
      <span style="font-size:64px; font-weight:700; color:var(--fafa-primary-500); line-height:1;">5.2</span>
      <span style="font-size:22px; color:var(--fafa-neutral-600); font-weight:600;">kg</span>
    </div>
    <div style="display:flex; align-items:center; justify-content:center; gap:4px; margin-top:10px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="color:var(--fafa-neutral-400);"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size:12px; color:var(--fafa-neutral-500);">点击数字键盘修改</span>
    </div>
  </div>

  <!-- BCS selector -->
  <div class="card-surface" style="margin:0 16px 16px; padding:16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <span class="field-label">体况评分 (BCS)</span>
      <span style="font-size:12px; color:var(--fafa-neutral-500);">1-9 分</span>
    </div>
    <div style="display:flex; gap:6px;">
      <button data-dom-id="bcs-1" class="bcs-btn">1</button>
      <button data-dom-id="bcs-2" class="bcs-btn">2</button>
      <button data-dom-id="bcs-3" class="bcs-btn">3</button>
      <button data-dom-id="bcs-4" class="bcs-btn">4</button>
      <button data-dom-id="bcs-5" class="bcs-btn bcs-btn-active">5</button>
      <button data-dom-id="bcs-6" class="bcs-btn">6</button>
      <button data-dom-id="bcs-7" class="bcs-btn">7</button>
      <button data-dom-id="bcs-8" class="bcs-btn">8</button>
      <button data-dom-id="bcs-9" class="bcs-btn">9</button>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:10px; padding:0 2px; font-size:11px; color:var(--fafa-neutral-500);">
      <span style="color:var(--state-info);">消瘦</span>
      <span style="color:var(--state-info);">偏瘦</span>
      <span style="color:var(--state-success); font-weight:600;">理想</span>
      <span style="color:var(--state-warning);">偏胖</span>
      <span style="color:var(--state-error);">肥胖</span>
    </div>
  </div>

  <!-- 备注 -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:8px;">备注</label>
    <textarea data-dom-id="input-notes" rows="3" placeholder="补充说明..." style="width:100%; padding:10px 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; resize:none;"></textarea>
  </div>

  <!-- Same-day duplicate warning (hidden by default) -->
  <div data-dom-id="duplicate-warning" style="display:none; margin:0 16px 16px; padding:12px 14px; border-radius:var(--fafa-radius-md); background:#FDF1EE; border:1px solid #F3D4CE; align-items:center; justify-content:space-between;">
    <span style="font-size:13px; color:var(--state-error); display:flex; align-items:center; gap:6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 8v5M12 16v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      当天已有体重记录
    </span>
    <a style="font-size:13px; color:var(--fafa-primary-600); font-weight:500; cursor:pointer;">去编辑</a>
  </div>

  <!-- Bottom action -->
  <div style="padding:4px 16px 32px;">
    <button data-dom-id="btn-save" style="width:100%; height:48px; border:none; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; font-size:16px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(196,97,47,0.25);">保存</button>
  </div>

</body>
</html>
