<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>饮水记录</title>
  <style id="theme-vars">
/* ============================================
   FaFa Pet Life Assistant - Brand CSS
   Warm Earth Tones · Terracotta Orange · Cream
   ============================================ */
:root,
html.light {
  /* --- Primary Scale (Terracotta Orange) --- */
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  /* --- Neutral Warm Scale --- */
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  /* --- State Colors --- */
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  /* --- Semantic Aliases --- */
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  /* --- Radius Scale --- */
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  /* --- Typography --- */
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  /* --- Shadows --- */
  --shadow-card:0 2px 8px rgba(31,36,33,0.04);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; font-size:16px; line-height:1.6; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
.no-scrollbar::-webkit-scrollbar { display:none; }
.no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
.fab { position:fixed; bottom:24px; right:calc((100vw - 414px)/2 + 16px); width:56px; height:56px; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; border:none; box-shadow:0 6px 18px rgba(196,97,47,0.32); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; z-index:40; }
.pill { display:inline-flex; align-items:center; justify-content:center; border-radius:var(--fafa-radius-full); padding:7px 16px; font-size:13px; font-weight:600; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-0); color:var(--fafa-neutral-700); white-space:nowrap; cursor:pointer; }
.pill-active { background:var(--fafa-primary-500); color:var(--fafa-primary-foreground); border-color:var(--fafa-primary-500); }
.tag { display:inline-flex; align-items:center; border-radius:var(--fafa-radius-full); padding:2px 9px; font-size:11px; font-weight:600; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh; padding-bottom:96px;">

  <!-- Custom Header -->
  <header style="position:sticky; top:0; z-index:30; height:48px; padding:0 16px; box-sizing:border-box; background-color:var(--fafa-neutral-100); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--fafa-neutral-200);">
    <button data-dom-id="back-home" type="button" aria-label="返回" style="display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; color:var(--fafa-neutral-900); background:transparent; border:none; cursor:pointer; padding:0;">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <h1 style="font-size:17px; font-weight:700; line-height:1.4; color:var(--fafa-neutral-950); margin:0; letter-spacing:0.3px;">饮水记录</h1>
    <span style="width:32px; height:32px; display:inline-block;"></span>
  </header>

  <!-- Content -->
  <div style="padding:16px;">

    <!-- Daily Stats Card -->
    <div data-dom-id="water-stats-card" class="card-surface" style="padding:18px 18px 16px; position:relative; overflow:hidden;">
      <!-- decorative droplet -->
      <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 24 24" fill="var(--fafa-primary-50)" stroke="none" style="position:absolute; right:-14px; top:-18px; opacity:0.9;"><path d="M12 2.5S6 9 6 14a6 6 0 0 0 12 0c0-5-6-11.5-6-11.5Z"/></svg>
      <div style="position:relative; display:flex; align-items:center; gap:6px; color:var(--fafa-neutral-600); font-size:13px; font-weight:600;">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5S6 9 6 14a6 6 0 0 0 12 0c0-5-6-11.5-6-11.5Z"/></svg>
        <span>今日饮水</span>
      </div>
      <div style="position:relative; margin-top:6px; display:flex; align-items:baseline; gap:4px;">
        <span style="font-size:40px; font-weight:800; color:var(--fafa-primary-600); line-height:1.1; letter-spacing:-0.02em;">150</span>
        <span style="font-size:18px; font-weight:700; color:var(--fafa-primary-500);">ml</span>
      </div>
      <!-- comparison -->
      <div style="position:relative; margin-top:8px; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--fafa-neutral-600);">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--state-warning)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        <span>较日均 <b style="color:var(--state-warning);">165ml</b> 少 15ml</span>
      </div>
      <!-- progress bar -->
      <div style="position:relative; margin-top:14px;">
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--fafa-neutral-500); margin-bottom:5px;">
          <span>今日进度</span>
          <span>目标 200ml</span>
        </div>
        <div style="height:8px; width:100%; background:var(--fafa-primary-100); border-radius:var(--fafa-radius-full); overflow:hidden;">
          <div style="height:100%; width:75%; background:linear-gradient(90deg, var(--fafa-primary-400), var(--fafa-primary-600)); border-radius:var(--fafa-radius-full);"></div>
        </div>
      </div>
    </div>

    <!-- Date Range Filter -->
    <div style="display:flex; gap:8px; margin-top:16px;">
      <button data-dom-id="filter-7days" type="button" class="pill pill-active">近7天</button>
      <button data-dom-id="filter-30days" type="button" class="pill">近30天</button>
      <button data-dom-id="filter-all" type="button" class="pill">全部</button>
    </div>

    <!-- Date Group: 8月18日 -->
    <section style="margin-top:18px;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px;">
        <span style="font-size:13px; font-weight:700; color:var(--fafa-neutral-700);">8月18日 · 今天</span>
        <span style="font-size:12px; color:var(--fafa-neutral-500);">合计 200ml</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <!-- record 1 -->
        <div data-dom-id="water-record-1" class="card-surface" style="padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer;">
          <div style="width:40px; height:40px; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-50); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="var(--fafa-primary-500)" stroke="none"><path d="M12 2.5S6 9 6 14a6 6 0 0 0 12 0c0-5-6-11.5-6-11.5Z"/></svg>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; font-weight:700; color:var(--fafa-neutral-950);">09:30</div>
            <div style="font-size:12px; color:var(--fafa-neutral-500); margin-top:2px;">自动检测 · 饮水机</div>
          </div>
          <div style="font-size:20px; font-weight:800; color:var(--fafa-primary-600);">150<span style="font-size:12px; font-weight:600; color:var(--fafa-primary-400);">ml</span></div>
          <div style="display:flex; align-items:center; gap:3px; color:var(--fafa-neutral-400); margin-left:4px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </div>
        </div>
        <!-- record 2 -->
        <div data-dom-id="water-record-2" class="card-surface" style="padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer;">
          <div style="width:40px; height:40px; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-50); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="var(--fafa-primary-500)" stroke="none"><path d="M12 2.5S6 9 6 14a6 6 0 0 0 12 0c0-5-6-11.5-6-11.5Z"/></svg>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; font-weight:700; color:var(--fafa-neutral-950);">14:00</div>
            <div style="font-size:12px; color:var(--fafa-neutral-500); margin-top:2px;">手动记录</div>
          </div>
          <div style="font-size:20px; font-weight:800; color:var(--fafa-primary-600);">50<span style="font-size:12px; font-weight:600; color:var(--fafa-primary-400);">ml</span></div>
          <div style="display:flex; align-items:center; gap:3px; color:var(--fafa-neutral-400); margin-left:4px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </div>
        </div>
      </div>
    </section>

    <!-- Date Group: 8月17日 -->
    <section style="margin-top:18px;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px;">
        <span style="font-size:13px; font-weight:700; color:var(--fafa-neutral-700);">8月17日 · 昨天</span>
        <span style="font-size:12px; color:var(--fafa-neutral-500);">合计 280ml</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <!-- record 3 -->
        <div data-dom-id="water-record-3" class="card-surface" style="padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer;">
          <div style="width:40px; height:40px; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-50); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="var(--fafa-primary-500)" stroke="none"><path d="M12 2.5S6 9 6 14a6 6 0 0 0 12 0c0-5-6-11.5-6-11.5Z"/></svg>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; font-weight:700; color:var(--fafa-neutral-950);">08:00</div>
            <div style="font-size:12px; color:var(--fafa-neutral-500); margin-top:2px;">自动检测 · 饮水机</div>
          </div>
          <div style="font-size:20px; font-weight:800; color:var(--fafa-primary-600);">200<span style="font-size:12px; font-weight:600; color:var(--fafa-primary-400);">ml</span></div>
          <div style="display:flex; align-items:center; gap:3px; color:var(--fafa-neutral-400); margin-left:4px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </div>
        </div>
        <!-- record 4 -->
        <div data-dom-id="water-record-4" class="card-surface" style="padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer;">
          <div style="width:40px; height:40px; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-50); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="var(--fafa-primary-500)" stroke="none"><path d="M12 2.5S6 9 6 14a6 6 0 0 0 12 0c0-5-6-11.5-6-11.5Z"/></svg>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; font-weight:700; color:var(--fafa-neutral-950);">18:00</div>
            <div style="font-size:12px; color:var(--fafa-neutral-500); margin-top:2px;">手动记录</div>
          </div>
          <div style="font-size:20px; font-weight:800; color:var(--fafa-primary-600);">80<span style="font-size:12px; font-weight:600; color:var(--fafa-primary-400);">ml</span></div>
          <div style="display:flex; align-items:center; gap:3px; color:var(--fafa-neutral-400); margin-left:4px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </div>
        </div>
      </div>
    </section>

    <!-- swipe hint -->
    <div style="text-align:center; font-size:11px; color:var(--fafa-neutral-400); margin-top:18px; display:flex; align-items:center; justify-content:center; gap:4px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span>左滑记录可删除</span>
    </div>

  </div>

  <!-- Floating Add Button -->
  <button data-dom-id="add-water" type="button" class="fab" aria-label="添加饮水记录">
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </button>

</body>
</html>
