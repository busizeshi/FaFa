<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>事件记录</title>
  <style id="theme-vars">
/* ============================================
   FaFa Pet Life Assistant - Brand CSS
   Warm Earth Tones · Terracotta Orange · Cream
   ============================================ */
:root,
html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; font-size:16px; line-height:1.6; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
.no-scrollbar::-webkit-scrollbar { display:none; }
.no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
.fab { position:fixed; bottom:24px; right:calc((100vw - 414px)/2 + 16px); width:56px; height:56px; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; border:none; box-shadow:0 6px 18px rgba(196,97,47,0.32); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; z-index:40; }
.pill { display:inline-flex; align-items:center; justify-content:center; gap:4px; border-radius:var(--fafa-radius-full); padding:7px 14px; font-size:13px; font-weight:600; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-0); color:var(--fafa-neutral-700); white-space:nowrap; cursor:pointer; flex-shrink:0; }
.pill-active { background:var(--fafa-primary-500); color:var(--fafa-primary-foreground); border-color:var(--fafa-primary-500); }
.ai-tag { display:inline-flex; align-items:center; gap:4px; border-radius:var(--fafa-radius-full); padding:3px 9px; font-size:11px; font-weight:600; border:1.5px dashed var(--fafa-primary-300); background:var(--fafa-primary-50); color:var(--fafa-primary-700); }
.meta-chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--fafa-neutral-600); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh; padding-bottom:96px;">

  <!-- Custom Header -->
  <header style="position:sticky; top:0; z-index:30; height:48px; padding:0 16px; box-sizing:border-box; background-color:var(--fafa-neutral-100); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--fafa-neutral-200);">
    <button data-dom-id="back-home" type="button" aria-label="返回" style="display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; color:var(--fafa-neutral-900); background:transparent; border:none; cursor:pointer; padding:0;">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <h1 style="font-size:17px; font-weight:700; line-height:1.4; color:var(--fafa-neutral-950); margin:0; letter-spacing:0.3px;">事件记录</h1>
    <span style="width:32px; height:32px; display:inline-block;"></span>
  </header>

  <!-- Event Type Filter (horizontal scroll) -->
  <div class="no-scrollbar" style="position:sticky; top:48px; z-index:20; background:var(--fafa-neutral-100); padding:12px 16px 8px; display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; border-bottom:1px solid var(--fafa-neutral-200);">
    <button data-dom-id="event-filter-all" type="button" class="pill pill-active">全部</button>
    <button data-dom-id="event-filter-bath" type="button" class="pill">🛁 洗澡</button>
    <button data-dom-id="event-filter-grooming" type="button" class="pill">✂️ 美容</button>
    <button data-dom-id="event-filter-vet" type="button" class="pill">🏥 就医</button>
    <button data-dom-id="event-filter-vaccine" type="button" class="pill">💉 疫苗</button>
    <button data-dom-id="event-filter-deworming" type="button" class="pill">💊 驱虫</button>
    <button data-dom-id="event-filter-nail" type="button" class="pill">🐾 剪指甲</button>
    <button data-dom-id="event-filter-play" type="button" class="pill">🎾 玩耍</button>
    <button data-dom-id="event-filter-other" type="button" class="pill">📌 其他</button>
  </div>

  <!-- Content -->
  <div style="padding:16px 16px 0;">

    <!-- AI summary entry -->
    <div class="ai-element" style="padding:12px 14px; display:flex; align-items:center; gap:8px; cursor:pointer;">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-600)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
      <span style="flex:1; font-size:13px; color:var(--fafa-primary-700); font-weight:500; line-height:1.4;">AI 帮我回顾本月健康事件</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-600)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </div>

    <!-- Date Group: 8月18日 -->
    <section style="margin-top:16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px;">
        <span style="font-size:13px; font-weight:700; color:var(--fafa-neutral-700);">8月18日 · 今天</span>
        <span style="font-size:12px; color:var(--fafa-neutral-500);">1 条事件</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <!-- event record 1: 体内驱虫 -->
        <div data-dom-id="event-record-1" class="card-surface" style="padding:14px; cursor:pointer;">
          <div style="display:flex; gap:12px;">
            <div style="width:42px; height:42px; border-radius:var(--fafa-radius-md); background:var(--fafa-primary-50); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;">💊</div>
            <div style="flex:1; min-width:0;">
              <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">
                <div style="min-width:0;">
                  <div style="font-size:15px; font-weight:700; color:var(--fafa-neutral-950);">完成体内驱虫</div>
                  <div style="font-size:12px; color:var(--fafa-neutral-500); margin-top:2px;">09:45 · 拜耳猫用</div>
                </div>
                <span style="font-size:15px; font-weight:800; color:var(--fafa-primary-600); white-space:nowrap;">¥80</span>
              </div>
              <div style="margin-top:6px; font-size:13px; color:var(--fafa-neutral-700); line-height:1.5;">完成本季度体内驱虫，下次预计 11 月。</div>
              <!-- meta chips -->
              <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:12px;">
                <span class="meta-chip">
                  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                  家中
                </span>
                <span class="meta-chip">
                  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                  下次 11月
                </span>
              </div>
            </div>
          </div>
          <!-- AI auto tag -->
          <div style="margin-top:12px; padding-top:10px; border-top:1px dashed var(--fafa-neutral-200); display:flex; align-items:center; justify-content:space-between;">
            <span class="ai-tag">
              <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
              AI分类：健康相关
            </span>
            <span style="font-size:11px; color:var(--fafa-neutral-400);">自动归类</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Date Group: 8月14日 -->
    <section style="margin-top:18px;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px;">
        <span style="font-size:13px; font-weight:700; color:var(--fafa-neutral-700);">8月14日</span>
        <span style="font-size:12px; color:var(--fafa-neutral-500);">1 条事件</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <!-- event record 2: 洗澡 -->
        <div data-dom-id="event-record-2" class="card-surface" style="padding:14px; cursor:pointer;">
          <div style="display:flex; gap:12px;">
            <div style="width:42px; height:42px; border-radius:var(--fafa-radius-md); background:rgba(90,142,173,0.12); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;">🛁</div>
            <div style="flex:1; min-width:0;">
              <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">
                <div style="min-width:0;">
                  <div style="font-size:15px; font-weight:700; color:var(--fafa-neutral-950);">洗澡</div>
                  <div style="font-size:12px; color:var(--fafa-neutral-500); margin-top:2px;">19:30</div>
                </div>
              </div>
              <div style="margin-top:6px; font-size:13px; color:var(--fafa-neutral-700); line-height:1.5;">在家洗澡，吹干 + 梳毛，状态良好。</div>
              <!-- thumbnails (max 3) -->
              <div style="margin-top:10px; display:flex; gap:6px;">
                <div style="width:54px; height:54px; border-radius:var(--fafa-radius-md); background:linear-gradient(135deg,#E0A585,#C4612F);"></div>
                <div style="width:54px; height:54px; border-radius:var(--fafa-radius-md); background:linear-gradient(135deg,#D4CDC0,#9A9185);"></div>
                <div style="width:54px; height:54px; border-radius:var(--fafa-radius-md); background:linear-gradient(135deg,#EDC5B0,#D38057);"></div>
              </div>
              <!-- meta chips -->
              <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:12px;">
                <span class="meta-chip">
                  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                  家中
                </span>
              </div>
            </div>
          </div>
          <!-- AI auto tag -->
          <div style="margin-top:12px; padding-top:10px; border-top:1px dashed var(--fafa-neutral-200); display:flex; align-items:center; justify-content:space-between;">
            <span class="ai-tag">
              <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
              AI分类：日常护理
            </span>
            <span style="font-size:11px; color:var(--fafa-neutral-400);">自动归类</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Date Group: 8月10日 -->
    <section style="margin-top:18px;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:0 2px 8px;">
        <span style="font-size:13px; font-weight:700; color:var(--fafa-neutral-700);">8月10日</span>
        <span style="font-size:12px; color:var(--fafa-neutral-500);">1 条事件</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <!-- event record 3: 剪指甲 -->
        <div data-dom-id="event-record-3" class="card-surface" style="padding:14px; cursor:pointer;">
          <div style="display:flex; gap:12px;">
            <div style="width:42px; height:42px; border-radius:var(--fafa-radius-md); background:rgba(196,97,47,0.12); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;">✂️</div>
            <div style="flex:1; min-width:0;">
              <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">
                <div style="min-width:0;">
                  <div style="font-size:15px; font-weight:700; color:var(--fafa-neutral-950);">剪指甲</div>
                  <div style="font-size:12px; color:var(--fafa-neutral-500); margin-top:2px;">20:15</div>
                </div>
              </div>
              <div style="margin-top:6px; font-size:13px; color:var(--fafa-neutral-700); line-height:1.5;">修剪指甲，前爪 5 指，完成。</div>
              <!-- meta chips -->
              <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:12px;">
                <span class="meta-chip">
                  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                  家中
                </span>
              </div>
            </div>
          </div>
          <!-- AI auto tag -->
          <div style="margin-top:12px; padding-top:10px; border-top:1px dashed var(--fafa-neutral-200); display:flex; align-items:center; justify-content:space-between;">
            <span class="ai-tag">
              <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
              AI分类：日常护理
            </span>
            <span style="font-size:11px; color:var(--fafa-neutral-400);">自动归类</span>
          </div>
        </div>
      </div>
    </section>

  </div>

  <!-- Floating Add Button -->
  <button data-dom-id="add-event" type="button" class="fab" aria-label="添加事件记录">
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </button>

</body>
</html>
