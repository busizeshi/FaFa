<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>生成报告</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <style id="theme-vars">
    :root, html.light {
      --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
      --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
      --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
      --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
      --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
      --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
      --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06);
    }
    body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
    .card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
    .ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
    .tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
    * { box-sizing:border-box; }
    input, textarea, button, select { font-family:inherit; }
    .field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
    .row-divider { border-bottom:1px solid var(--fafa-neutral-200); }
    .pill-btn { padding:6px 16px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); }
    .pill-btn-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-500); color:#fff; }

    .app-header { position:sticky; top:0; z-index:50; background-color:var(--fafa-neutral-50); border-bottom:1px solid var(--fafa-neutral-200); }
    .header-back { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--fafa-radius-full); cursor:pointer; color:var(--fafa-neutral-900); }

    .progress-ring-wrap { position:relative; width:140px; height:140px; margin:0 auto; }
    .progress-ring-bg { stroke:var(--fafa-primary-100); }
    .progress-ring-fg { stroke:var(--fafa-primary-500); stroke-linecap:round; animation:ringPulse 2s ease-in-out infinite; }
    @keyframes ringPulse { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
    .progress-percent { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
    .progress-percent .num { font-size:32px; font-weight:700; color:var(--fafa-primary-600); line-height:1; }
    .progress-percent .pct { font-size:14px; color:var(--fafa-neutral-600); }

    .step-item { display:flex; align-items:flex-start; gap:10px; padding:6px 0; }
    .step-check-done { width:20px; height:20px; border-radius:50%; background:var(--state-success); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
    .step-check-pending { width:20px; height:20px; border-radius:50%; border:1.5px solid var(--fafa-neutral-300); flex-shrink:0; margin-top:1px; background:transparent; }
    .step-check-current { width:20px; height:20px; border-radius:50%; border:2px solid var(--fafa-primary-500); flex-shrink:0; margin-top:1px; background:var(--fafa-primary-50); position:relative; }
    .step-check-current::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:8px; height:8px; border-radius:50%; background:var(--fafa-primary-500); animation:dotBlink 1s ease-in-out infinite; }
    @keyframes dotBlink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
    .step-text { font-size:14px; line-height:1.5; }
    .step-done .step-text { color:var(--fafa-neutral-800); }
    .step-pending .step-text { color:var(--fafa-neutral-500); }
    .step-current .step-text { color:var(--fafa-primary-700); font-weight:600; }

    .preview-item { display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13px; color:var(--fafa-neutral-700); }
    .preview-dot { width:6px; height:6px; border-radius:50%; background:var(--fafa-primary-300); flex-shrink:0; }

    .section-title { font-size:15px; font-weight:600; color:var(--fafa-neutral-900); }
    .period-btn { display:flex; align-items:center; justify-content:space-between; width:100%; padding:10px 14px; border-radius:var(--fafa-radius-md); border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); cursor:pointer; font-size:14px; color:var(--fafa-neutral-800); }
  </style>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

  <!-- Header -->
  <header class="app-header px-4 py-3 flex items-center">
    <div class="header-back" data-dom-id="back-report-list">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <h1 class="text-base font-semibold flex-1 text-center pr-9" style="color:var(--fafa-neutral-900);">生成报告</h1>
  </header>

  <div class="p-4 space-y-4">

    <!-- Report config card -->
    <div class="card-surface p-4 space-y-3">
      <!-- Pet -->
      <div class="flex items-center gap-3">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--fafa-primary-200);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">🐱</div>
        <div>
          <div class="font-semibold text-sm" style="color:var(--fafa-neutral-900);">豆包</div>
          <div class="text-xs" style="color:var(--fafa-neutral-500);">英短 · 3岁2个月</div>
        </div>
      </div>

      <div class="row-divider"></div>

      <!-- Report type -->
      <div>
        <div class="field-label mb-2">报告类型</div>
        <div class="flex gap-2 flex-wrap">
          <button class="pill-btn" data-dom-id="type-weekly">周报</button>
          <button class="pill-btn pill-btn-active" data-dom-id="type-monthly">月报</button>
          <button class="pill-btn" data-dom-id="type-quarterly">季报</button>
          <button class="pill-btn" data-dom-id="type-yearly">年报</button>
        </div>
      </div>

      <!-- Period selector -->
      <div>
        <div class="field-label mb-2">报告周期</div>
        <button class="period-btn" data-dom-id="select-period">
          <span>选择月份</span>
          <div class="flex items-center gap-2">
            <span style="font-weight:600;color:var(--fafa-primary-600);">2026年8月</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </button>
      </div>
    </div>

    <!-- Generation progress card -->
    <div class="ai-element p-6 space-y-5">
      <!-- Progress ring -->
      <div class="progress-ring-wrap">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="60" fill="none" class="progress-ring-bg" stroke-width="8"/>
          <circle cx="70" cy="70" r="60" fill="none" class="progress-ring-fg" stroke-width="8"
            stroke-dasharray="282.7 376.99" transform="rotate(-90 70 70)"/>
        </svg>
        <div class="progress-percent">
          <div class="num">75<span style="font-size:18px;">%</span></div>
          <div class="pct">生成中</div>
        </div>
      </div>

      <!-- Status text -->
      <div class="text-center space-y-1">
        <div class="flex items-center justify-center gap-2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M19 14l.75 2.25L22 17l-2.25.75L19 20l-.75-2.25L16 17l2.25-.75L19 14z"/></svg>
          <span class="text-sm font-semibold" style="color:var(--fafa-primary-700);">AI 正在生成报告...</span>
        </div>
        <p class="text-xs" style="color:var(--fafa-neutral-500);">正在生成分享海报...</p>
        <p class="text-xs" style="color:var(--fafa-neutral-400);">预计还需 10 秒</p>
      </div>

      <!-- Step list -->
      <div class="space-y-0">
        <div class="step-item step-done">
          <div class="step-check-done">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span class="step-text">聚合本月记录数据</span>
        </div>
        <div class="step-item step-done">
          <div class="step-check-done">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span class="step-text">统计体重/饮食/排便趋势</span>
        </div>
        <div class="step-item step-done">
          <div class="step-check-done">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <span class="step-text">生成 AI 月报总结</span>
        </div>
        <div class="step-item step-current">
          <div class="step-check-current"></div>
          <span class="step-text">生成分享海报</span>
        </div>
        <div class="step-item step-pending">
          <div class="step-check-pending"></div>
          <span class="step-text">完成报告</span>
        </div>
      </div>
    </div>

    <!-- Report preview info card -->
    <div class="card-surface p-4">
      <div class="flex items-center gap-2 mb-3">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-700)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span class="section-title">即将生成的内容预览</span>
      </div>

      <div>
        <div class="preview-item">
          <span class="preview-dot"></span>
          <span>本月概览<span style="color:var(--fafa-neutral-400);font-size:12px;">（记录天数/照片数/喂食次数/体重记录数）</span></span>
        </div>
        <div class="preview-item">
          <span class="preview-dot"></span>
          <span>体重变化趋势</span>
        </div>
        <div class="preview-item">
          <span class="preview-dot"></span>
          <span>饮食统计</span>
        </div>
        <div class="preview-item">
          <span class="preview-dot"></span>
          <span>饮水情况</span>
        </div>
        <div class="preview-item">
          <span class="preview-dot"></span>
          <span>排便健康</span>
        </div>
        <div class="preview-item">
          <span class="preview-dot"></span>
          <span>健康事件</span>
        </div>
        <div class="preview-item">
          <span class="preview-dot"></span>
          <span>成长记忆照片</span>
        </div>
        <div class="preview-item">
          <span class="preview-dot" style="background:var(--fafa-primary-500);"></span>
          <span style="color:var(--fafa-primary-700);font-weight:500;">AI 月报总结<span style="color:var(--fafa-neutral-400);font-size:12px;font-weight:400;">（四段式）</span></span>
        </div>
      </div>

      <div class="mt-3 pt-3 row-divider" style="border-top:1px solid var(--fafa-neutral-200);border-bottom:none;">
        <div class="flex items-start gap-2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:3px;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <p class="text-xs" style="color:var(--fafa-neutral-500);">生成完成后将自动跳转到报告详情</p>
        </div>
      </div>
    </div>

  </div>

  <div style="height:24px;"></div>
</body>
</html>
