<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>事件记录</title>
  <style id="theme-vars">
    :root, html.light {
      --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
      --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
      --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
      --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
      --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
      --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
      --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06);
    }
    body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
    .card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
    .ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
    .tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
    * { box-sizing:border-box; }
    input, textarea, button, select { font-family:inherit; }
    .field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
    .field-input { width:100%; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; }
    .event-tag { flex-shrink:0; padding:7px 16px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); white-space:nowrap; display:flex; align-items:center; gap:5px; }
    .event-tag-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-500); color:#fff; }
    .multi-tag { padding:6px 14px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); }
    .multi-tag-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-50); color:var(--fafa-primary-700); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

  <!-- Header -->
  <header style="position:sticky; top:0; z-index:10; background-color:var(--fafa-neutral-100); border-bottom:1px solid var(--fafa-neutral-200); padding:10px 12px; display:flex; align-items:center; gap:4px;">
    <button data-dom-id="back-event-list" style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; background:transparent; border:none; cursor:pointer; color:var(--fafa-neutral-900);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 style="font-size:17px; font-weight:600; color:var(--fafa-neutral-900); margin:0;">事件记录</h1>
  </header>

  <!-- 事件时间 -->
  <div class="card-surface" style="margin:16px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between;">
    <span class="field-label">事件时间</span>
    <button data-dom-id="input-datetime" style="display:flex; align-items:center; gap:6px; background:transparent; border:none; cursor:pointer; font-size:15px; color:var(--fafa-primary-600);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="color:var(--fafa-neutral-600);"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="14" r="2" stroke="currentColor" stroke-width="1.5"/></svg>
      <span>2026-08-18 14:30</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- 事件类型 horizontal scroll -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:10px;">事件类型</label>
    <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; scrollbar-width:none;">
      <button data-dom-id="event-bath" class="event-tag">洗澡</button>
      <button data-dom-id="event-grooming" class="event-tag">美容</button>
      <button data-dom-id="event-vet" class="event-tag">就医</button>
      <button data-dom-id="event-vaccine" class="event-tag">疫苗</button>
      <button data-dom-id="event-deworming" class="event-tag event-tag-active">驱虫</button>
      <button data-dom-id="event-nail" class="event-tag">剪指甲</button>
      <button data-dom-id="event-play" class="event-tag">玩耍</button>
      <button data-dom-id="event-other" class="event-tag">其他</button>
    </div>
  </div>

  <!-- 标题 -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:8px;">标题</label>
    <input type="text" data-dom-id="input-title" value="完成体内驱虫" class="field-input">
  </div>

  <!-- 内容 -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:8px;">内容</label>
    <textarea data-dom-id="input-content" rows="4" placeholder="详细描述事件经过..." style="width:100%; padding:10px 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; resize:none;"></textarea>
  </div>

  <!-- 标签 multi-select -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:10px;">标签</label>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button data-dom-id="tag-diet" class="multi-tag">饮食变化</button>
      <button data-dom-id="tag-health" class="multi-tag multi-tag-active">健康相关</button>
      <button data-dom-id="tag-behavior" class="multi-tag">行为变化</button>
      <button data-dom-id="tag-daily" class="multi-tag">日常</button>
    </div>
  </div>

  <!-- 地点 -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:8px;">地点</label>
    <div style="display:flex; align-items:center; gap:8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="color:var(--fafa-neutral-500); flex-shrink:0;"><path d="M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/></svg>
      <input type="text" data-dom-id="input-location" placeholder="如：XX宠物医院" style="flex:1; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none;">
    </div>
  </div>

  <!-- 费用 -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:8px;">费用</label>
    <div style="display:flex; align-items:center; gap:6px; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); background:var(--fafa-neutral-50);">
      <span style="font-size:16px; color:var(--fafa-neutral-600); font-weight:600;">¥</span>
      <input type="number" data-dom-id="input-cost" placeholder="0.00" style="flex:1; height:100%; border:none; background:transparent; font-size:15px; color:var(--fafa-neutral-900); outline:none;">
    </div>
  </div>

  <!-- 图片上传 -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:10px;">图片</label>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button data-dom-id="upload-images" class="ai-element" style="width:84px; height:84px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; border:none; cursor:pointer;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="color:var(--fafa-primary-400);"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span style="font-size:11px; color:var(--fafa-primary-500);">添加图片</span>
      </button>
    </div>
  </div>

  <!-- AI auto-tag hint -->
  <div data-dom-id="ai-hint" class="ai-element" style="margin:0 16px 16px; padding:12px 14px; display:flex; align-items:center; gap:8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="flex-shrink:0; color:var(--fafa-primary-500);"><path d="M12 3l1.9 4.6L18.5 9l-3.4 3.3.8 4.7L12 14.8l-3.9 2.2.8-4.7L5.5 9l4.6-1.4L12 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 19l2-1M19 19l-2-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span style="font-size:13px; color:var(--fafa-primary-700); line-height:1.5;">AI 将自动判断事件分类</span>
  </div>

  <!-- 备注 -->
  <div class="card-surface" style="margin:0 16px 16px; padding:14px 16px;">
    <label class="field-label" style="display:block; margin-bottom:8px;">备注</label>
    <textarea data-dom-id="input-notes" rows="3" placeholder="补充说明..." style="width:100%; padding:10px 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; resize:none;"></textarea>
  </div>

  <!-- Bottom action -->
  <div style="padding:4px 16px 32px;">
    <button data-dom-id="btn-save" style="width:100%; height:48px; border:none; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; font-size:16px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(196,97,47,0.25);">保存</button>
  </div>

</body>
</html>
