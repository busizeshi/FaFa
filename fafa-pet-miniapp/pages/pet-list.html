<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宠物列表</title>
    <style id="theme-vars">
        :root {
            --fafa-primary-50: #FAF0EB;
            --fafa-primary-100: #F5E0D5;
            --fafa-primary-200: #EDC5B0;
            --fafa-primary-300: #E0A585;
            --fafa-primary-400: #D38057;
            --fafa-primary-500: #C4612F;
            --fafa-primary-600: #A85228;
            --fafa-primary-700: #8B4221;

            --fafa-neutral-0: #FFFFFF;
            --fafa-neutral-50: #FBF9F5;
            --fafa-neutral-100: #F7F4EF;
            --fafa-neutral-200: #EFEAE1;
            --fafa-neutral-300: #E7E1D7;
            --fafa-neutral-400: #D4CDC0;
            --fafa-neutral-500: #B8B0A3;
            --fafa-neutral-600: #9A9185;
            --fafa-neutral-700: #7C7367;
            --fafa-neutral-800: #5C635D;
            --fafa-neutral-900: #3D3D3A;
            --fafa-neutral-950: #1F2421;

            --state-success: #5B8C5A;
            --state-warning: #D49B3A;
            --state-error: #C44A3F;
            --state-info: #5A8EAD;

            --fafa-background: var(--fafa-neutral-100);
            --fafa-foreground: var(--fafa-neutral-950);
            --fafa-card: #FFFFFF;
            --fafa-border: var(--fafa-neutral-300);

            --fafa-radius-sm: 4px;
            --fafa-radius-md: 8px;
            --fafa-radius-lg: 16px;
            --fafa-radius-full: 9999px;

            --fafa-font-sans: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;

            --shadow-card: 0 2px 8px rgba(31,36,33,0.04);
            --shadow-hover: 0 4px 12px rgba(31,36,33,0.06);
        }

        html.light {
            color-scheme: light;
        }

        body {
            font-family: var(--fafa-font-sans);
            background-color: var(--fafa-background);
            color: var(--fafa-foreground);
            -webkit-font-smoothing: antialiased;
            font-size: 16px;
            line-height: 1.6;
        }

        .card-surface {
            background-color: var(--fafa-card);
            border-radius: var(--fafa-radius-lg);
            box-shadow: var(--shadow-card);
        }

        .ai-element {
            border: 1.5px dashed var(--fafa-primary-200);
            background-color: var(--fafa-primary-50);
            border-radius: var(--fafa-radius-lg);
        }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: var(--fafa-radius-full);
            font-size: 12px;
            font-weight: 500;
        }

        .pet-card {
            transition: box-shadow 0.2s ease, transform 0.15s ease;
            cursor: pointer;
        }
        .pet-card:active {
            transform: scale(0.985);
            box-shadow: var(--shadow-hover);
        }

        .btn-primary {
            background-color: var(--fafa-primary-500);
            color: #fff;
            border-radius: var(--fafa-radius-full);
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .btn-primary:active {
            background-color: var(--fafa-primary-600);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color: var(--fafa-background); font-family: var(--fafa-font-sans); color: var(--fafa-foreground); max-width: 414px; margin: 0 auto; min-height: 100vh;">

    <!-- Header -->
    <header style="position: sticky; top: 0; z-index: 50; background-color: var(--fafa-neutral-50); border-bottom: 1px solid var(--fafa-neutral-200);">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; height: 52px;">
            <div data-dom-id="back-mine" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; cursor: pointer; border-radius: var(--fafa-radius-md);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--fafa-neutral-900);">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </div>
            <h1 style="font-size: 17px; font-weight: 600; color: var(--fafa-neutral-900); margin: 0;">我的宠物</h1>
            <div style="width: 32px; height: 32px;"></div>
        </div>
    </header>

    <!-- Page Content -->
    <main style="padding: 16px 16px 100px 16px;">

        <!-- Section Title -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 4px;">
            <span style="font-size: 13px; color: var(--fafa-neutral-600);">共 2 只宠物</span>
            <span style="font-size: 12px; color: var(--fafa-neutral-500);">长按卡片可拖拽排序</span>
        </div>

        <!-- Pet Card 1: 豆包 -->
        <div data-dom-id="pet-card-1" class="card-surface pet-card" style="padding: 16px; margin-bottom: 12px; position: relative;">
            <div style="display: flex; align-items: flex-start; gap: 14px;">
                <!-- Avatar -->
                <div style="width: 56px; height: 56px; border-radius: var(--fafa-radius-full); background-color: var(--fafa-primary-300); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <span style="font-size: 22px; font-weight: 700; color: #fff;">豆</span>
                </div>
                <!-- Info -->
                <div style="flex: 1; min-width: 0;">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 17px; font-weight: 600; color: var(--fafa-neutral-900);">豆包</span>
                            <span class="tag-pill" style="background-color: var(--fafa-primary-50); color: var(--fafa-primary-600);">正常</span>
                        </div>
                        <!-- Edit Button -->
                        <div data-dom-id="edit-pet-1" style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; cursor: pointer; border-radius: var(--fafa-radius-md); flex-shrink: 0;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--fafa-neutral-600);">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </div>
                    </div>
                    <p style="font-size: 13px; color: var(--fafa-neutral-600); margin: 0 0 6px 0;">英短 · 公 · 3岁2个月</p>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--fafa-neutral-500);">
                            <path d="M6 2v6a4 4 0 0 0 4 4h0a4 4 0 0 0 4-4V2"></path>
                            <path d="M10 12v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-8"></path>
                        </svg>
                        <span style="font-size: 13px; color: var(--fafa-neutral-700); font-weight: 500;">当前体重 5.2kg</span>
                    </div>
                </div>
            </div>
            <!-- Long-press hint -->
            <div style="margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--fafa-neutral-200); display: flex; align-items: center; gap: 4px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--fafa-neutral-400);">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                <span style="font-size: 11px; color: var(--fafa-neutral-400);">长按拖拽可调整顺序</span>
            </div>
        </div>

        <!-- Pet Card 2: 团子 -->
        <div data-dom-id="pet-card-2" class="card-surface pet-card" style="padding: 16px; margin-bottom: 12px; position: relative;">
            <div style="display: flex; align-items: flex-start; gap: 14px;">
                <!-- Avatar -->
                <div style="width: 56px; height: 56px; border-radius: var(--fafa-radius-full); background-color: var(--fafa-primary-400); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <span style="font-size: 22px; font-weight: 700; color: #fff;">团</span>
                </div>
                <!-- Info -->
                <div style="flex: 1; min-width: 0;">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 17px; font-weight: 600; color: var(--fafa-neutral-900);">团子</span>
                            <span class="tag-pill" style="background-color: var(--fafa-primary-50); color: var(--fafa-primary-600);">正常</span>
                        </div>
                        <!-- Edit Button -->
                        <div data-dom-id="edit-pet-2" style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; cursor: pointer; border-radius: var(--fafa-radius-md); flex-shrink: 0;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--fafa-neutral-600);">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </div>
                    </div>
                    <p style="font-size: 13px; color: var(--fafa-neutral-600); margin: 0 0 6px 0;">布偶 · 母 · 1岁5个月</p>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--fafa-neutral-500);">
                            <path d="M6 2v6a4 4 0 0 0 4 4h0a4 4 0 0 0 4-4V2"></path>
                            <path d="M10 12v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-8"></path>
                        </svg>
                        <span style="font-size: 13px; color: var(--fafa-neutral-700); font-weight: 500;">当前体重 3.8kg</span>
                    </div>
                </div>
            </div>
            <!-- Long-press hint -->
            <div style="margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--fafa-neutral-200); display: flex; align-items: center; gap: 4px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--fafa-neutral-400);">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                <span style="font-size: 11px; color: var(--fafa-neutral-400);">长按拖拽可调整顺序</span>
            </div>
        </div>

        <!-- AI Suggestion Card -->
        <div class="ai-element" style="padding: 14px 16px; margin-top: 8px; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 10px;">
            <div style="flex-shrink: 0; width: 28px; height: 28px; border-radius: var(--fafa-radius-full); background: var(--fafa-primary-100); display: flex; align-items: center; justify-content: center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--fafa-primary-500);">
                    <path d="M12 2a7 7 0 0 1 7 7c0 2.5-1.5 4.5-3.5 5.5L15 19h-6l-.5-4.5C6.5 13.5 5 11.5 5 9a7 7 0 0 1 7-7z"></path>
                    <line x1="9" y1="22" x2="15" y2="22"></line>
                </svg>
            </div>
            <div style="flex: 1;">
                <p style="font-size: 13px; font-weight: 600; color: var(--fafa-primary-700); margin: 0 0 2px 0;">AI 小助手</p>
                <p style="font-size: 12px; color: var(--fafa-neutral-700); margin: 0; line-height: 1.5;">豆包已满3岁，建议定期进行口腔检查和体重管理哦。</p>
            </div>
        </div>

    </main>

    <!-- Bottom Add Button -->
    <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 414px; padding: 12px 16px; background: linear-gradient(to top, var(--fafa-neutral-100) 70%, transparent); z-index: 40;">
        <div data-dom-id="add-pet" class="btn-primary" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; cursor: pointer;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span style="font-size: 16px;">添加宠物</span>
        </div>
    </div>

</body>
</html>
