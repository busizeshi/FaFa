<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>照片详情</title>
  <style id="theme-vars">
:root, html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh; padding-bottom:56px;">

  <!-- Header -->
  <header class="sticky top-0 z-20 flex items-center gap-3 px-4 py-3" style="background-color:var(--fafa-card); border-bottom:1px solid var(--fafa-border);">
    <button data-dom-id="back-photo-wall" class="flex items-center justify-center w-9 h-9 rounded-full" style="background-color:var(--fafa-neutral-100);" aria-label="返回">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-900);"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="text-lg font-semibold" style="color:var(--fafa-neutral-900);">照片详情</h1>
  </header>

  <!-- Photo viewer -->
  <div data-dom-id="photo-viewer" class="relative w-full" style="height:400px; background:linear-gradient(135deg,#F5E0D5 0%,#D38057 60%,#C4612F 100%);">
    <!-- subtle pet silhouette hint -->
    <div class="absolute inset-0 flex items-end justify-center pb-16">
      <div style="width:160px; height:90px; border-radius:60px 60px 28px 28px; background:rgba(255,255,255,0.18);"></div>
    </div>
    <!-- counter -->
    <div class="absolute top-3 right-3 px-2.5 py-1 rounded-full text-xs" style="background:rgba(31,36,33,0.45); color:#FFFFFF;">1 / 4</div>
    <!-- swipe dots -->
    <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-1.5">
      <span class="block w-1.5 h-1.5 rounded-full" style="background:#FFFFFF;"></span>
      <span class="block w-1.5 h-1.5 rounded-full" style="background:rgba(255,255,255,0.4);"></span>
      <span class="block w-1.5 h-1.5 rounded-full" style="background:rgba(255,255,255,0.4);"></span>
      <span class="block w-1.5 h-1.5 rounded-full" style="background:rgba(255,255,255,0.4);"></span>
    </div>
  </div>

  <!-- Photo info card -->
  <div class="card-surface mx-4 mt-4 p-4">
    <div class="flex items-start gap-2 mb-3">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-500); margin-top:2px;">
        <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
      <div class="flex-1">
        <div class="text-xs" style="color:var(--fafa-neutral-500);">拍摄时间</div>
        <div data-dom-id="photo-date" class="text-sm font-medium" style="color:var(--fafa-neutral-900);">2026年8月15日 14:30</div>
      </div>
    </div>

    <div class="h-px mb-3" style="background-color:var(--fafa-border);"></div>

    <div class="flex items-start gap-2">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-500); margin-top:2px;">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
      <div class="flex-1">
        <div class="flex items-center gap-2">
          <span class="text-xs" style="color:var(--fafa-neutral-500);">用户描述</span>
          <button data-dom-id="edit-description" class="flex items-center gap-1 text-xs" style="color:var(--fafa-primary-600);">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            编辑
          </button>
        </div>
        <div data-dom-id="photo-description" class="text-sm mt-0.5" style="color:var(--fafa-neutral-900);">今天在阳台晒了一下午太阳</div>
      </div>
    </div>
  </div>

  <!-- AI recognition card -->
  <div class="ai-element mx-4 mt-3 p-4">
    <div class="flex items-center gap-2 mb-3">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-primary-500);">
        <path d="M12 3l1.6 4.3L18 9l-4.4 1.7L12 15l-1.6-4.3L6 9l4.4-1.7L12 3z"/>
        <path d="M19 14l.8 2.1L22 17l-2.2.9L19 20l-.8-2.1L16 17l2.2-.9L19 14z"/>
      </svg>
      <h3 class="text-sm font-semibold" style="color:var(--fafa-primary-700);">AI 识别信息</h3>
      <span class="ml-auto text-[10px] px-2 py-0.5 rounded-full" style="background-color:var(--fafa-primary-500); color:var(--fafa-primary-foreground);">AI</span>
    </div>

    <div data-dom-id="ai-tags" class="flex flex-wrap gap-1.5 mb-3">
      <span class="px-2.5 py-1 rounded-full text-xs" style="background-color:var(--fafa-primary-100); color:var(--fafa-primary-700);">场景:阳台</span>
      <span class="px-2.5 py-1 rounded-full text-xs" style="background-color:var(--fafa-primary-100); color:var(--fafa-primary-700);">行为:睡觉</span>
      <span class="px-2.5 py-1 rounded-full text-xs" style="background-color:var(--fafa-primary-100); color:var(--fafa-primary-700);">物品:蓝色猫窝</span>
      <span class="px-2.5 py-1 rounded-full text-xs" style="background-color:var(--fafa-primary-100); color:var(--fafa-primary-700);">天气:晴天</span>
      <span class="px-2.5 py-1 rounded-full text-xs" style="background-color:var(--fafa-primary-100); color:var(--fafa-primary-700);">时间:下午</span>
    </div>

    <div class="text-xs mb-1" style="color:var(--fafa-neutral-500);">AI 描述</div>
    <div data-dom-id="ai-description" class="text-sm leading-relaxed" style="color:var(--fafa-neutral-900);">豆包趴在阳台蓝色猫窝里睡觉，阳光温暖地照在身上。</div>
  </div>

  <!-- Related tags -->
  <div class="mx-4 mt-3 p-4 card-surface">
    <div class="text-xs mb-2" style="color:var(--fafa-neutral-500);">相关标签</div>
    <div data-dom-id="related-tags" class="flex flex-wrap gap-1.5">
      <span class="text-sm" style="color:var(--fafa-primary-600);">#阳台</span>
      <span class="text-sm" style="color:var(--fafa-primary-600);">#睡觉</span>
      <span class="text-sm" style="color:var(--fafa-primary-600);">#晴天</span>
    </div>
  </div>

  <!-- Privacy note -->
  <div class="mx-4 mt-3 flex items-center gap-2 px-3 py-2.5 rounded-lg" style="background-color:var(--fafa-neutral-200);">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-600); flex-shrink:0;">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <span class="text-xs" style="color:var(--fafa-neutral-700);">仅自己可见 · 照片不会对外分享</span>
  </div>

  <!-- Bottom action bar -->
  <div class="fixed bottom-0 left-0 right-0 z-30" style="max-width:414px; margin:0 auto;">
    <div class="flex items-center gap-3 px-4 py-3" style="background-color:var(--fafa-card); border-top:1px solid var(--fafa-border);">
      <button data-dom-id="btn-edit-desc" class="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-full text-sm font-medium" style="background-color:var(--fafa-primary-500); color:var(--fafa-primary-foreground);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        编辑描述
      </button>
      <button data-dom-id="btn-delete-photo" class="flex items-center justify-center gap-1.5 py-2.5 rounded-full text-sm font-medium" style="background-color:var(--fafa-neutral-100); color:var(--state-error); padding-left:18px; padding-right:18px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        删除
      </button>
    </div>
  </div>

</body>
</html>
