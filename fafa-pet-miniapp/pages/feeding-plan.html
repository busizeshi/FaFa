<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>喂食计划</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<style id="theme-vars">
:root, html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
.tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
* { box-sizing:border-box; }
input, textarea, button, select { font-family:inherit; }
.field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
.field-input { width:100%; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; }
.field-input:focus { border-color:var(--fafa-primary-400); background:#fff; }
.row-divider { border-bottom:1px solid var(--fafa-neutral-200); }
.pill-btn { padding:6px 16px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); }
.pill-btn-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-500); color:#fff; }
.app-header { position:sticky; top:0; z-index:50; background-color:var(--fafa-neutral-50); border-bottom:1px solid var(--fafa-neutral-200); }
.icon-btn { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--fafa-radius-full); border:none; background:transparent; color:var(--fafa-neutral-900); cursor:pointer; -webkit-tap-highlight-color:transparent; }
.icon-btn:active { background:var(--fafa-neutral-200); }
.meal-row { display:flex; align-items:center; padding:14px 16px; gap:12px; -webkit-tap-highlight-color:transparent; }
.meal-row-completed { border-left:3px solid var(--state-success); }
.meal-row-pending { border-left:3px solid var(--fafa-neutral-300); }
.bottom-bar { position:sticky; bottom:0; z-index:50; background:var(--fafa-card); border-top:1px solid var(--fafa-neutral-200); padding:12px 16px; padding-bottom:max(12px, env(safe-area-inset-bottom)); }
.btn-primary { flex:1; height:44px; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; font-size:15px; font-weight:600; border:none; cursor:pointer; }
.btn-secondary { flex:1; height:44px; border-radius:var(--fafa-radius-full); background:var(--fafa-neutral-100); color:var(--fafa-neutral-800); font-size:15px; font-weight:600; border:1px solid var(--fafa-neutral-300); cursor:pointer; }
</style>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

<!-- Header -->
<header class="app-header">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top));">
    <button class="icon-btn" data-dom-id="back-feeding-list" aria-label="返回">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 style="font-size:17px; font-weight:600; margin:0; color:var(--fafa-neutral-950);">喂食计划</h1>
    <button class="icon-btn" data-dom-id="edit-plan" aria-label="编辑">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a4.5 4.5 0 0 1-1.6 1.047l-2.27.756a.5.5 0 0 1-.632-.632l.756-2.27a4.5 4.5 0 0 1 1.047-1.6z"/></svg>
    </button>
  </div>
</header>

<!-- Content -->
<main style="padding:16px; padding-bottom:80px;">

  <!-- AI Plan Card -->
  <div class="ai-element" style="padding:16px; margin-bottom:12px;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
      <span style="font-size:15px; font-weight:600; color:var(--fafa-primary-700);">AI 推荐喂食方案</span>
    </div>
    <p style="font-size:13px; color:var(--fafa-neutral-600); margin:0 0 14px;">根据豆包的年龄、体重、品种和活动量生成</p>
    <div style="margin-bottom:16px;">
      <span style="font-size:13px; color:var(--fafa-neutral-600);">建议每日总量</span>
      <div style="font-size:28px; font-weight:700; color:var(--fafa-primary-700); line-height:1.2;">65-75g</div>
    </div>
    <button data-dom-id="accept-plan" style="width:100%; height:42px; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; font-size:15px; font-weight:600; border:none; cursor:pointer;">接受计划</button>
  </div>

  <!-- Today's Plan Card -->
  <div class="card-surface" style="margin-bottom:12px; overflow:hidden;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:16px; padding-bottom:12px;">
      <h2 style="font-size:17px; font-weight:600; margin:0; color:var(--fafa-neutral-950);">今日计划</h2>
      <span style="font-size:13px; color:var(--fafa-neutral-500);">8月18日</span>
    </div>

    <div class="meal-row meal-row-completed row-divider" data-dom-id="meal-1">
      <span style="font-size:14px; font-weight:600; color:var(--fafa-neutral-900); width:46px; flex:none;">07:30</span>
      <div style="flex:1;">
        <span style="font-size:15px; font-weight:500; color:var(--fafa-neutral-900);">25g</span>
        <span style="font-size:14px; color:var(--fafa-neutral-600); margin-left:6px;">皇家猫粮</span>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="var(--state-success)"/><path d="m9 12 2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="meal-row meal-row-completed row-divider" data-dom-id="meal-2">
      <span style="font-size:14px; font-weight:600; color:var(--fafa-neutral-900); width:46px; flex:none;">13:00</span>
      <div style="flex:1;">
        <span style="font-size:15px; font-weight:500; color:var(--fafa-neutral-900);">10g</span>
        <span style="font-size:14px; color:var(--fafa-neutral-600); margin-left:6px;">希宝罐头</span>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="var(--state-success)"/><path d="m9 12 2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="meal-row meal-row-pending row-divider" data-dom-id="meal-3">
      <span style="font-size:14px; font-weight:600; color:var(--fafa-neutral-900); width:46px; flex:none;">19:00</span>
      <div style="flex:1;">
        <span style="font-size:15px; font-weight:500; color:var(--fafa-neutral-900);">25g</span>
        <span style="font-size:14px; color:var(--fafa-neutral-600); margin-left:6px;">皇家猫粮</span>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="var(--fafa-neutral-400)" stroke-width="2"/></svg>
    </div>

    <div class="meal-row meal-row-pending" data-dom-id="meal-4">
      <span style="font-size:14px; font-weight:600; color:var(--fafa-neutral-900); width:46px; flex:none;">22:30</span>
      <div style="flex:1;">
        <span style="font-size:15px; font-weight:500; color:var(--fafa-neutral-900);">10g</span>
        <span style="font-size:14px; color:var(--fafa-neutral-600); margin-left:6px;">鸡肉冻干</span>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="var(--fafa-neutral-400)" stroke-width="2"/></svg>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--fafa-neutral-50); border-top:1px solid var(--fafa-neutral-200);">
      <span style="font-size:14px; color:var(--fafa-neutral-600);">今日合计</span>
      <span style="font-size:17px; font-weight:700; color:var(--fafa-primary-600);">70g</span>
    </div>
  </div>

  <!-- Plan Stats Card -->
  <div class="card-surface" style="padding:4px 16px; margin-bottom:12px;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0;" class="row-divider">
      <span style="font-size:14px; color:var(--fafa-neutral-600);">过去30天平均每日</span>
      <span style="font-size:16px; font-weight:600; color:var(--fafa-neutral-900);">78g</span>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0;" class="row-divider">
      <span style="font-size:14px; color:var(--fafa-neutral-600);">体重趋势</span>
      <span style="display:flex; align-items:center; gap:4px; font-size:16px; font-weight:600; color:var(--fafa-neutral-900);">
        5.1kg <span style="color:var(--fafa-neutral-400); font-weight:400;">→</span> 5.5kg
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--state-warning)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
      </span>
    </div>
    <div style="padding:12px 0;">
      <span style="font-size:14px; color:var(--fafa-neutral-600);">建议调整</span>
      <p style="font-size:14px; color:var(--state-warning); margin:4px 0 0;">体重增长明显，可适当减少每日喂食量</p>
    </div>
  </div>

  <!-- AI Analysis Entry -->
  <div class="ai-element" data-dom-id="ai-feeding-analysis" style="padding:14px 16px; display:flex; align-items:center; gap:10px; cursor:pointer; margin-bottom:12px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
    <span style="flex:1; font-size:15px; font-weight:500; color:var(--fafa-primary-700);">AI 分析喂食与体重关系</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </div>

</main>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <div style="display:flex; gap:12px;">
    <button class="btn-secondary" data-dom-id="btn-edit-plan">编辑计划</button>
    <button class="btn-primary" data-dom-id="btn-record">记录喂食</button>
  </div>
</div>

</body>
</html>
