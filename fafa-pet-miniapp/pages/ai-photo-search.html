<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>照片搜索</title>
  <style id="theme-vars">
:root, html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
.tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
.no-scrollbar::-webkit-scrollbar { display:none; }
.no-scrollbar { scrollbar-width:none; -ms-overflow-style:none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh; padding-bottom:56px;">

  <!-- Header -->
  <header class="sticky top-0 z-20 flex items-center gap-3 px-4 py-3" style="background-color:var(--fafa-card); border-bottom:1px solid var(--fafa-border);">
    <button data-dom-id="back-photo-wall" class="flex items-center justify-center w-9 h-9 rounded-full" style="background-color:var(--fafa-neutral-100);" aria-label="返回">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-900);"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="text-lg font-semibold" style="color:var(--fafa-neutral-900);">搜索结果</h1>
  </header>

  <div class="px-4 pt-3 pb-4 flex flex-col gap-3">

    <!-- Search query display -->
    <div class="card-surface flex items-center gap-2.5" style="padding:12px 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-500); flex-shrink:0;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span data-dom-id="search-query" class="text-sm font-medium" style="color:var(--fafa-neutral-900);">去年夏天在阳台睡觉的照片</span>
    </div>

    <!-- Result count + sort indicator -->
    <div class="flex items-center justify-between">
      <span data-dom-id="result-count" class="text-sm" style="color:var(--fafa-neutral-600);">找到 17 张相关照片</span>
      <span data-dom-id="sort-indicator" class="flex items-center gap-1 text-xs" style="color:var(--fafa-neutral-500);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
        按相关度排序
      </span>
    </div>

    <!-- AI insight card (dashed) -->
    <div data-dom-id="ai-insight" class="ai-element flex items-start gap-2.5" style="padding:14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-primary-500); flex-shrink:0; margin-top:1px;">
        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/>
      </svg>
      <p class="text-sm" style="color:var(--fafa-primary-700); line-height:1.55;">这些照片大多数拍摄于2025年7月至8月，场景多为阳台，行为以睡觉为主。</p>
    </div>

    <!-- Photo result grid: 2-column -->
    <div class="grid grid-cols-2 gap-3 pt-1">

      <!-- Photo 1 - 95% -->
      <div data-dom-id="search-photo-1" class="cursor-pointer">
        <div class="rounded-xl overflow-hidden" style="aspect-ratio:4/3; background:linear-gradient(135deg,#F5E0D5,#D38057);"></div>
        <div class="mt-2">
          <p class="text-xs" style="color:var(--fafa-neutral-700);">2025年7月18日</p>
          <div class="flex items-center gap-1.5 mt-1">
            <div style="flex:1; height:4px; border-radius:9999px; background-color:var(--fafa-neutral-200); overflow:hidden;">
              <div style="width:95%; height:100%; background-color:var(--fafa-primary-500); border-radius:9999px;"></div>
            </div>
            <span class="text-[10px] font-semibold" style="color:var(--fafa-primary-600);">95%</span>
          </div>
        </div>
      </div>

      <!-- Photo 2 - 92% -->
      <div data-dom-id="search-photo-2" class="cursor-pointer">
        <div class="rounded-xl overflow-hidden" style="aspect-ratio:4/3; background:linear-gradient(135deg,#FAF0EB,#E0A585);"></div>
        <div class="mt-2">
          <p class="text-xs" style="color:var(--fafa-neutral-700);">2025年7月21日</p>
          <div class="flex items-center gap-1.5 mt-1">
            <div style="flex:1; height:4px; border-radius:9999px; background-color:var(--fafa-neutral-200); overflow:hidden;">
              <div style="width:92%; height:100%; background-color:var(--fafa-primary-500); border-radius:9999px;"></div>
            </div>
            <span class="text-[10px] font-semibold" style="color:var(--fafa-primary-600);">92%</span>
          </div>
        </div>
      </div>

      <!-- Photo 3 - 88% -->
      <div data-dom-id="search-photo-3" class="cursor-pointer">
        <div class="rounded-xl overflow-hidden" style="aspect-ratio:4/3; background:linear-gradient(135deg,#EDC5B0,#C4612F);"></div>
        <div class="mt-2">
          <p class="text-xs" style="color:var(--fafa-neutral-700);">2025年8月3日</p>
          <div class="flex items-center gap-1.5 mt-1">
            <div style="flex:1; height:4px; border-radius:9999px; background-color:var(--fafa-neutral-200); overflow:hidden;">
              <div style="width:88%; height:100%; background-color:var(--fafa-primary-500); border-radius:9999px;"></div>
            </div>
            <span class="text-[10px] font-semibold" style="color:var(--fafa-primary-600);">88%</span>
          </div>
        </div>
      </div>

      <!-- Photo 4 - 85% -->
      <div data-dom-id="search-photo-4" class="cursor-pointer">
        <div class="rounded-xl overflow-hidden" style="aspect-ratio:4/3; background:linear-gradient(135deg,#F5E0D5,#E0A585);"></div>
        <div class="mt-2">
          <p class="text-xs" style="color:var(--fafa-neutral-700);">2025年7月25日</p>
          <div class="flex items-center gap-1.5 mt-1">
            <div style="flex:1; height:4px; border-radius:9999px; background-color:var(--fafa-neutral-200); overflow:hidden;">
              <div style="width:85%; height:100%; background-color:var(--fafa-primary-400); border-radius:9999px;"></div>
            </div>
            <span class="text-[10px] font-semibold" style="color:var(--fafa-primary-600);">85%</span>
          </div>
        </div>
      </div>

      <!-- Photo 5 - 82% -->
      <div data-dom-id="search-photo-5" class="cursor-pointer">
        <div class="rounded-xl overflow-hidden" style="aspect-ratio:4/3; background:linear-gradient(135deg,#EFEAE1,#D4CDC0);"></div>
        <div class="mt-2">
          <p class="text-xs" style="color:var(--fafa-neutral-700);">2025年8月9日</p>
          <div class="flex items-center gap-1.5 mt-1">
            <div style="flex:1; height:4px; border-radius:9999px; background-color:var(--fafa-neutral-200); overflow:hidden;">
              <div style="width:82%; height:100%; background-color:var(--fafa-primary-400); border-radius:9999px;"></div>
            </div>
            <span class="text-[10px] font-semibold" style="color:var(--fafa-primary-600);">82%</span>
          </div>
        </div>
      </div>

      <!-- Photo 6 - 76% -->
      <div data-dom-id="search-photo-6" class="cursor-pointer">
        <div class="rounded-xl overflow-hidden" style="aspect-ratio:4/3; background:linear-gradient(135deg,#F5E0D5,#D38057);"></div>
        <div class="mt-2">
          <p class="text-xs" style="color:var(--fafa-neutral-700);">2025年8月15日</p>
          <div class="flex items-center gap-1.5 mt-1">
            <div style="flex:1; height:4px; border-radius:9999px; background-color:var(--fafa-neutral-200); overflow:hidden;">
              <div style="width:76%; height:100%; background-color:var(--fafa-primary-400); border-radius:9999px;"></div>
            </div>
            <span class="text-[10px] font-semibold" style="color:var(--fafa-primary-600);">76%</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Load more hint -->
    <div class="flex items-center justify-center pt-2 pb-2">
      <span class="text-xs" style="color:var(--fafa-neutral-500);">还有 11 张结果，下滑加载更多</span>
    </div>

  </div>

</body>
</html>
