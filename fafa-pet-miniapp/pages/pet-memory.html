<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>宠物记忆</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <style id="theme-vars">
    :root, html.light {
      --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
      --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
      --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
      --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
      --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
      --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
      --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06);
    }
    body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
    .card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
    .ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
    .tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
    * { box-sizing:border-box; }
    input, textarea, button, select { font-family:inherit; }
    .field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
    .row-divider { border-bottom:1px solid var(--fafa-neutral-200); }
    .pill-btn { padding:6px 16px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); }
    .pill-btn-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-500); color:#fff; }

    .app-header { position:sticky; top:0; z-index:50; background-color:var(--fafa-neutral-50); border-bottom:1px solid var(--fafa-neutral-200); }
    .header-back { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--fafa-radius-full); cursor:pointer; color:var(--fafa-neutral-900); }
    .add-pill { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; border:1px dashed var(--fafa-neutral-400); color:var(--fafa-neutral-600); background:transparent; cursor:pointer; }
    .tag-like { background:var(--fafa-primary-50); color:var(--fafa-primary-700); }
    .tag-habit { background:var(--fafa-neutral-100); color:var(--fafa-neutral-800); }
    .tag-life { background:#EEF5EE; color:var(--state-success); }
    .tag-trend { background:#FBF5E8; color:var(--state-warning); }
    .memory-item { padding:9px 0; display:flex; align-items:center; justify-content:space-between; }
    .text-btn { background:none; border:none; color:var(--fafa-neutral-600); font-size:14px; cursor:pointer; padding:8px 4px; }
    .section-title { font-size:15px; font-weight:600; color:var(--fafa-neutral-900); }
  </style>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

  <!-- Header -->
  <header class="app-header px-4 py-3 flex items-center">
    <div class="header-back" data-dom-id="back-pet-profile">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <h1 class="text-base font-semibold flex-1 text-center pr-9" style="color:var(--fafa-neutral-900);">宠物记忆</h1>
  </header>

  <div class="p-4 space-y-4">

    <!-- Pet header -->
    <div class="flex items-center gap-3">
      <div style="width:48px;height:48px;border-radius:50%;background:var(--fafa-primary-200);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;">🐱</div>
      <div>
        <div class="text-lg font-semibold" style="color:var(--fafa-neutral-900);">豆包</div>
        <div class="text-sm" style="color:var(--fafa-neutral-600);">英短 · 3岁2个月</div>
      </div>
    </div>

    <!-- AI intro card -->
    <div class="ai-element p-4 space-y-2">
      <div class="flex items-center gap-2">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M19 14l.75 2.25L22 17l-2.25.75L19 20l-.75-2.25L16 17l2.25-.75L19 14z"/></svg>
        <span class="font-semibold text-sm" style="color:var(--fafa-primary-700);">AI 记忆</span>
      </div>
      <p class="text-sm" style="color:var(--fafa-neutral-700);">这些记忆来自豆包的长期数据和你的确认，帮助 AI 更懂豆包</p>
      <p class="text-xs" style="color:var(--fafa-neutral-500);">系统会定期分析数据并发现可能的记忆，由你确认后保存</p>
    </div>

    <!-- Memory: 喜欢 -->
    <div class="card-surface p-4">
      <div class="flex items-center gap-2 mb-3">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="section-title">喜欢</span>
      </div>
      <div class="flex flex-wrap gap-2">
        <span class="tag-pill tag-like" data-dom-id="memory-like-1">阳台</span>
        <span class="tag-pill tag-like" data-dom-id="memory-like-2">纸箱</span>
        <span class="tag-pill tag-like" data-dom-id="memory-like-3">鸡肉冻干</span>
        <button class="add-pill" data-dom-id="add-like">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加
        </button>
      </div>
    </div>

    <!-- Memory: 习惯 -->
    <div class="card-surface p-4">
      <div class="flex items-center gap-2 mb-1">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="section-title">习惯</span>
      </div>
      <div>
        <div class="memory-item row-divider" data-dom-id="memory-habit-1">
          <span class="text-sm" style="color:var(--fafa-neutral-800);">晚上11点左右睡觉</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="memory-item" data-dom-id="memory-habit-2">
          <span class="text-sm" style="color:var(--fafa-neutral-800);">喜欢凌晨吃东西</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="mt-1">
        <button class="add-pill" data-dom-id="add-habit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加
        </button>
      </div>
    </div>

    <!-- Memory: 生活 -->
    <div class="card-surface p-4">
      <div class="flex items-center gap-2 mb-1">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="section-title">生活</span>
      </div>
      <div>
        <div class="memory-item row-divider" data-dom-id="memory-life-1">
          <div class="flex items-center gap-2">
            <span class="tag-pill tag-life">2024-06-18</span>
            <span class="text-sm" style="color:var(--fafa-neutral-800);">到家</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="memory-item row-divider" data-dom-id="memory-life-2">
          <div class="flex items-center gap-2">
            <span class="tag-pill tag-life">2025-03</span>
            <span class="text-sm" style="color:var(--fafa-neutral-800);">完成绝育</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="memory-item" data-dom-id="memory-life-3">
          <div class="flex items-center gap-2">
            <span class="tag-pill tag-life">2026-04</span>
            <span class="text-sm" style="color:var(--fafa-neutral-800);">更换主粮</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="mt-1">
        <button class="add-pill" data-dom-id="add-life">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加
        </button>
      </div>
    </div>

    <!-- Memory: 长期趋势 -->
    <div class="card-surface p-4">
      <div class="flex items-center gap-2 mb-1">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        <span class="section-title">长期趋势</span>
      </div>
      <div>
        <div class="memory-item row-divider" data-dom-id="memory-trend-1">
          <span class="text-sm" style="color:var(--fafa-neutral-800);">成年后体重大约稳定在5.0～5.3kg</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="memory-item" data-dom-id="memory-trend-2">
          <span class="text-sm" style="color:var(--fafa-neutral-800);">夏季食欲略下降</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="mt-1">
        <button class="add-pill" data-dom-id="add-trend">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加
        </button>
      </div>
    </div>

    <!-- AI discovery card -->
    <div class="ai-element p-4 space-y-3">
      <div class="flex items-center gap-2">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span class="font-semibold text-sm" style="color:var(--fafa-primary-700);">AI 发现新记忆</span>
      </div>
      <p class="text-sm" style="color:var(--fafa-neutral-700);">豆包好像经常在阳台出现，是否把"喜欢待在阳台"加入记忆？</p>
      <div class="flex items-center gap-3">
        <button class="pill-btn pill-btn-active" data-dom-id="confirm-memory">确认添加</button>
        <button class="text-btn" data-dom-id="dismiss-memory">忽略</button>
      </div>
    </div>

  </div>

  <div style="height:24px;"></div>
</body>
</html>
