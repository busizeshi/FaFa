<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>创建提醒</title>
    <style id="theme-vars">
/* ============================================
   FaFa Pet Life Assistant - Brand CSS
   Warm Earth Tones · Terracotta Orange · Cream
   ============================================ */

:root,
html.light {
  --fafa-primary-50: #FAF0EB;
  --fafa-primary-100: #F5E0D5;
  --fafa-primary-200: #EDC5B0;
  --fafa-primary-300: #E0A585;
  --fafa-primary-400: #D38057;
  --fafa-primary-500: #C4612F;
  --fafa-primary-600: #A85228;
  --fafa-primary-700: #8B4221;
  --fafa-primary-800: #6E331A;
  --fafa-primary-900: #522513;
  --fafa-primary-950: #3B180D;
  --fafa-primary-foreground: #FFFFFF;

  --fafa-neutral-0: #FFFFFF;
  --fafa-neutral-50: #FBF9F5;
  --fafa-neutral-100: #F7F4EF;
  --fafa-neutral-200: #EFEAE1;
  --fafa-neutral-300: #E7E1D7;
  --fafa-neutral-400: #D4CDC0;
  --fafa-neutral-500: #B8B0A3;
  --fafa-neutral-600: #9A9185;
  --fafa-neutral-700: #7C7367;
  --fafa-neutral-800: #5C635D;
  --fafa-neutral-900: #3D3D3A;
  --fafa-neutral-950: #1F2421;

  --state-success: #5B8C5A;
  --state-warning: #D49B3A;
  --state-error: #C44A3F;
  --state-info: #5A8EAD;

  --fafa-background: var(--fafa-neutral-100);
  --fafa-foreground: var(--fafa-neutral-950);
  --fafa-card: #FFFFFF;
  --fafa-card-foreground: var(--fafa-neutral-950);
  --fafa-popover: #FFFFFF;
  --fafa-popover-foreground: var(--fafa-neutral-950);
  --fafa-primary: var(--fafa-primary-500);
  --fafa-primary-foreground: #FFFFFF;
  --fafa-muted: var(--fafa-neutral-50);
  --fafa-muted-foreground: var(--fafa-neutral-800);
  --fafa-border: var(--fafa-neutral-300);
  --fafa-input: var(--fafa-neutral-300);
  --fafa-ring: var(--fafa-primary-500);
  --fafa-secondary: var(--fafa-neutral-200);
  --fafa-secondary-foreground: var(--fafa-neutral-950);
  --fafa-accent: var(--fafa-primary-50);
  --fafa-accent-foreground: var(--fafa-primary-700);

  --fafa-radius-sm: 4px;
  --fafa-radius-md: 8px;
  --fafa-radius-lg: 16px;
  --fafa-radius-full: 9999px;

  --fafa-font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --fafa-font-display: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, sans-serif;

  --shadow-card: 0 2px 8px rgba(31, 36, 33, 0.04);
  --shadow-hover: 0 4px 12px rgba(31, 36, 33, 0.06);
  --shadow-popover: 0 8px 24px rgba(31, 36, 33, 0.10);
}

body {
  font-family: var(--fafa-font-sans);
  background-color: var(--fafa-background);
  color: var(--fafa-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 16px;
  line-height: 1.6;
}

.card-surface {
  background-color: var(--fafa-card);
  border-radius: var(--fafa-radius-lg);
  box-shadow: var(--shadow-card);
}

.ai-element {
  border: 1.5px dashed var(--fafa-primary-200);
  background-color: var(--fafa-primary-50);
  border-radius: var(--fafa-radius-lg);
}

.tag-pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: var(--fafa-radius-full);
  font-size: 12px;
  font-weight: 500;
}

.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh; padding-bottom:96px;">

    <!-- Sticky Header -->
    <header style="position:sticky;top:0;z-index:30;background-color:var(--fafa-neutral-100);padding:12px 16px;display:flex;align-items:center;gap:12px;">
        <button data-dom-id="back-reminder-list" type="button" aria-label="返回" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;color:var(--fafa-neutral-950);background:transparent;border:none;cursor:pointer;padding:0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h1 style="font-size:18px;font-weight:700;margin:0;color:var(--fafa-neutral-950);">创建提醒</h1>
    </header>

    <!-- Form Content -->
    <div style="padding:12px 16px 0;display:flex;flex-direction:column;gap:12px;">

        <!-- 关联宠物 -->
        <div class="card-surface" style="padding:16px;">
            <label style="font-size:13px;font-weight:600;color:var(--fafa-neutral-600);display:block;margin-bottom:8px;">关联宠物</label>
            <button data-dom-id="select-pet" type="button" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;border:none;cursor:pointer;padding:0;">
                <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:36px;height:36px;border-radius:50%;background-color:var(--fafa-primary-50);display:flex;align-items:center;justify-content:center;font-size:18px;">🐱</div>
                    <span style="font-size:16px;font-weight:600;color:var(--fafa-neutral-950);">豆包</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
        </div>

        <!-- 提醒标题 -->
        <div class="card-surface" style="padding:16px;">
            <label style="font-size:13px;font-weight:600;color:var(--fafa-neutral-600);display:block;margin-bottom:8px;">提醒标题</label>
            <input data-dom-id="input-title" type="text" value="体内驱虫" placeholder="请输入提醒标题" style="width:100%;border:none;background:transparent;font-size:16px;color:var(--fafa-neutral-950);outline:none;font-family:inherit;padding:0;" />
        </div>

        <!-- 提醒类型 -->
        <div class="card-surface" style="padding:16px;">
            <label style="font-size:13px;font-weight:600;color:var(--fafa-neutral-600);display:block;margin-bottom:12px;">提醒类型</label>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
                <button data-dom-id="type-vaccine" type="button" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);cursor:pointer;">
                    <span style="font-size:24px;">💉</span>
                    <span style="font-size:12px;color:var(--fafa-neutral-700);">疫苗</span>
                </button>
                <button data-dom-id="type-deworming" type="button" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;border:1.5px solid var(--fafa-primary-500);background-color:var(--fafa-primary-50);cursor:pointer;">
                    <span style="font-size:24px;">💊</span>
                    <span style="font-size:12px;color:var(--fafa-primary-600);font-weight:600;">驱虫</span>
                </button>
                <button data-dom-id="type-bath" type="button" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);cursor:pointer;">
                    <span style="font-size:24px;">🛁</span>
                    <span style="font-size:12px;color:var(--fafa-neutral-700);">洗澡</span>
                </button>
                <button data-dom-id="type-nail" type="button" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);cursor:pointer;">
                    <span style="font-size:24px;">✂️</span>
                    <span style="font-size:12px;color:var(--fafa-neutral-700);">剪指甲</span>
                </button>
                <button data-dom-id="type-checkup" type="button" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);cursor:pointer;">
                    <span style="font-size:24px;">🩺</span>
                    <span style="font-size:12px;color:var(--fafa-neutral-700);">体检</span>
                </button>
                <button data-dom-id="type-medicine" type="button" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);cursor:pointer;">
                    <span style="font-size:24px;">💊</span>
                    <span style="font-size:12px;color:var(--fafa-neutral-700);">药物</span>
                </button>
                <button data-dom-id="type-birthday" type="button" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);cursor:pointer;">
                    <span style="font-size:24px;">🎂</span>
                    <span style="font-size:12px;color:var(--fafa-neutral-700);">生日</span>
                </button>
                <button data-dom-id="type-custom" type="button" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);cursor:pointer;">
                    <span style="font-size:24px;">⚙️</span>
                    <span style="font-size:12px;color:var(--fafa-neutral-700);">自定义</span>
                </button>
            </div>
        </div>

        <!-- 提醒时间 -->
        <div class="card-surface" style="padding:16px;">
            <label style="font-size:13px;font-weight:600;color:var(--fafa-neutral-600);display:block;margin-bottom:8px;">提醒时间</label>
            <button data-dom-id="input-datetime" type="button" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;border:none;cursor:pointer;padding:0;">
                <div style="display:flex;align-items:center;gap:8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span style="font-size:16px;color:var(--fafa-neutral-950);font-weight:500;">2026-08-20 09:00</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
        </div>

        <!-- 重复规则 -->
        <div class="card-surface" style="padding:16px;">
            <label style="font-size:13px;font-weight:600;color:var(--fafa-neutral-600);display:block;margin-bottom:12px;">重复规则</label>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
                <button data-dom-id="repeat-once" type="button" style="padding:9px 0;border-radius:9999px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);font-size:13px;color:var(--fafa-neutral-700);cursor:pointer;">一次性</button>
                <button data-dom-id="repeat-daily" type="button" style="padding:9px 0;border-radius:9999px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);font-size:13px;color:var(--fafa-neutral-700);cursor:pointer;">每天</button>
                <button data-dom-id="repeat-weekly" type="button" style="padding:9px 0;border-radius:9999px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);font-size:13px;color:var(--fafa-neutral-700);cursor:pointer;">每周</button>
                <button data-dom-id="repeat-monthly" type="button" style="padding:9px 0;border-radius:9999px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);font-size:13px;color:var(--fafa-neutral-700);cursor:pointer;">每月</button>
                <button data-dom-id="repeat-yearly" type="button" style="padding:9px 0;border-radius:9999px;border:1px solid var(--fafa-neutral-200);background-color:var(--fafa-neutral-0);font-size:13px;color:var(--fafa-neutral-700);cursor:pointer;">每年</button>
                <button data-dom-id="repeat-custom" type="button" style="padding:9px 0;border-radius:9999px;border:1.5px solid var(--fafa-primary-500);background-color:var(--fafa-primary-50);font-size:13px;color:var(--fafa-primary-600);font-weight:600;cursor:pointer;">自定义</button>
            </div>

            <!-- Custom Repeat Config -->
            <div style="margin-top:12px;padding:12px;background-color:var(--fafa-neutral-50);border-radius:12px;display:flex;align-items:center;gap:8px;">
                <span style="font-size:14px;color:var(--fafa-neutral-700);">每</span>
                <input data-dom-id="repeat-n" type="number" value="3" min="1" max="12" style="width:50px;text-align:center;border:1px solid var(--fafa-neutral-300);border-radius:8px;padding:6px 4px;font-size:15px;color:var(--fafa-neutral-950);background-color:var(--fafa-neutral-0);outline:none;font-family:inherit;" />
                <button data-dom-id="repeat-unit" type="button" style="display:flex;align-items:center;gap:4px;border:1px solid var(--fafa-neutral-300);border-radius:8px;padding:6px 12px;background-color:var(--fafa-neutral-0);font-size:14px;color:var(--fafa-neutral-950);cursor:pointer;">
                    个月
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <span style="font-size:14px;color:var(--fafa-neutral-700);">提醒一次</span>
            </div>
        </div>

        <!-- 提前提醒 -->
        <div class="card-surface" style="padding:16px;">
            <label style="font-size:13px;font-weight:600;color:var(--fafa-neutral-600);display:block;margin-bottom:8px;">提前提醒</label>
            <button data-dom-id="advance-reminder" type="button" style="width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;border:none;cursor:pointer;padding:0;">
                <div style="display:flex;align-items:center;gap:8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span style="font-size:16px;color:var(--fafa-neutral-950);font-weight:500;">提前 30 分钟</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
        </div>

        <!-- 描述 -->
        <div class="card-surface" style="padding:16px;">
            <label style="font-size:13px;font-weight:600;color:var(--fafa-neutral-600);display:block;margin-bottom:8px;">描述</label>
            <textarea data-dom-id="input-description" placeholder="添加备注信息..." rows="3" style="width:100%;border:none;background:transparent;font-size:15px;color:var(--fafa-neutral-950);outline:none;font-family:inherit;resize:none;padding:0;line-height:1.6;"></textarea>
        </div>

        <!-- 完成历史 (Edit Mode) -->
        <div class="card-surface" style="padding:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                <label style="font-size:13px;font-weight:600;color:var(--fafa-neutral-600);">完成历史</label>
                <span class="tag-pill" style="background-color:var(--fafa-neutral-100);color:var(--fafa-neutral-600);">1次</span>
            </div>
            <div data-dom-id="history-1" style="display:flex;align-items:center;gap:10px;padding:10px 12px;background-color:var(--fafa-neutral-50);border-radius:10px;">
                <div style="width:32px;height:32px;border-radius:50%;background-color:rgba(91,140,90,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--state-success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </div>
                <div>
                    <div style="font-size:14px;font-weight:500;color:var(--fafa-neutral-900);">已完成</div>
                    <div style="font-size:12px;color:var(--fafa-neutral-500);">2026年5月20日</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Action Bar -->
    <div style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:414px;max-width:100%;background-color:var(--fafa-neutral-0);border-top:1px solid var(--fafa-neutral-200);padding:12px 16px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;z-index:40;">
        <button data-dom-id="btn-save" type="button" style="width:100%;border:none;cursor:pointer;background-color:var(--fafa-primary-500);color:#fff;border-radius:9999px;padding:14px 16px;font-size:16px;font-weight:600;box-shadow:0 4px 12px rgba(196,97,47,0.20);">保存</button>
        <button data-dom-id="btn-cancel" type="button" style="width:100%;border:none;cursor:pointer;background:transparent;color:var(--state-error);font-size:14px;font-weight:500;padding:4px 0;">取消提醒</button>
    </div>

</body>
</html>
