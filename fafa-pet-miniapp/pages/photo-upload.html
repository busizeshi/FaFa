<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>上传照片</title>
  <style id="theme-vars">
:root, html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh; padding-bottom:72px;">

  <!-- Header -->
  <header class="sticky top-0 z-20 flex items-center gap-3 px-4 py-3" style="background-color:var(--fafa-card); border-bottom:1px solid var(--fafa-border);">
    <button data-dom-id="back-photo-wall" class="flex items-center justify-center w-9 h-9 rounded-full" style="background-color:var(--fafa-neutral-100);" aria-label="返回">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-900);"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="text-lg font-semibold" style="color:var(--fafa-neutral-900);">上传照片</h1>
    <span class="ml-auto text-xs" style="color:var(--fafa-neutral-500);">3 / 9</span>
  </header>

  <!-- Upload drop zone -->
  <div class="px-4 pt-4">
    <div data-dom-id="upload-zone" class="flex flex-col items-center justify-center gap-2 py-10 rounded-2xl" style="border:1.5px dashed var(--fafa-primary-300); background-color:var(--fafa-primary-50);">
      <div class="flex items-center justify-center w-12 h-12 rounded-full" style="background-color:var(--fafa-primary-100);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-primary-500);">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
      </div>
      <div class="text-sm font-medium" style="color:var(--fafa-primary-700);">拍照或从相册选择</div>
      <div class="text-xs" style="color:var(--fafa-neutral-500);">最多选择 9 张</div>
    </div>
  </div>

  <!-- Selected photos preview -->
  <div class="px-4 pt-4">
    <div class="flex items-center gap-2 mb-2.5">
      <h2 class="text-sm font-semibold" style="color:var(--fafa-neutral-900);">已选照片</h2>
      <span class="text-xs" style="color:var(--fafa-neutral-500);">3 张</span>
    </div>
    <div class="grid grid-cols-3 gap-2">

      <!-- preview 1 (completed) -->
      <div data-dom-id="preview-1" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#F5E0D5,#D38057);">
        <button class="absolute top-1 right-1 flex items-center justify-center w-5 h-5 rounded-full" style="background:rgba(31,36,33,0.55);" aria-label="移除">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="absolute bottom-1 left-1 flex items-center justify-center w-5 h-5 rounded-full" style="background-color:var(--state-success);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
      </div>

      <!-- preview 2 (completed) -->
      <div data-dom-id="preview-2" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#EFEAE1,#D4CDC0);">
        <button class="absolute top-1 right-1 flex items-center justify-center w-5 h-5 rounded-full" style="background:rgba(31,36,33,0.55);" aria-label="移除">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="absolute bottom-1 left-1 flex items-center justify-center w-5 h-5 rounded-full" style="background-color:var(--state-success);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
      </div>

      <!-- preview 3 (uploading 60%) -->
      <div data-dom-id="preview-3" class="relative rounded-lg overflow-hidden" style="aspect-ratio:1/1; background:linear-gradient(135deg,#FAF0EB,#E0A585);">
        <button class="absolute top-1 right-1 flex items-center justify-center w-5 h-5 rounded-full" style="background:rgba(31,36,33,0.55); z-index:2;" aria-label="移除">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="absolute inset-0 flex items-center justify-center" style="background:rgba(31,36,33,0.35);">
          <span class="text-xs font-medium" style="color:#FFFFFF;">上传中</span>
        </div>
        <div data-dom-id="upload-progress-3" class="absolute bottom-0 left-0 right-0" style="height:4px; background:rgba(255,255,255,0.25);">
          <div style="height:100%; width:60%; background-color:var(--fafa-primary-500);"></div>
        </div>
      </div>

      <!-- add more -->
      <button data-dom-id="add-more" class="flex flex-col items-center justify-center gap-1 rounded-lg" style="aspect-ratio:1/1; background-color:var(--fafa-neutral-50); border:1.5px dashed var(--fafa-neutral-400);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-500);"><path d="M12 5v14M5 12h14"/></svg>
        <span class="text-[10px]" style="color:var(--fafa-neutral-500);">添加</span>
      </button>

    </div>
  </div>

  <!-- EXIF auto-detected notice -->
  <div class="px-4 pt-4">
    <div data-dom-id="exif-notice" class="flex items-center gap-2 px-3 py-2.5 rounded-lg" style="background-color:var(--fafa-neutral-200);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--state-info); flex-shrink:0;">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
      </svg>
      <span class="text-xs" style="color:var(--fafa-neutral-700);">拍摄时间已自动读取</span>
      <span class="ml-auto text-[10px]" style="color:var(--fafa-neutral-500);">EXIF</span>
    </div>
  </div>

  <!-- Batch description -->
  <div class="px-4 pt-4">
    <div class="text-sm font-medium mb-2" style="color:var(--fafa-neutral-900);">批量描述</div>
    <textarea data-dom-id="batch-description" rows="3" placeholder="为这批照片添加描述（可选）" class="w-full px-3 py-2.5 rounded-lg resize-none outline-none text-sm" style="background-color:var(--fafa-card); border:1px solid var(--fafa-border); color:var(--fafa-neutral-900);"></textarea>
  </div>

  <!-- AI recognition notice -->
  <div class="px-4 pt-4">
    <div data-dom-id="ai-notice" class="ai-element flex items-start gap-2 p-3.5">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-primary-500); flex-shrink:0; margin-top:1px;">
        <path d="M12 3l1.6 4.3L18 9l-4.4 1.7L12 15l-1.6-4.3L6 9l4.4-1.7L12 3z"/>
        <path d="M19 14l.8 2.1L22 17l-2.2.9L19 20l-.8-2.1L16 17l2.2-.9L19 14z"/>
      </svg>
      <div class="flex-1">
        <div class="flex items-center gap-2 mb-0.5">
          <span class="text-sm font-medium" style="color:var(--fafa-primary-700);">AI 自动识别</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full" style="background-color:var(--fafa-primary-500); color:var(--fafa-primary-foreground);">AI</span>
        </div>
        <div class="text-xs leading-relaxed" style="color:var(--fafa-neutral-700);">上传后 AI 将自动识别照片内容（场景、行为、物品等）</div>
      </div>
    </div>
  </div>

  <!-- Bottom upload button -->
  <div class="fixed bottom-0 left-0 right-0 z-30" style="max-width:414px; margin:0 auto;">
    <div class="px-4 py-3" style="background-color:var(--fafa-card); border-top:1px solid var(--fafa-border);">
      <button data-dom-id="btn-upload" class="w-full py-3 rounded-full text-sm font-semibold" style="background-color:var(--fafa-primary-500); color:var(--fafa-primary-foreground);">
        开始上传
      </button>
    </div>
  </div>

</body>
</html>
