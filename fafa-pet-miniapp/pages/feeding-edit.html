<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>喂食记录</title>
  <style id="theme-vars">
    :root, html.light {
      --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
      --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
      --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
      --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
      --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
      --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
      --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06);
    }
    body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
    .card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
    .ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
    .tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
    * { box-sizing:border-box; }
    input, textarea, button, select { font-family:inherit; }
    .field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
    .field-input { width:100%; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; }
    .field-input:focus { border-color:var(--fafa-primary-400); background:#fff; }
    .row-divider { border-bottom:1px solid var(--fafa-neutral-200); }
    .pill-btn { padding:6px 16px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); }
    .pill-btn-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-500); color:#fff; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

  <!-- Header -->
  <header style="position:sticky; top:0; z-index:10; background-color:var(--fafa-neutral-100); border-bottom:1px solid var(--fafa-neutral-200); padding:10px 12px; display:flex; align-items:center; gap:4px;">
    <button data-dom-id="back-feeding-list" style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; background:transparent; border:none; cursor:pointer; color:var(--fafa-neutral-900);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 style="font-size:17px; font-weight:600; color:var(--fafa-neutral-900); margin:0;">喂食记录</h1>
  </header>

  <!-- Smart prefill notice -->
  <div data-dom-id="prefill-notice" class="ai-element" style="margin:16px; padding:12px 14px; display:flex; align-items:flex-start; gap:8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="flex-shrink:0; margin-top:1px; color:var(--fafa-primary-500);"><path d="M12 3l2.09 4.26L19 8.27l-3.5 3.41.83 4.82L12 14.27l-4.33 2.23.83-4.82L5 8.27l4.91-1.01L12 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <span style="font-size:13px; color:var(--fafa-primary-700); line-height:1.5;">已为你预填最近一次记录，直接保存即可</span>
  </div>

  <!-- Form card -->
  <div class="card-surface" style="margin:0 16px 16px; padding:0; overflow:hidden;">

    <!-- 喂食时间 -->
    <div class="row-divider" style="display:flex; align-items:center; justify-content:space-between; padding:14px 16px;">
      <span class="field-label">喂食时间</span>
      <button data-dom-id="input-time" style="display:flex; align-items:center; gap:4px; background:transparent; border:none; cursor:pointer; font-size:15px; color:var(--fafa-primary-600);">
        <span>08:15</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- 食物名称 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">食物名称</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="text" data-dom-id="input-food-name" value="皇家英短成猫粮" style="flex:1; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none;">
        <button data-dom-id="food-history-trigger" style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); background:var(--fafa-neutral-50); cursor:pointer; color:var(--fafa-neutral-600);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <!-- 食物类型 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:10px;">食物类型</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button data-dom-id="type-staple" class="pill-btn pill-btn-active">主粮</button>
        <button data-dom-id="type-canned" class="pill-btn">罐头</button>
        <button data-dom-id="type-snack" class="pill-btn">零食</button>
        <button data-dom-id="type-other" class="pill-btn">其他</button>
      </div>
    </div>

    <!-- 数量 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">数量</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="number" data-dom-id="input-amount" value="32" style="flex:1; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none;">
        <select data-dom-id="select-unit" style="width:72px; height:40px; padding:0 28px 0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); appearance:none; -webkit-appearance:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22><path d=%22M6 9l6 6 6-6%22 stroke=%22%239A9185%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>'); background-repeat:no-repeat; background-position:right 8px center; cursor:pointer;">
          <option value="g" selected>g</option>
          <option value="ml">ml</option>
          <option value="颗">颗</option>
        </select>
      </div>
    </div>

    <!-- 品牌 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">品牌</label>
      <input type="text" data-dom-id="input-brand" value="皇家" class="field-input">
    </div>

    <!-- 备注 -->
    <div style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">备注</label>
      <textarea data-dom-id="input-notes" rows="3" placeholder="补充说明..." style="width:100%; padding:10px 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; resize:none;"></textarea>
    </div>
  </div>

  <!-- Bottom actions -->
  <div style="padding:4px 16px 32px;">
    <button data-dom-id="btn-save" style="width:100%; height:48px; border:none; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; font-size:16px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(196,97,47,0.25);">保存</button>
    <button data-dom-id="btn-delete" style="display:block; width:100%; margin-top:12px; height:40px; background:transparent; border:none; color:var(--state-error); font-size:14px; cursor:pointer;">删除</button>
  </div>

</body>
</html>
