/* ===== Brand Prefix: fafa ===== */
/* ===== Light Mode (Default) ===== */
:root,
html.light {
  /* --- Primary Scale (Terracotta Orange) --- */
  --fafa-primary-50: #FAF0EB;
  --fafa-primary-100: #F5E0D5;
  --fafa-primary-200: #EDC5B0;
  --fafa-primary-300: #E0A585;
  --fafa-primary-400: #D38057;
  --fafa-primary-500: #C4612F;
  --fafa-primary-600: #A85228;
  --fafa-primary-700: #8B4221;
  --fafa-primary-800: #6E331A;
  --fafa-primary-900: #522513;
  --fafa-primary-950: #3B180D;
  --fafa-primary-foreground: #FFFFFF;

  /* --- Neutral Warm Scale --- */
  --fafa-neutral-0: #FFFFFF;
  --fafa-neutral-50: #FBF9F5;
  --fafa-neutral-100: #F7F4EF;
  --fafa-neutral-200: #EFEAE1;
  --fafa-neutral-300: #E7E1D7;
  --fafa-neutral-400: #D4CDC0;
  --fafa-neutral-500: #B8B0A3;
  --fafa-neutral-600: #9A9185;
  --fafa-neutral-700: #7C7367;
  --fafa-neutral-800: #5C635D;
  --fafa-neutral-900: #3D3D3A;
  --fafa-neutral-950: #1F2421;

  /* --- State Colors --- */
  --state-success: #5B8C5A;
  --state-warning: #D49B3A;
  --state-error: #C44A3F;
  --state-info: #5A8EAD;

  /* --- Semantic Aliases --- */
  --fafa-background: var(--fafa-neutral-100);
  --fafa-foreground: var(--fafa-neutral-950);
  --fafa-card: #FFFFFF;
  --fafa-card-foreground: var(--fafa-neutral-950);
  --fafa-popover: #FFFFFF;
  --fafa-popover-foreground: var(--fafa-neutral-950);
  --fafa-primary: var(--fafa-primary-500);
  --fafa-primary-foreground: #FFFFFF;
  --fafa-muted: var(--fafa-neutral-50);
  --fafa-muted-foreground: var(--fafa-neutral-800);
  --fafa-border: var(--fafa-neutral-300);
  --fafa-input: var(--fafa-neutral-300);
  --fafa-ring: var(--fafa-primary-500);
  --fafa-secondary: var(--fafa-neutral-200);
  --fafa-secondary-foreground: var(--fafa-neutral-950);
  --fafa-accent: var(--fafa-primary-50);
  --fafa-accent-foreground: var(--fafa-primary-700);

  /* --- Radius Scale --- */
  --fafa-radius-sm: 4px;
  --fafa-radius-md: 8px;
  --fafa-radius-lg: 16px;
  --fafa-radius-full: 9999px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* --- Typography --- */
  --fafa-font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --fafa-font-display: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, sans-serif;

  /* --- Shadows --- */
  --shadow-card: 0 2px 8px rgba(31, 36, 33, 0.04);
  --shadow-hover: 0 4px 12px rgba(31, 36, 33, 0.06);
  --shadow-popover: 0 8px 24px rgba(31, 36, 33, 0.10);
  --shadow-tab: 0 -1px 8px rgba(31, 36, 33, 0.04);
}

/* ===== Dark Mode ===== */
html.dark {
  --fafa-primary-foreground: #FFFFFF;

  --fafa-neutral-0: #1A1815;

  --state-info: #7AABCA;

  --fafa-background: var(--fafa-neutral-100);
  --fafa-foreground: var(--fafa-neutral-950);
  --fafa-card: var(--fafa-neutral-50);
  --fafa-card-foreground: var(--fafa-neutral-950);
  --fafa-popover: var(--fafa-neutral-50);
  --fafa-popover-foreground: var(--fafa-neutral-950);
  --fafa-muted: var(--fafa-neutral-200);

  --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.25);
  --shadow-popover: 0 8px 24px rgba(0, 0, 0, 0.35);
}

/* ===== Base Typography ===== */
body {
  font-family: var(--fafa-font-sans);
  background-color: var(--fafa-background);
  color: var(--fafa-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 16px;
  line-height: 1.6;
}

.font-display {
  font-family: var(--fafa-font-display);
}

.text-title {
  font-size: 24px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.01em;
}

.text-heading {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.4;
}

.text-subheading {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
}

.text-body {
  font-size: 15px;
  font-weight: 400;
  line-height: 1.55;
}

.text-body-sm {
  font-size: 14px;
  font-weight: 400;
  line-height: 1.5;
}

.text-caption {
  font-size: 12px;
  font-weight: 400;
  line-height: 1.45;
  color: var(--fafa-muted-foreground);
}

.text-label {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}

/* ===== Component Utilities ===== */
.shadow-card {
  box-shadow: var(--shadow-card);
}
.shadow-hover {
  box-shadow: var(--shadow-hover);
}
.shadow-popover {
  box-shadow: var(--shadow-popover);
}

/* Card surface */
.card-surface {
  background-color: var(--fafa-card);
  border-radius: var(--fafa-radius-lg);
  box-shadow: var(--shadow-card);
}

/* AI element style - dashed border, light background */
.ai-element {
  border: 1.5px dashed var(--fafa-primary-200);
  background-color: var(--fafa-primary-50);
  border-radius: var(--fafa-radius-lg);
}

/* Floating AI button gradient */
.ai-fab {
  background: linear-gradient(135deg, var(--fafa-primary-400), var(--fafa-primary-600));
  box-shadow: 0 4px 16px rgba(196, 97, 47, 0.30);
}

/* Tag / Pill */
.tag-pill {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: var(--fafa-radius-full);
  font-size: 12px;
  font-weight: 500;
}

/* Active tab bar item color */
.tab-active {
  color: var(--fafa-primary-500);
}
.tab-inactive {
  color: var(--fafa-neutral-500);
}
