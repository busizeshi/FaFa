<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>编辑喂食计划</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<style id="theme-vars">
:root, html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
.tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
* { box-sizing:border-box; }
input, textarea, button, select { font-family:inherit; }
.field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
.field-input { width:100%; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; }
.field-input:focus { border-color:var(--fafa-primary-400); background:#fff; }
.row-divider { border-bottom:1px solid var(--fafa-neutral-200); }
.pill-btn { padding:6px 16px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); }
.pill-btn-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-500); color:#fff; }
.app-header { position:sticky; top:0; z-index:50; background-color:var(--fafa-neutral-50); border-bottom:1px solid var(--fafa-neutral-200); }
.icon-btn { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--fafa-radius-full); border:none; background:transparent; color:var(--fafa-neutral-900); cursor:pointer; -webkit-tap-highlight-color:transparent; }
.icon-btn:active { background:var(--fafa-neutral-200); }
.bottom-bar { position:sticky; bottom:0; z-index:50; background:var(--fafa-card); border-top:1px solid var(--fafa-neutral-200); padding:12px 16px; padding-bottom:max(12px, env(safe-area-inset-bottom)); }
.food-select { display:flex; align-items:center; justify-content:space-between; cursor:pointer; background:#fff; }
</style>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

<!-- Header -->
<header class="app-header">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top));">
    <button class="icon-btn" data-dom-id="back-feeding-plan" aria-label="返回">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 style="font-size:17px; font-weight:600; margin:0; color:var(--fafa-neutral-950);">编辑计划</h1>
    <div style="width:36px;"></div>
  </div>
</header>

<!-- Content -->
<main style="padding:16px; padding-bottom:80px;">

  <!-- AI Suggestion -->
  <div class="ai-element" data-dom-id="ai-suggestion" style="padding:14px 16px; margin-bottom:12px; display:flex; align-items:center; gap:8px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
    <span style="font-size:14px; color:var(--fafa-primary-700); font-weight:500;">AI 建议每日总量 65-75g，你可以在下方调整</span>
  </div>

  <!-- Daily Total Input Card -->
  <div class="card-surface" style="padding:16px; margin-bottom:12px;">
    <span class="field-label" style="display:block; margin-bottom:12px;">每日总量</span>
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
      <input type="number" data-dom-id="input-daily-total" value="70" class="field-input" style="width:100px; flex:none; font-size:22px; font-weight:700; text-align:center; height:48px;">
      <span style="font-size:18px; font-weight:600; color:var(--fafa-neutral-700);">g</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button data-dom-id="adjust-minus-5" class="pill-btn" style="flex:1; text-align:center;">-5g</button>
      <button data-dom-id="adjust-minus-1" class="pill-btn" style="flex:1; text-align:center;">-1g</button>
      <button data-dom-id="adjust-plus-1" class="pill-btn" style="flex:1; text-align:center;">+1g</button>
      <button data-dom-id="adjust-plus-5" class="pill-btn" style="flex:1; text-align:center;">+5g</button>
    </div>
  </div>

  <!-- Meal Frequency Selector -->
  <div class="card-surface" style="padding:16px; margin-bottom:12px;">
    <span class="field-label" style="display:block; margin-bottom:12px;">每日餐次</span>
    <div style="display:flex; gap:8px;">
      <button data-dom-id="freq-2" class="pill-btn" style="flex:1; text-align:center;">2次</button>
      <button data-dom-id="freq-3" class="pill-btn" style="flex:1; text-align:center;">3次</button>
      <button data-dom-id="freq-4" class="pill-btn pill-btn-active" style="flex:1; text-align:center;">4次</button>
      <button data-dom-id="freq-custom" class="pill-btn" style="flex:1; text-align:center;">自定义</button>
    </div>
  </div>

  <!-- Meal Time Slots -->
  <div class="card-surface" style="margin-bottom:12px; overflow:hidden;">

    <!-- Meal 1 -->
    <div class="row-divider" style="padding:14px 16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <span style="font-size:13px; font-weight:600; color:var(--fafa-neutral-700);">餐次 1</span>
        <button data-dom-id="meal-delete-1" class="icon-btn" style="width:30px; height:30px; color:var(--state-error);" aria-label="删除">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="time" data-dom-id="meal-time-1" value="07:30" class="field-input" style="width:88px; flex:none; padding:0 8px; font-size:14px;">
        <div style="display:flex; align-items:center; gap:2px; flex:none;">
          <input type="number" data-dom-id="meal-amount-1" value="25" class="field-input" style="width:52px; padding:0 6px; text-align:center; font-size:14px;">
          <span style="font-size:13px; color:var(--fafa-neutral-600);">g</span>
        </div>
        <button data-dom-id="meal-food-1" class="field-input food-select" style="flex:1; padding:0 10px;">
          <span style="font-size:14px; color:var(--fafa-neutral-900);">皇家猫粮</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- Meal 2 -->
    <div class="row-divider" style="padding:14px 16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <span style="font-size:13px; font-weight:600; color:var(--fafa-neutral-700);">餐次 2</span>
        <button data-dom-id="meal-delete-2" class="icon-btn" style="width:30px; height:30px; color:var(--state-error);" aria-label="删除">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="time" data-dom-id="meal-time-2" value="13:00" class="field-input" style="width:88px; flex:none; padding:0 8px; font-size:14px;">
        <div style="display:flex; align-items:center; gap:2px; flex:none;">
          <input type="number" data-dom-id="meal-amount-2" value="10" class="field-input" style="width:52px; padding:0 6px; text-align:center; font-size:14px;">
          <span style="font-size:13px; color:var(--fafa-neutral-600);">g</span>
        </div>
        <button data-dom-id="meal-food-2" class="field-input food-select" style="flex:1; padding:0 10px;">
          <span style="font-size:14px; color:var(--fafa-neutral-900);">希宝罐头</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- Meal 3 -->
    <div class="row-divider" style="padding:14px 16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <span style="font-size:13px; font-weight:600; color:var(--fafa-neutral-700);">餐次 3</span>
        <button data-dom-id="meal-delete-3" class="icon-btn" style="width:30px; height:30px; color:var(--state-error);" aria-label="删除">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="time" data-dom-id="meal-time-3" value="19:00" class="field-input" style="width:88px; flex:none; padding:0 8px; font-size:14px;">
        <div style="display:flex; align-items:center; gap:2px; flex:none;">
          <input type="number" data-dom-id="meal-amount-3" value="25" class="field-input" style="width:52px; padding:0 6px; text-align:center; font-size:14px;">
          <span style="font-size:13px; color:var(--fafa-neutral-600);">g</span>
        </div>
        <button data-dom-id="meal-food-3" class="field-input food-select" style="flex:1; padding:0 10px;">
          <span style="font-size:14px; color:var(--fafa-neutral-900);">皇家猫粮</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- Meal 4 -->
    <div style="padding:14px 16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <span style="font-size:13px; font-weight:600; color:var(--fafa-neutral-700);">餐次 4</span>
        <button data-dom-id="meal-delete-4" class="icon-btn" style="width:30px; height:30px; color:var(--state-error);" aria-label="删除">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="time" data-dom-id="meal-time-4" value="22:30" class="field-input" style="width:88px; flex:none; padding:0 8px; font-size:14px;">
        <div style="display:flex; align-items:center; gap:2px; flex:none;">
          <input type="number" data-dom-id="meal-amount-4" value="10" class="field-input" style="width:52px; padding:0 6px; text-align:center; font-size:14px;">
          <span style="font-size:13px; color:var(--fafa-neutral-600);">g</span>
        </div>
        <button data-dom-id="meal-food-4" class="field-input food-select" style="flex:1; padding:0 10px;">
          <span style="font-size:14px; color:var(--fafa-neutral-900);">鸡肉冻干</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </div>

  </div>

  <!-- Add Meal Button -->
  <button data-dom-id="add-meal" style="width:100%; height:48px; border:1.5px dashed var(--fafa-primary-300); border-radius:var(--fafa-radius-md); background:var(--fafa-primary-50); color:var(--fafa-primary-600); font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    添加餐次
  </button>

</main>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <button data-dom-id="btn-save" style="width:100%; height:44px; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; font-size:15px; font-weight:600; border:none; cursor:pointer;">保存</button>
</div>

</body>
</html>
