<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>食品详情</title>
  <style id="theme-vars">
    :root, html.light {
      --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
      --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
      --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
      --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
      --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
      --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
      --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06);
    }
    body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
    .card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
    .ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
    .tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
    * { box-sizing:border-box; }
    input, textarea, button, select { font-family:inherit; }
    .field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
    .field-input { width:100%; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; }
    .field-input:focus { border-color:var(--fafa-primary-400); background:#fff; }
    .row-divider { border-bottom:1px solid var(--fafa-neutral-200); }
    .pill-btn { padding:6px 16px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); }
    .pill-btn-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-500); color:#fff; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

  <!-- Header -->
  <header style="position:sticky; top:0; z-index:10; background-color:var(--fafa-neutral-100); border-bottom:1px solid var(--fafa-neutral-200); padding:10px 12px; display:flex; align-items:center; justify-content:space-between;">
    <div style="display:flex; align-items:center; gap:4px;">
      <button data-dom-id="back-food-list" style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; background:transparent; border:none; cursor:pointer; color:var(--fafa-neutral-900);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 style="font-size:17px; font-weight:600; color:var(--fafa-neutral-900); margin:0;">食品详情</h1>
    </div>
    <button data-dom-id="edit-food" style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; background:transparent; border:none; cursor:pointer; color:var(--fafa-neutral-900);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <div style="padding:16px 16px 96px;">

    <!-- Food info card -->
    <div class="card-surface" style="padding:16px;">
      <div style="font-size:20px; font-weight:700; color:var(--fafa-neutral-950); line-height:1.3;">皇家英短成猫粮</div>
      <div style="display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap;">
        <span class="tag-pill" style="background:var(--fafa-neutral-200); color:var(--fafa-neutral-700);">品牌：皇家</span>
        <span class="tag-pill" style="background:var(--fafa-primary-50); color:var(--fafa-primary-700);">主粮</span>
        <span class="tag-pill" style="background:rgba(91,140,90,0.12); color:var(--state-success);">已开封</span>
      </div>
    </div>

    <!-- Nutrition info grid -->
    <div class="card-surface" style="margin-top:12px; padding:0; overflow:hidden;">
      <div style="padding:14px 16px 8px; font-size:15px; font-weight:600; color:var(--fafa-neutral-900);">营养成分</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:0; padding:0 16px 12px;">

        <div class="row-divider" style="padding:12px 8px;">
          <div style="font-size:12px; color:var(--fafa-neutral-600);">热量</div>
          <div style="font-size:16px; font-weight:600; color:var(--fafa-neutral-950); margin-top:2px;">3800 <span style="font-size:12px; font-weight:400; color:var(--fafa-neutral-600);">kcal/kg</span></div>
        </div>
        <div class="row-divider" style="padding:12px 8px 12px 12px;">
          <div style="font-size:12px; color:var(--fafa-neutral-600);">蛋白质</div>
          <div style="font-size:16px; font-weight:600; color:var(--fafa-neutral-950); margin-top:2px;">32<span style="font-size:12px; font-weight:400; color:var(--fafa-neutral-600);">%</span></div>
        </div>

        <div class="row-divider" style="padding:12px 8px;">
          <div style="font-size:12px; color:var(--fafa-neutral-600);">脂肪</div>
          <div style="font-size:16px; font-weight:600; color:var(--fafa-neutral-950); margin-top:2px;">14<span style="font-size:12px; font-weight:400; color:var(--fafa-neutral-600);">%</span></div>
        </div>
        <div class="row-divider" style="padding:12px 8px 12px 12px;">
          <div style="font-size:12px; color:var(--fafa-neutral-600);">规格</div>
          <div style="font-size:16px; font-weight:600; color:var(--fafa-neutral-950); margin-top:2px;">2kg</div>
        </div>

        <div style="padding:12px 8px 4px;">
          <div style="font-size:12px; color:var(--fafa-neutral-600);">购买价格</div>
          <div style="font-size:16px; font-weight:600; color:var(--fafa-neutral-950); margin-top:2px;">¥189</div>
        </div>
        <div style="padding:12px 8px 4px 12px;">
          <div style="font-size:12px; color:var(--fafa-neutral-600);">建议喂食量</div>
          <div style="font-size:16px; font-weight:600; color:var(--fafa-neutral-950); margin-top:2px;">60-70g/天</div>
        </div>

      </div>
    </div>

    <!-- AI suggestion card -->
    <div data-dom-id="ai-food-suggestion" class="ai-element" style="margin-top:12px; padding:14px 16px; display:flex; align-items:flex-start; gap:10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink:0; margin-top:1px; color:var(--fafa-primary-500);"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 3v4M19 17v4M3 5h4M17 19h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="flex:1;">
        <div style="font-size:13px; font-weight:600; color:var(--fafa-primary-700); margin-bottom:2px;">AI 喂食建议</div>
        <div style="font-size:13px; color:var(--fafa-primary-700); line-height:1.55;">根据豆包的体重和活动量，建议每日喂食65-75g</div>
      </div>
    </div>

    <!-- 开封信息 -->
    <div class="card-surface" style="margin-top:12px; padding:14px 16px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="color:var(--fafa-neutral-500);"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size:14px; color:var(--fafa-neutral-700);">开封日期 2026-08-01</span>
      </div>
      <div style="margin-top:8px; padding:8px 12px; background:var(--fafa-neutral-50); border-radius:var(--fafa-radius-md); font-size:13px; color:var(--fafa-neutral-700);">已开封 <span style="font-weight:600; color:var(--state-warning);">17天</span> · 建议开封后30天内吃完</div>
    </div>

    <!-- Usage stats card -->
    <div class="card-surface" style="margin-top:12px; padding:14px 16px;">
      <div style="font-size:15px; font-weight:600; color:var(--fafa-neutral-900); margin-bottom:10px;">使用统计</div>
      <div style="display:flex; align-items:center;">
        <div style="flex:1; text-align:center;">
          <div style="font-size:22px; font-weight:700; color:var(--fafa-primary-600);">12<span style="font-size:13px; font-weight:400; color:var(--fafa-neutral-600);">次</span></div>
          <div style="font-size:12px; color:var(--fafa-neutral-600); margin-top:2px;">本月使用</div>
        </div>
        <div style="width:1px; height:40px; background:var(--fafa-neutral-200);"></div>
        <div style="flex:1; text-align:center;">
          <div style="font-size:22px; font-weight:700; color:var(--fafa-neutral-900);">45<span style="font-size:13px; font-weight:400; color:var(--fafa-neutral-600);">次</span></div>
          <div style="font-size:12px; color:var(--fafa-neutral-600); margin-top:2px;">累计使用</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom actions -->
  <div style="position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:414px; padding:12px 16px 24px; background:var(--fafa-neutral-100); border-top:1px solid var(--fafa-neutral-200); display:flex; gap:12px; z-index:10;">
    <button data-dom-id="btn-edit" style="flex:1; height:48px; border:1px solid var(--fafa-primary-500); border-radius:var(--fafa-radius-full); background:#fff; color:var(--fafa-primary-600); font-size:16px; font-weight:600; cursor:pointer;">编辑</button>
    <button data-dom-id="btn-delete" style="flex:1; height:48px; border:none; border-radius:var(--fafa-radius-full); background:rgba(196,74,63,0.08); color:var(--state-error); font-size:16px; font-weight:600; cursor:pointer;">删除</button>
  </div>

</body>
</html>
