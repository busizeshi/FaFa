<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>添加食品</title>
  <style id="theme-vars">
    :root, html.light {
      --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
      --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
      --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
      --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
      --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
      --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
      --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06);
    }
    body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
    .card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
    .ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
    .tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
    * { box-sizing:border-box; }
    input, textarea, button, select { font-family:inherit; }
    .field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
    .field-input { width:100%; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; }
    .field-input:focus { border-color:var(--fafa-primary-400); background:#fff; }
    .row-divider { border-bottom:1px solid var(--fafa-neutral-200); }
    .pill-btn { padding:6px 16px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); }
    .pill-btn-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-500); color:#fff; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

  <!-- Header -->
  <header style="position:sticky; top:0; z-index:10; background-color:var(--fafa-neutral-100); border-bottom:1px solid var(--fafa-neutral-200); padding:10px 12px; display:flex; align-items:center; gap:4px;">
    <button data-dom-id="back-food-list" style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; background:transparent; border:none; cursor:pointer; color:var(--fafa-neutral-900);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 style="font-size:17px; font-weight:600; color:var(--fafa-neutral-900); margin:0;">添加食品</h1>
  </header>

  <!-- AI recognize hint -->
  <div data-dom-id="ai-recognize-hint" class="ai-element" style="margin:16px; padding:12px 14px; display:flex; align-items:center; gap:10px; cursor:pointer;">
    <div style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-100); color:var(--fafa-primary-600); flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 3v4M19 17v4M3 5h4M17 19h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <span style="flex:1; font-size:14px; color:var(--fafa-primary-700); font-weight:500;">支持拍包装自动识别，点击试试</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="flex-shrink:0; color:var(--fafa-primary-600);"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <!-- Form card -->
  <div class="card-surface" style="margin:0 16px 16px; padding:0; overflow:hidden;">

    <!-- 食品名称 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">食品名称</label>
      <input type="text" data-dom-id="input-food-name" class="field-input" placeholder="请输入食品名称">
    </div>

    <!-- 品牌 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">品牌</label>
      <input type="text" data-dom-id="input-brand" class="field-input" placeholder="请输入品牌">
    </div>

    <!-- 类型 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:10px;">类型</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button data-dom-id="type-staple" class="pill-btn pill-btn-active">主粮</button>
        <button data-dom-id="type-canned" class="pill-btn">罐头</button>
        <button data-dom-id="type-snack" class="pill-btn">零食</button>
        <button data-dom-id="type-nutrition" class="pill-btn">营养品</button>
        <button data-dom-id="type-homemade" class="pill-btn">自制食品</button>
      </div>
    </div>

    <!-- 规格 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">规格</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="text" data-dom-id="input-spec" class="field-input" style="flex:1;" placeholder="如 2kg">
      </div>
    </div>

    <!-- 购买价格 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">购买价格</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:15px; color:var(--fafa-neutral-700); font-weight:500;">¥</span>
        <input type="number" data-dom-id="input-price" class="field-input" style="flex:1;" placeholder="请输入价格">
      </div>
    </div>

    <!-- 热量 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">热量</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="number" data-dom-id="input-calories" class="field-input" style="flex:1;" placeholder="请输入热量">
        <span style="font-size:13px; color:var(--fafa-neutral-600);">kcal/kg</span>
      </div>
    </div>

    <!-- 蛋白质 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">蛋白质</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="number" data-dom-id="input-protein" class="field-input" style="flex:1;" placeholder="请输入蛋白质含量">
        <span style="font-size:13px; color:var(--fafa-neutral-600);">%</span>
      </div>
    </div>

    <!-- 脂肪 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">脂肪</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="number" data-dom-id="input-fat" class="field-input" style="flex:1;" placeholder="请输入脂肪含量">
        <span style="font-size:13px; color:var(--fafa-neutral-600);">%</span>
      </div>
    </div>

    <!-- 建议喂食量 -->
    <div class="row-divider" style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">建议喂食量</label>
      <input type="text" data-dom-id="input-suggested-amount" class="field-input" placeholder="如 60-70g/天">
    </div>

    <!-- 开封日期 -->
    <div class="row-divider" style="display:flex; align-items:center; justify-content:space-between; padding:14px 16px;">
      <span class="field-label">开封日期</span>
      <button data-dom-id="input-open-date" style="display:flex; align-items:center; gap:6px; background:transparent; border:none; cursor:pointer; font-size:15px; color:var(--fafa-primary-600);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>选择日期</span>
      </button>
    </div>

    <!-- 备注 -->
    <div style="padding:14px 16px;">
      <label class="field-label" style="display:block; margin-bottom:8px;">备注</label>
      <textarea data-dom-id="input-notes" rows="3" placeholder="补充说明..." style="width:100%; padding:10px 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; resize:none;"></textarea>
    </div>

  </div>

  <!-- Bottom save -->
  <div style="padding:4px 16px 32px;">
    <button data-dom-id="btn-save" style="width:100%; height:48px; border:none; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; font-size:16px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(196,97,47,0.25);">保存</button>
  </div>

</body>
</html>
