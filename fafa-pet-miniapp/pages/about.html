<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>关于</title>
  <style id="theme-vars">
:root, html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
.tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
.no-scrollbar::-webkit-scrollbar { display:none; }
.no-scrollbar { scrollbar-width:none; -ms-overflow-style:none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh; padding-bottom:56px;">

  <!-- Header -->
  <header class="sticky top-0 z-20 flex items-center gap-3 px-4 py-3" style="background-color:var(--fafa-card); border-bottom:1px solid var(--fafa-border);">
    <button data-dom-id="back-mine" class="flex items-center justify-center w-9 h-9 rounded-full" style="background-color:var(--fafa-neutral-100);" aria-label="返回">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-900);"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="text-lg font-semibold" style="color:var(--fafa-neutral-900);">关于 FaFa</h1>
  </header>

  <div class="flex flex-col px-4 pt-8 pb-4">

    <!-- App info section centered -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="flex items-center justify-center mb-4" style="width:80px; height:80px; border-radius:9999px; background:linear-gradient(135deg,var(--fafa-primary-400),var(--fafa-primary-600)); box-shadow:0 8px 24px rgba(196,97,47,0.25);">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="4" r="2" fill="#FFFFFF" stroke="none"/>
          <circle cx="18" cy="8" r="2" fill="#FFFFFF" stroke="none"/>
          <circle cx="20" cy="16" r="2" fill="#FFFFFF" stroke="none"/>
          <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.46 6 15.633A4 4 0 0 1 9 10z" fill="#FFFFFF" stroke="none"/>
        </svg>
      </div>
      <h2 class="font-bold" style="font-size:28px; color:var(--fafa-neutral-950); letter-spacing:-0.02em;">FaFa</h2>
      <p class="text-sm mt-1.5" style="color:var(--fafa-neutral-600);">记录宠物一生的 AI 生活助手</p>
    </div>

    <!-- Info list in white card -->
    <div class="card-surface overflow-hidden">
      <!-- 版本号 -->
      <div class="flex items-center justify-between" style="padding:14px 16px; border-bottom:1px solid var(--fafa-neutral-200);">
        <span class="text-[15px]" style="color:var(--fafa-neutral-900);">版本号</span>
        <span data-dom-id="app-version" class="text-sm" style="color:var(--fafa-neutral-500);">v1.0.0</span>
      </div>
      <!-- 更新日志 -->
      <div data-dom-id="check-update" class="flex items-center justify-between cursor-pointer" style="padding:14px 16px; border-bottom:1px solid var(--fafa-neutral-200);">
        <span class="text-[15px]" style="color:var(--fafa-neutral-900);">更新日志</span>
        <div class="flex items-center gap-1.5">
          <span class="text-sm" style="color:var(--fafa-primary-600);">查看最新更新</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-400);"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>
      <!-- 用户协议 -->
      <div data-dom-id="user-agreement" class="flex items-center justify-between cursor-pointer" style="padding:14px 16px; border-bottom:1px solid var(--fafa-neutral-200);">
        <span class="text-[15px]" style="color:var(--fafa-neutral-900);">用户协议</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-400);"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <!-- 隐私政策 -->
      <div data-dom-id="privacy-policy" class="flex items-center justify-between cursor-pointer" style="padding:14px 16px; border-bottom:1px solid var(--fafa-neutral-200);">
        <span class="text-[15px]" style="color:var(--fafa-neutral-900);">隐私政策</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-400);"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <!-- 备案信息 -->
      <div class="flex items-center justify-between" style="padding:14px 16px;">
        <span class="text-[15px]" style="color:var(--fafa-neutral-900);">备案信息</span>
        <span data-dom-id="icp-info" class="text-sm" style="color:var(--fafa-neutral-500);">京ICP备XXXXXXXX号</span>
      </div>
    </div>

    <!-- About text -->
    <div class="mt-6 mb-4">
      <p class="text-sm text-center" style="color:var(--fafa-neutral-600); line-height:1.7;">FaFa 致力于帮助宠物主人记录宠物的成长数据，通过 AI 理解这些数据，让每一只宠物都拥有完整的数字生命档案。</p>
    </div>

    <!-- Footer -->
    <div class="text-center" style="margin-top:8px;">
      <p class="text-xs" style="color:var(--fafa-neutral-400);">© 2026 FaFa · Made with love for pets</p>
    </div>

  </div>

</body>
</html>
