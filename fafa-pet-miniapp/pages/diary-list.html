<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日记</title>
  <style id="theme-vars">
:root, html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; margin:0; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
* { box-sizing:border-box; }
button { font-family:inherit; cursor:pointer; }
.no-scrollbar::-webkit-scrollbar { display:none; }
.no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
.clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh; padding-bottom:56px;">

  <!-- Header -->
  <header class="sticky top-0 z-30 flex items-center justify-between" style="height:52px; padding:0 12px; background-color:var(--fafa-background); border-bottom:1px solid var(--fafa-neutral-200);">
    <button data-dom-id="back-timeline" type="button" aria-label="返回" class="flex items-center justify-center" style="width:40px; height:40px; background:transparent; border:none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-950)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="m-0" style="font-size:17px; font-weight:600; color:var(--fafa-neutral-950);">日记</h1>
    <div style="width:40px;"></div>
  </header>

  <!-- Month filter -->
  <div style="padding:14px 0 6px;">
    <div class="no-scrollbar flex gap-2 overflow-x-auto" style="padding:0 16px;">
      <button data-dom-id="month-current" type="button" class="shrink-0" style="padding:7px 16px; border-radius:var(--fafa-radius-full); background-color:var(--fafa-primary-500); color:var(--fafa-primary-foreground); font-size:13px; font-weight:600; border:none; white-space:nowrap;">2026年8月</button>
      <button data-dom-id="month-prev1" type="button" class="shrink-0" style="padding:7px 16px; border-radius:var(--fafa-radius-full); background-color:var(--fafa-neutral-0); color:var(--fafa-neutral-700); font-size:13px; font-weight:500; border:1px solid var(--fafa-neutral-300); white-space:nowrap;">2026年7月</button>
      <button data-dom-id="month-prev2" type="button" class="shrink-0" style="padding:7px 16px; border-radius:var(--fafa-radius-full); background-color:var(--fafa-neutral-0); color:var(--fafa-neutral-700); font-size:13px; font-weight:500; border:1px solid var(--fafa-neutral-300); white-space:nowrap;">2026年6月</button>
    </div>
  </div>

  <main style="padding:8px 16px 96px;">

    <!-- AI writing assist entry -->
    <div data-dom-id="ai-diary-write" class="ai-element flex items-center gap-3" style="padding:14px 16px; margin-bottom:16px;">
      <div class="flex items-center justify-center shrink-0" style="width:40px; height:40px; border-radius:var(--fafa-radius-md); background-color:var(--fafa-primary-100);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/></svg>
      </div>
      <div class="flex-1 min-w-0">
        <div style="font-size:15px; font-weight:600; color:var(--fafa-neutral-950);">AI 帮你写日记</div>
        <div style="font-size:12px; color:var(--fafa-neutral-600); margin-top:2px;">不知道怎么记录？让 AI 帮你整理今天的故事</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>

    <!-- Diary 1: 8月15日 -->
    <div data-dom-id="diary-1" class="card-surface" style="padding:16px; margin-bottom:12px;">
      <div class="flex items-center justify-between" style="margin-bottom:10px;">
        <span style="font-size:13px; font-weight:600; color:var(--fafa-primary-500);">8月15日</span>
        <div class="flex items-center gap-1.5" style="font-size:12px; color:var(--fafa-neutral-600);">
          <span>😊 开心</span>
          <span style="color:var(--fafa-neutral-300);">·</span>
          <span>☀️ 晴</span>
        </div>
      </div>
      <h3 class="m-0" style="font-size:16px; font-weight:600; color:var(--fafa-neutral-950); margin-bottom:6px;">阳光午后的豆包</h3>
      <p class="clamp-2 m-0" style="font-size:14px; color:var(--fafa-neutral-700); line-height:1.5; margin-bottom:12px;">今天豆包又在阳台晒了一下午太阳，它趴在蓝色的猫窝里，阳光洒在毛上金灿灿的...</p>
      <div class="flex gap-2">
        <div class="flex items-center justify-center" style="width:76px; height:76px; border-radius:var(--fafa-radius-md); background:linear-gradient(135deg,#F5E0D5 0%,#EDC5B0 55%,#E0A585 100%); overflow:hidden;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </div>
      </div>
    </div>

    <!-- Diary 2: 8月10日 -->
    <div data-dom-id="diary-2" class="card-surface" style="padding:16px; margin-bottom:12px;">
      <div class="flex items-center justify-between" style="margin-bottom:10px;">
        <span style="font-size:13px; font-weight:600; color:var(--fafa-primary-500);">8月10日</span>
        <div class="flex items-center gap-1.5" style="font-size:12px; color:var(--fafa-neutral-600);">
          <span>😊 开心</span>
          <span style="color:var(--fafa-neutral-300);">·</span>
          <span>⛅ 多云</span>
        </div>
      </div>
      <h3 class="m-0" style="font-size:16px; font-weight:600; color:var(--fafa-neutral-950); margin-bottom:6px;">第一次去海边</h3>
      <p class="clamp-2 m-0" style="font-size:14px; color:var(--fafa-neutral-700); line-height:1.5; margin-bottom:12px;">带豆包第一次去海边，它一开始很害怕海浪的声音，后来慢慢适应了...</p>
      <div class="flex gap-2">
        <div class="flex items-center justify-center" style="width:76px; height:76px; border-radius:var(--fafa-radius-md); background:linear-gradient(135deg,#FAF0EB 0%,#F5E0D5 55%,#EDC5B0 100%); overflow:hidden;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </div>
        <div class="flex items-center justify-center" style="width:76px; height:76px; border-radius:var(--fafa-radius-md); background:linear-gradient(135deg,#EDC5B0 0%,#E0A585 55%,#D38057 100%); overflow:hidden;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </div>
      </div>
    </div>

    <!-- Diary 3: 8月3日 -->
    <div data-dom-id="diary-3" class="card-surface" style="padding:16px; margin-bottom:12px;">
      <div class="flex items-center justify-between" style="margin-bottom:10px;">
        <span style="font-size:13px; font-weight:600; color:var(--fafa-primary-500);">8月3日</span>
        <div class="flex items-center gap-1.5" style="font-size:12px; color:var(--fafa-neutral-600);">
          <span>😐 平静</span>
          <span style="color:var(--fafa-neutral-300);">·</span>
          <span>☀️ 晴</span>
        </div>
      </div>
      <h3 class="m-0" style="font-size:16px; font-weight:600; color:var(--fafa-neutral-950); margin-bottom:6px;">换了新猫粮</h3>
      <p class="clamp-2 m-0" style="font-size:14px; color:var(--fafa-neutral-700); line-height:1.5;">今天给豆包换了新的猫粮，它闻了好久才开始吃，希望肠胃能适应...</p>
    </div>

  </main>

  <!-- Floating add button -->
  <div style="position:fixed; left:50%; transform:translateX(-50%); bottom:24px; width:100%; max-width:414px; display:flex; justify-content:flex-end; padding-right:16px; pointer-events:none; z-index:40;">
    <button data-dom-id="add-diary" type="button" aria-label="写新日记" class="flex items-center justify-center" style="pointer-events:auto; width:56px; height:56px; border-radius:50%; background-color:var(--fafa-primary-500); border:none; box-shadow:0 6px 16px rgba(196,97,47,0.35);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

</body>
</html>
