<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>快捷喂食</title>
  <style id="theme-vars">
    :root, html.light {
      --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
      --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
      --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
      --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
      --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
      --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
      --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06); --shadow-popover:0 8px 24px rgba(31,36,33,0.10);
    }
    body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
    .card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
    .ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
    .tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
    * { box-sizing:border-box; }
    input, textarea, button, select { font-family:inherit; }
    .field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
    .field-input { width:100%; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; }
    .field-input:focus { border-color:var(--fafa-primary-400); background:#fff; }
    .row-divider { border-bottom:1px solid var(--fafa-neutral-200); }
    .pill-btn { padding:6px 16px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); }
    .pill-btn-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-500); color:#fff; }
    /* Bottom sheet animation */
    .bottom-sheet {
      position:fixed;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:414px;
      max-width:100%;
      background-color:var(--fafa-card);
      border-radius:24px 24px 0 0;
      box-shadow:var(--shadow-popover);
      z-index:50;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform:translateX(-50%) translateY(100%); }
      to { transform:translateX(-50%) translateY(0); }
    }
    .overlay {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.4);
      z-index:40;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity:0; }
      to { opacity:1; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

  <!-- Semi-transparent overlay -->
  <div class="overlay" data-dom-id="quick-overlay"></div>

  <!-- Bottom sheet -->
  <div class="bottom-sheet">

    <!-- Drag handle -->
    <div style="display:flex; justify-content:center; padding:10px 0 4px;">
      <div style="width:36px; height:5px; border-radius:9999px; background-color:var(--fafa-neutral-300);"></div>
    </div>

    <!-- Title row -->
    <div style="display:flex; align-items:center; justify-content:space-between; padding:4px 20px 12px;">
      <h1 style="font-size:18px; font-weight:700; color:var(--fafa-neutral-950); margin:0;">快捷喂食</h1>
      <button data-dom-id="close-popup" type="button" aria-label="关闭" style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; background:transparent; border:none; cursor:pointer; color:var(--fafa-neutral-600);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <!-- AI prefill notice -->
    <div class="ai-element" style="margin:0 20px 14px; padding:12px 14px; display:flex; align-items:flex-start; gap:8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px; color:var(--fafa-primary-500);">
        <path d="M12 3l1.6 4.3L18 9l-4.4 1.7L12 15l-1.6-4.3L6 9l4.4-1.7L12 3z"/>
        <path d="M19 14l.8 2.1L22 17l-2.2.9L19 20l-.8-2.1L16 17l2.2-.9L19 14z"/>
      </svg>
      <span style="font-size:13px; color:var(--fafa-primary-700); line-height:1.5;">已为你预填最近一次记录，直接保存即可</span>
    </div>

    <!-- Current pet indicator -->
    <div style="margin:0 20px 12px; display:flex; align-items:center; gap:8px;">
      <div style="width:28px; height:28px; border-radius:50%; background-color:var(--fafa-primary-100); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--fafa-primary-700);">豆</div>
      <span style="font-size:14px; color:var(--fafa-neutral-700); font-weight:500;">豆包</span>
    </div>

    <!-- Time display -->
    <div style="margin:0 20px 14px; display:flex; align-items:center; gap:6px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-500);">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <span data-dom-id="quick-time" style="font-size:14px; color:var(--fafa-neutral-700); font-weight:500;">08:15</span>
    </div>

    <!-- Food info card -->
    <div class="card-surface" style="margin:0 20px 14px; padding:16px; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:12px; flex:1; min-width:0;">
        <div style="width:44px; height:44px; border-radius:12px; background-color:var(--fafa-primary-50); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-primary-500);">
            <path d="M3 11h18l-2 9H5l-2-9z"/><path d="M5 11V8a7 7 0 0 1 14 0v3"/>
          </svg>
        </div>
        <div style="flex:1; min-width:0;">
          <div data-dom-id="quick-food-name" style="font-size:14px; color:var(--fafa-neutral-900); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">皇家英短成猫粮</div>
          <div style="margin-top:2px;">
            <span data-dom-id="quick-amount" style="font-size:28px; font-weight:700; color:var(--fafa-primary-600); line-height:1.2;">32g</span>
          </div>
        </div>
      </div>
      <button data-dom-id="quick-edit-detail" type="button" aria-label="编辑详情" style="display:flex; align-items:center; justify-content:center; width:36px; height:36px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); background:var(--fafa-neutral-50); cursor:pointer; color:var(--fafa-neutral-600); flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>

    <!-- Quick adjust buttons -->
    <div style="margin:0 20px 12px;">
      <div style="font-size:13px; color:var(--fafa-neutral-600); margin-bottom:8px;">快速调整</div>
      <div style="display:flex; gap:8px;">
        <button data-dom-id="quick-adjust-minus5" type="button" style="flex:1; height:40px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); font-size:14px; font-weight:500; cursor:pointer;">-5g</button>
        <button data-dom-id="quick-adjust-minus1" type="button" style="flex:1; height:40px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); font-size:14px; font-weight:500; cursor:pointer;">-1g</button>
        <button data-dom-id="quick-adjust-plus1" type="button" style="flex:1; height:40px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); font-size:14px; font-weight:500; cursor:pointer;">+1g</button>
        <button data-dom-id="quick-adjust-plus5" type="button" style="flex:1; height:40px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); font-size:14px; font-weight:500; cursor:pointer;">+5g</button>
      </div>
    </div>

    <!-- Change food link -->
    <div style="margin:0 20px 16px; display:flex; justify-content:center;">
      <button data-dom-id="quick-change-food" type="button" style="background:transparent; border:none; cursor:pointer; font-size:14px; color:var(--fafa-primary-600); font-weight:500; padding:4px 8px;">修改食品</button>
    </div>

    <!-- Bottom buttons -->
    <div style="padding:4px 20px 32px; border-top:1px solid var(--fafa-neutral-200); padding-top:14px;">
      <button data-dom-id="quick-save" type="button" style="width:100%; height:48px; border:none; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; font-size:16px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(196,97,47,0.25);">保存</button>
      <button data-dom-id="quick-full-edit" type="button" style="display:block; width:100%; margin-top:10px; height:36px; background:transparent; border:none; color:var(--fafa-neutral-600); font-size:14px; cursor:pointer;">编辑详细内容</button>
    </div>

  </div>

</body>
</html>
