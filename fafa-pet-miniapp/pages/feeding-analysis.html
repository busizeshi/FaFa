<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>喂食分析</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<style id="theme-vars">
:root, html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04); --shadow-hover:0 4px 12px rgba(31,36,33,0.06);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
.tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
* { box-sizing:border-box; }
input, textarea, button, select { font-family:inherit; }
.field-label { font-size:15px; color:var(--fafa-neutral-900); font-weight:500; }
.field-input { width:100%; height:40px; padding:0 12px; border:1px solid var(--fafa-neutral-300); border-radius:var(--fafa-radius-md); font-size:15px; color:var(--fafa-neutral-900); background:var(--fafa-neutral-50); outline:none; }
.field-input:focus { border-color:var(--fafa-primary-400); background:#fff; }
.row-divider { border-bottom:1px solid var(--fafa-neutral-200); }
.pill-btn { padding:6px 16px; border-radius:var(--fafa-radius-full); font-size:13px; font-weight:500; cursor:pointer; border:1px solid var(--fafa-neutral-300); background:var(--fafa-neutral-50); color:var(--fafa-neutral-700); }
.pill-btn-active { border:1px solid var(--fafa-primary-500); background:var(--fafa-primary-500); color:#fff; }
.app-header { position:sticky; top:0; z-index:50; background-color:var(--fafa-neutral-50); border-bottom:1px solid var(--fafa-neutral-200); }
.icon-btn { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--fafa-radius-full); border:none; background:transparent; color:var(--fafa-neutral-900); cursor:pointer; -webkit-tap-highlight-color:transparent; }
.icon-btn:active { background:var(--fafa-neutral-200); }
.progress-track { height:8px; background:var(--fafa-neutral-200); border-radius:var(--fafa-radius-full); overflow:hidden; }
.progress-fill { height:100%; border-radius:var(--fafa-radius-full); }
</style>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh;">

<!-- Header -->
<header class="app-header">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top));">
    <button class="icon-btn" data-dom-id="back-feeding-list" aria-label="返回">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 style="font-size:17px; font-weight:600; margin:0; color:var(--fafa-neutral-950);">喂食分析</h1>
    <div style="width:36px;"></div>
  </div>
</header>

<!-- Content -->
<main style="padding:16px;">

  <!-- Period Selector -->
  <div style="display:flex; gap:8px; margin-bottom:12px;">
    <button data-dom-id="period-7d" class="pill-btn" style="flex:1; text-align:center;">近7天</button>
    <button data-dom-id="period-30d" class="pill-btn pill-btn-active" style="flex:1; text-align:center;">近30天</button>
    <button data-dom-id="period-3m" class="pill-btn" style="flex:1; text-align:center;">近3个月</button>
  </div>

  <!-- Summary Card -->
  <div class="card-surface" style="padding:16px; margin-bottom:12px;">
    <span style="font-size:13px; color:var(--fafa-neutral-500);">过去30天</span>
    <div style="display:flex; align-items:flex-end; gap:12px; margin-top:6px; flex-wrap:wrap;">
      <div style="display:flex; align-items:baseline; gap:4px;">
        <span style="font-size:32px; font-weight:700; color:var(--fafa-neutral-950); line-height:1;">78</span>
        <span style="font-size:16px; color:var(--fafa-neutral-600);">g</span>
        <span style="font-size:13px; color:var(--fafa-neutral-500); margin-left:8px;">平均每日</span>
      </div>
      <div style="display:flex; align-items:center; gap:2px; color:var(--state-success); font-size:13px; font-weight:500; margin-bottom:4px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
        4%
        <span style="color:var(--fafa-neutral-500); margin-left:4px; font-weight:400;">vs 上月</span>
      </div>
    </div>
    <!-- Mini trend bars -->
    <div style="display:flex; align-items:flex-end; gap:6px; height:52px; margin-top:16px;">
      <div style="flex:1; height:60%; background:var(--fafa-primary-300); border-radius:3px 3px 0 0;"></div>
      <div style="flex:1; height:75%; background:var(--fafa-primary-300); border-radius:3px 3px 0 0;"></div>
      <div style="flex:1; height:55%; background:var(--fafa-primary-300); border-radius:3px 3px 0 0;"></div>
      <div style="flex:1; height:85%; background:var(--fafa-primary-300); border-radius:3px 3px 0 0;"></div>
      <div style="flex:1; height:70%; background:var(--fafa-primary-300); border-radius:3px 3px 0 0;"></div>
      <div style="flex:1; height:90%; background:var(--fafa-primary-300); border-radius:3px 3px 0 0;"></div>
      <div style="flex:1; height:65%; background:var(--fafa-primary-500); border-radius:3px 3px 0 0;"></div>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:6px;">
      <span style="font-size:11px; color:var(--fafa-neutral-400);">7天前</span>
      <span style="font-size:11px; color:var(--fafa-neutral-400);">今天</span>
    </div>
  </div>

  <!-- Weight vs Feeding Correlation Card -->
  <div class="card-surface" style="padding:16px; margin-bottom:12px;">
    <h3 style="font-size:16px; font-weight:600; margin:0 0 8px; color:var(--fafa-neutral-950);">喂食量 vs 体重</h3>
    <div style="display:flex; gap:16px; margin-bottom:16px;">
      <span style="display:flex; align-items:center; gap:4px; font-size:12px; color:var(--fafa-primary-600);">
        <span style="width:8px; height:8px; border-radius:50%; background:var(--fafa-primary-400); display:inline-block;"></span>
        喂食量(g)
      </span>
      <span style="display:flex; align-items:center; gap:4px; font-size:12px; color:var(--state-info);">
        <span style="width:8px; height:8px; border-radius:50%; background:var(--state-info); display:inline-block;"></span>
        体重(kg)
      </span>
    </div>
    <!-- Chart -->
    <div style="display:flex; align-items:flex-end; gap:16px; height:130px; padding:0 4px;">
      <!-- Week 1 -->
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="display:flex; gap:4px; align-items:flex-end; height:100px;">
          <div style="width:16px; height:95%; background:var(--fafa-primary-400); border-radius:3px 3px 0 0;"></div>
          <div style="width:16px; height:51%; background:var(--state-info); border-radius:3px 3px 0 0;"></div>
        </div>
        <span style="font-size:11px; color:var(--fafa-neutral-500);">W1</span>
      </div>
      <!-- Week 2 -->
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="display:flex; gap:4px; align-items:flex-end; height:100px;">
          <div style="width:16px; height:90%; background:var(--fafa-primary-400); border-radius:3px 3px 0 0;"></div>
          <div style="width:16px; height:61%; background:var(--state-info); border-radius:3px 3px 0 0;"></div>
        </div>
        <span style="font-size:11px; color:var(--fafa-neutral-500);">W2</span>
      </div>
      <!-- Week 3 -->
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="display:flex; gap:4px; align-items:flex-end; height:100px;">
          <div style="width:16px; height:82%; background:var(--fafa-primary-400); border-radius:3px 3px 0 0;"></div>
          <div style="width:16px; height:71%; background:var(--state-info); border-radius:3px 3px 0 0;"></div>
        </div>
        <span style="font-size:11px; color:var(--fafa-neutral-500);">W3</span>
      </div>
      <!-- Week 4 -->
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="display:flex; gap:4px; align-items:flex-end; height:100px;">
          <div style="width:16px; height:90%; background:var(--fafa-primary-400); border-radius:3px 3px 0 0;"></div>
          <div style="width:16px; height:61%; background:var(--state-info); border-radius:3px 3px 0 0;"></div>
        </div>
        <span style="font-size:11px; color:var(--fafa-neutral-500);">W4</span>
      </div>
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:10px; padding:0 4px;">
      <div style="font-size:11px; color:var(--fafa-neutral-500); line-height:1.7;">
        <div>W1: 80g / 5.1kg</div>
        <div>W2: 78g / 5.2kg</div>
      </div>
      <div style="font-size:11px; color:var(--fafa-neutral-500); line-height:1.7; text-align:right;">
        <div>W3: 75g / 5.3kg</div>
        <div>W4: 78g / 5.2kg</div>
      </div>
    </div>
  </div>

  <!-- AI Analysis Card -->
  <div class="ai-element" style="padding:16px; margin-bottom:12px;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
      <span style="font-size:16px; font-weight:600; color:var(--fafa-primary-700);">AI 分析结果</span>
    </div>
    <p style="font-size:14px; color:var(--fafa-neutral-800); line-height:1.7; margin:0 0 12px;">过去30天平均每日喂食78g，相比上月减少约4%。体重从5.1kg升至5.5kg后回落至5.2kg，增长较明显。建议结合食品包装建议和实际活动量重新评估每日喂食量。</p>
    <p style="font-size:12px; color:var(--fafa-neutral-500); margin:0 0 14px;">这不是医疗建议，仅提供数据分析参考</p>
    <button data-dom-id="ask-ai-detail" style="width:100%; height:42px; border-radius:var(--fafa-radius-full); background:var(--fafa-primary-500); color:#fff; font-size:15px; font-weight:600; border:none; cursor:pointer;">问问 AI 详情</button>
  </div>

  <!-- Food Breakdown Card -->
  <div class="card-surface" style="padding:16px; margin-bottom:12px;">
    <h3 style="font-size:16px; font-weight:600; margin:0 0 16px; color:var(--fafa-neutral-950);">食品占比</h3>

    <div style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="font-size:14px; color:var(--fafa-neutral-900);">皇家猫粮</span>
        <span style="font-size:14px; font-weight:600; color:var(--fafa-neutral-900);">65%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:65%; background:var(--fafa-primary-500);"></div>
      </div>
    </div>

    <div style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="font-size:14px; color:var(--fafa-neutral-900);">希宝罐头</span>
        <span style="font-size:14px; font-weight:600; color:var(--fafa-neutral-900);">20%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:20%; background:var(--fafa-primary-300);"></div>
      </div>
    </div>

    <div>
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="font-size:14px; color:var(--fafa-neutral-900);">鸡肉冻干</span>
        <span style="font-size:14px; font-weight:600; color:var(--fafa-neutral-900);">15%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:15%; background:var(--fafa-neutral-400);"></div>
      </div>
    </div>
  </div>

</main>

</body>
</html>
