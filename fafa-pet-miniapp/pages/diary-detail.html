<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日记详情</title>
  <style id="theme-vars">
:root, html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; margin:0; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
* { box-sizing:border-box; }
button { font-family:inherit; cursor:pointer; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh; padding-bottom:56px;">

  <!-- Header -->
  <header class="sticky top-0 z-30 flex items-center justify-between" style="height:52px; padding:0 12px; background-color:var(--fafa-background); border-bottom:1px solid var(--fafa-neutral-200);">
    <button data-dom-id="back-diary-list" type="button" aria-label="返回" class="flex items-center justify-center" style="width:40px; height:40px; background:transparent; border:none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-950)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="m-0" style="font-size:17px; font-weight:600; color:var(--fafa-neutral-950);">日记详情</h1>
    <div class="flex items-center gap-1">
      <button data-dom-id="edit-diary" type="button" aria-label="编辑" class="flex items-center justify-center" style="width:36px; height:40px; background:transparent; border:none;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-neutral-800)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button data-dom-id="delete-diary" type="button" aria-label="删除" class="flex items-center justify-center" style="width:36px; height:40px; background:transparent; border:none;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--state-error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
  </header>

  <main style="padding:20px 16px 96px;">

    <!-- Date -->
    <div data-dom-id="diary-date" style="font-size:13px; font-weight:600; color:var(--fafa-primary-500); margin-bottom:8px;">2026年8月15日</div>

    <!-- Title -->
    <h1 data-dom-id="diary-title" class="m-0" style="font-size:24px; font-weight:700; color:var(--fafa-neutral-950); line-height:1.35; margin-bottom:12px;">阳光午后的豆包</h1>

    <!-- Mood & weather meta -->
    <div data-dom-id="diary-meta" class="flex items-center gap-2" style="font-size:13px; color:var(--fafa-neutral-600); margin-bottom:14px;">
      <span>😊 开心</span>
      <span style="color:var(--fafa-neutral-300);">·</span>
      <span>☀️ 晴</span>
    </div>

    <!-- AI assisted badge -->
    <div data-dom-id="ai-assisted-badge" class="inline-flex items-center gap-1" style="padding:4px 10px; border-radius:var(--fafa-radius-full); border:1.5px dashed var(--fafa-primary-300); background-color:var(--fafa-primary-50); margin-bottom:18px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/></svg>
      <span style="font-size:12px; font-weight:600; color:var(--fafa-primary-600);">AI 辅助创作</span>
    </div>

    <!-- Body -->
    <p data-dom-id="diary-body" class="m-0" style="font-size:15px; color:var(--fafa-neutral-800); line-height:1.8; margin-bottom:18px;">今天豆包又在阳台晒了一下午太阳。它趴在蓝色的猫窝里，阳光从窗户洒进来，照在它的毛上金灿灿的。它偶尔翻个身，伸个懒腰，然后继续睡。我偷偷拍了好几张照片，每一张都特别可爱。这种安静的下午真的太美好了。</p>

    <!-- Photo gallery -->
    <div data-dom-id="diary-photo-1" class="flex items-center justify-center" style="width:100%; height:220px; border-radius:var(--fafa-radius-lg); background:linear-gradient(135deg,#F5E0D5 0%,#EDC5B0 45%,#E0A585 80%,#D38057 100%); overflow:hidden; margin-bottom:20px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </div>

    <!-- AI entry card: generate post -->
    <div data-dom-id="ai-diary-to-post" class="ai-element flex items-center gap-3" style="padding:14px 16px;">
      <div class="flex items-center justify-center shrink-0" style="width:40px; height:40px; border-radius:var(--fafa-radius-md); background-color:var(--fafa-primary-100);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/></svg>
      </div>
      <div class="flex-1 min-w-0">
        <div style="font-size:15px; font-weight:600; color:var(--fafa-neutral-950);">根据这篇日记写一篇小红书</div>
        <div style="font-size:12px; color:var(--fafa-neutral-600); margin-top:2px;">AI 生成分享文案，一键发布</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--fafa-primary-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>

  </main>

  <!-- Bottom action buttons -->
  <div style="position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:414px; background-color:var(--fafa-neutral-0); border-top:1px solid var(--fafa-neutral-200); padding:12px 16px; z-index:40; box-shadow:0 -2px 8px rgba(31,36,33,0.04);">
    <div class="flex gap-3">
      <button data-dom-id="edit-diary-btn" type="button" class="flex items-center justify-center gap-1.5" style="flex:1; padding:12px; border-radius:var(--fafa-radius-full); background-color:var(--fafa-neutral-0); border:1.5px solid var(--fafa-primary-500); color:var(--fafa-primary-600); font-size:15px; font-weight:600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span>编辑</span>
      </button>
      <button data-dom-id="delete-diary-btn" type="button" class="flex items-center justify-center gap-1.5" style="flex:1; padding:12px; border-radius:var(--fafa-radius-full); background-color:var(--fafa-neutral-0); border:1.5px solid var(--state-error); color:var(--state-error); font-size:15px; font-weight:600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span>删除</span>
      </button>
    </div>
  </div>

</body>
</html>
