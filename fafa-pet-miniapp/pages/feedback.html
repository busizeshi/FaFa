<!DOCTYPE html>
<html lang="zh" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>意见反馈</title>
  <style id="theme-vars">
:root, html.light {
  --fafa-primary-50:#FAF0EB; --fafa-primary-100:#F5E0D5; --fafa-primary-200:#EDC5B0; --fafa-primary-300:#E0A585; --fafa-primary-400:#D38057; --fafa-primary-500:#C4612F; --fafa-primary-600:#A85228; --fafa-primary-700:#8B4221; --fafa-primary-foreground:#FFFFFF;
  --fafa-neutral-0:#FFFFFF; --fafa-neutral-50:#FBF9F5; --fafa-neutral-100:#F7F4EF; --fafa-neutral-200:#EFEAE1; --fafa-neutral-300:#E7E1D7; --fafa-neutral-400:#D4CDC0; --fafa-neutral-500:#B8B0A3; --fafa-neutral-600:#9A9185; --fafa-neutral-700:#7C7367; --fafa-neutral-800:#5C635D; --fafa-neutral-900:#3D3D3A; --fafa-neutral-950:#1F2421;
  --state-success:#5B8C5A; --state-warning:#D49B3A; --state-error:#C44A3F; --state-info:#5A8EAD;
  --fafa-background:var(--fafa-neutral-100); --fafa-foreground:var(--fafa-neutral-950); --fafa-card:#FFFFFF; --fafa-border:var(--fafa-neutral-300);
  --fafa-radius-sm:4px; --fafa-radius-md:8px; --fafa-radius-lg:16px; --fafa-radius-full:9999px;
  --fafa-font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  --shadow-card:0 2px 8px rgba(31,36,33,0.04);
}
body { font-family:var(--fafa-font-sans); background-color:var(--fafa-background); color:var(--fafa-foreground); -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.6; }
.card-surface { background-color:var(--fafa-card); border-radius:var(--fafa-radius-lg); box-shadow:var(--shadow-card); }
.ai-element { border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50); border-radius:var(--fafa-radius-lg); }
.tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--fafa-radius-full); font-size:12px; font-weight:500; }
.no-scrollbar::-webkit-scrollbar { display:none; }
.no-scrollbar { scrollbar-width:none; -ms-overflow-style:none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
</head>
<body style="background-color:var(--fafa-background); font-family:var(--fafa-font-sans); color:var(--fafa-foreground); max-width:414px; margin:0 auto; min-height:100vh; padding-bottom:80px;">

  <!-- Header -->
  <header class="sticky top-0 z-20 flex items-center gap-3 px-4 py-3" style="background-color:var(--fafa-card); border-bottom:1px solid var(--fafa-border);">
    <button data-dom-id="back-mine" class="flex items-center justify-center w-9 h-9 rounded-full" style="background-color:var(--fafa-neutral-100);" aria-label="返回">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-900);"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="text-lg font-semibold" style="color:var(--fafa-neutral-900);">意见反馈</h1>
  </header>

  <div class="px-4 pt-4 flex flex-col gap-5">

    <!-- Feedback type selector -->
    <div>
      <p class="text-sm font-medium mb-2.5" style="color:var(--fafa-neutral-900);">反馈类型</p>
      <div class="grid grid-cols-3 gap-2.5">
        <!-- 功能建议 (selected) -->
        <div data-dom-id="feedback-suggestion" class="flex flex-col items-center justify-center cursor-pointer" style="padding:14px 4px; border-radius:12px; background-color:var(--fafa-primary-50); border:1.5px solid var(--fafa-primary-500);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-primary-500); margin-bottom:4px;"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/></svg>
          <span class="text-xs font-medium" style="color:var(--fafa-primary-600);">功能建议</span>
        </div>
        <!-- Bug反馈 -->
        <div data-dom-id="feedback-bug" class="flex flex-col items-center justify-center cursor-pointer" style="padding:14px 4px; border-radius:12px; background-color:var(--fafa-card); border:1px solid var(--fafa-border);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-500); margin-bottom:4px;"><path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6.53 9c1.6-.2 3.47-.8 5.47-.8"/><path d="M17.47 9c1.93-.2 3.53-1.9 3.53-4"/><path d="M17.47 9c-1.6-.2-3.47-.8-5.47-.8"/></svg>
          <span class="text-xs font-medium" style="color:var(--fafa-neutral-600);">Bug反馈</span>
        </div>
        <!-- 其他 -->
        <div data-dom-id="feedback-other" class="flex flex-col items-center justify-center cursor-pointer" style="padding:14px 4px; border-radius:12px; background-color:var(--fafa-card); border:1px solid var(--fafa-border);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-neutral-500); margin-bottom:4px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span class="text-xs font-medium" style="color:var(--fafa-neutral-600);">其他</span>
        </div>
      </div>
    </div>

    <!-- Content textarea -->
    <div>
      <div class="flex items-center justify-between mb-2.5">
        <p class="text-sm font-medium" style="color:var(--fafa-neutral-900);">反馈内容</p>
        <span class="text-xs" style="color:var(--fafa-neutral-400);"><span id="char-count">0</span>/500</span>
      </div>
      <div class="card-surface" style="padding:2px;">
        <textarea data-dom-id="feedback-content" placeholder="请详细描述你的建议或遇到的问题..." style="width:100%; min-height:150px; padding:12px 14px; border:none; outline:none; resize:none; font-size:14px; line-height:1.6; color:var(--fafa-neutral-900); background:transparent; font-family:inherit;" maxlength="500"></textarea>
      </div>
    </div>

    <!-- Screenshot upload -->
    <div>
      <p class="text-sm font-medium mb-2.5" style="color:var(--fafa-neutral-900);">截图 <span class="text-xs font-normal" style="color:var(--fafa-neutral-500);">（选填）</span></p>
      <div class="flex items-center gap-2.5">
        <!-- Uploaded thumbnail 1 -->
        <div data-dom-id="screenshot-1" class="relative shrink-0 cursor-pointer" style="width:72px; height:72px; border-radius:12px; overflow:hidden; background:linear-gradient(135deg,#F5E0D5,#D38057);">
          <div class="absolute flex items-center justify-center" style="top:4px; right:4px; width:18px; height:18px; border-radius:9999px; background:rgba(31,36,33,0.5);">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </div>
        </div>
        <!-- Upload area (dashed) -->
        <div data-dom-id="upload-screenshot" class="flex flex-col items-center justify-center cursor-pointer shrink-0" style="width:72px; height:72px; border-radius:12px; border:1.5px dashed var(--fafa-primary-200); background-color:var(--fafa-primary-50);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-primary-400);"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </div>
      </div>
      <p class="text-xs mt-2" style="color:var(--fafa-neutral-400);">添加截图（最多3张）</p>
    </div>

    <!-- Contact info -->
    <div>
      <p class="text-sm font-medium mb-2.5" style="color:var(--fafa-neutral-900);">联系方式 <span class="text-xs font-normal" style="color:var(--fafa-neutral-500);">（选填）</span></p>
      <div class="card-surface" style="padding:2px;">
        <input data-dom-id="input-contact" type="text" placeholder="选填，方便我们回复你" style="width:100%; padding:12px 14px; border:none; outline:none; font-size:14px; color:var(--fafa-neutral-900); background:transparent;" />
      </div>
    </div>

    <!-- Previous feedback section -->
    <div>
      <p class="text-sm font-medium mb-2.5" style="color:var(--fafa-neutral-900);">历史反馈</p>
      <div class="flex flex-col gap-2.5">
        <!-- History 1 - 待处理 -->
        <div data-dom-id="history-feedback-1" class="card-surface cursor-pointer" style="padding:14px;">
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center gap-2">
              <span class="text-xs font-medium" style="color:var(--fafa-neutral-700);">功能建议</span>
              <span class="tag-pill" style="background-color:rgba(212,155,58,0.12); color:var(--state-warning);">待处理</span>
            </div>
            <span class="text-xs" style="color:var(--fafa-neutral-400);">2026-08-10</span>
          </div>
          <p class="text-sm" style="color:var(--fafa-neutral-700); line-height:1.5;">希望增加照片批量删除功能</p>
        </div>
        <!-- History 2 - 已回复 -->
        <div data-dom-id="history-feedback-2" class="card-surface cursor-pointer" style="padding:14px;">
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center gap-2">
              <span class="text-xs font-medium" style="color:var(--fafa-neutral-700);">Bug</span>
              <span class="tag-pill" style="background-color:rgba(91,140,90,0.12); color:var(--state-success);">已回复</span>
            </div>
            <span class="text-xs" style="color:var(--fafa-neutral-400);">2026-08-05</span>
          </div>
          <p class="text-sm" style="color:var(--fafa-neutral-700); line-height:1.5;">体重记录保存后偶尔闪退</p>
          <!-- Admin reply preview -->
          <div class="flex items-start gap-2 mt-2.5" style="padding:10px 12px; border-radius:8px; background-color:var(--fafa-primary-50);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--fafa-primary-500); flex-shrink:0; margin-top:2px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <p class="text-xs" style="color:var(--fafa-primary-700); line-height:1.45;">已修复，请更新到最新版本</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Submit button (fixed bottom) -->
  <div style="position:fixed; bottom:0; left:0; right:0; z-index:30; max-width:414px; margin:0 auto; padding:12px 16px 16px 16px; background-color:var(--fafa-card); border-top:1px solid var(--fafa-border);">
    <button data-dom-id="btn-submit" class="w-full cursor-pointer flex items-center justify-center" style="background-color:var(--fafa-primary-500); color:var(--fafa-primary-foreground); border-radius:9999px; padding:14px 24px; font-size:16px; font-weight:600; border:none; box-shadow:0 4px 12px rgba(196,97,47,0.25);">
      提交反馈
    </button>
  </div>

</body>
</html>
