<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaFa - 首页</title>
  <link rel="stylesheet" href="../.design_library/NoteGather/colors_and_type.css">
  <link rel="stylesheet" href="../.design_library/NoteGather/components.css">
  <style>
    body {
      background: var(--gradient-spring);
      width: 375px;
      margin: 0 auto;
      padding-bottom: 80px;
    }
    
    /* 顶部宠物选择器 - 毛玻璃效果 */
    .pet-selector {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--color-glass-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
    }
    
    .pet-selector img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--notegather-primary-500);
    }
    
    .pet-selector-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text-primary);
      flex: 1;
    }
    
    .pet-selector-arrow {
      color: var(--color-text-tertiary);
      font-size: 12px;
    }
    
    /* 页面内容 */
    .page-content {
      padding: 16px;
    }
    
    /* 宠物信息卡片 - 毛玻璃 + 3D阴影 */
    .pet-card {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--color-glass-border);
      border-radius: var(--radius-xl);
      padding: 20px;
      box-shadow: var(--shadow-3d);
      margin-bottom: 12px;
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .pet-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-3d), 0 8px 16px rgba(124, 179, 66, 0.2);
    }
    
    .pet-card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    
    .pet-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--notegather-primary-500);
      box-shadow: 0 4px 12px rgba(124, 179, 66, 0.3);
    }
    
    .pet-info h2 {
      font-size: 24px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 6px;
    }
    
    .pet-breed {
      font-size: 14px;
      color: var(--color-text-secondary);
      margin-bottom: 12px;
    }
    
    .pet-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    .stat-item {
      background: var(--color-surface-primary);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
      transition: all var(--duration-fast);
    }
    
    .stat-item:hover {
      transform: scale(1.05);
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--notegather-primary-500);
      margin-bottom: 4px;
    }
    
    .stat-label {
      font-size: 12px;
      color: var(--color-text-tertiary);
    }
    
    /* 通用卡片 - 毛玻璃效果 */
    .card {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--color-glass-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-2);
      transition: all var(--duration-normal) var(--ease-smooth);
    }
    
    .card:hover {
      box-shadow: var(--shadow-3);
    }
    
    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .title-icon {
      font-size: 20px;
    }
    
    /* 今日计划 */
    .plan-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--color-border-subtle);
      transition: all var(--duration-fast);
    }
    
    .plan-item:last-child {
      border-bottom: none;
    }
    
    .plan-item:hover {
      padding-left: 4px;
    }
    
    .plan-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--color-border-default);
      border-radius: 50%;
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .plan-checkbox.checked {
      background: var(--notegather-primary-500);
      border-color: var(--notegather-primary-500);
      position: relative;
    }
    
    .plan-checkbox.checked::after {
      content: '✓';
      color: var(--color-text-inverse);
      font-size: 12px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    .plan-content {
      flex: 1;
    }
    
    .plan-time {
      font-size: 14px;
      color: var(--notegather-primary-600);
      font-weight: 500;
      margin-bottom: 2px;
    }
    
    .plan-text {
      font-size: 14px;
      color: var(--color-text-primary);
    }
    
    /* 今日提醒 */
    .reminder-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--color-border-subtle);
      transition: all var(--duration-fast);
    }
    
    .reminder-item:last-child {
      border-bottom: none;
    }
    
    .reminder-item:hover {
      padding-left: 4px;
    }
    
    .reminder-icon {
      font-size: 20px;
    }
    
    .reminder-text {
      flex: 1;
      font-size: 14px;
      color: var(--color-text-primary);
    }
    
    /* 快速记录区 */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    
    .action-btn {
      background: var(--color-surface-primary);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .action-btn:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--notegather-primary-400);
    }
    
    .action-btn:active {
      transform: translateY(0);
    }
    
    .action-icon {
      font-size: 32px;
    }
    
    .action-label {
      font-size: 14px;
      color: var(--color-text-primary);
      font-weight: 500;
    }
    
    /* AI发现卡片 - 春花粉背景 + 虚线边框 */
    .ai-card {
      background: linear-gradient(135deg, var(--notegather-secondary-200) 0%, var(--color-surface-primary) 100%);
      border: 2px dashed var(--notegather-primary-400);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .ai-card:hover {
      border-color: var(--notegather-primary-500);
      transform: translateY(-2px);
      box-shadow: var(--shadow-3);
    }
    
    .ai-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .ai-icon {
      font-size: 20px;
    }
    
    .ai-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--notegather-primary-600);
    }
    
    .ai-content {
      font-size: 14px;
      color: var(--color-text-secondary);
      line-height: 1.5;
    }
    
    /* 最近回忆 */
    .memory-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-border-subtle);
      transition: all var(--duration-fast);
    }
    
    .memory-item:last-child {
      border-bottom: none;
    }
    
    .memory-item:hover {
      padding-left: 4px;
    }
    
    .memory-photo {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-md);
      object-fit: cover;
      box-shadow: var(--shadow-2);
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .memory-photo:hover {
      transform: scale(1.05);
    }
    
    .memory-content {
      flex: 1;
    }
    
    .memory-date {
      font-size: 12px;
      color: var(--color-text-tertiary);
      margin-bottom: 4px;
    }
    
    .memory-text {
      font-size: 14px;
      color: var(--color-text-primary);
      line-height: 1.4;
    }
    
    /* 浮动AI按钮 - 春日绿渐变 + 脉动动画 */
    .floating-ai-btn {
      position: fixed;
      right: 16px;
      bottom: 96px;
      width: 56px;
      height: 56px;
      background: var(--gradient-primary);
      border-radius: 50%;
      border: none;
      box-shadow: var(--shadow-3), 0 0 0 0 rgba(124, 179, 66, 0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--color-text-inverse);
      transition: all var(--duration-normal) var(--ease-bounce);
      animation: pulse-green 2s infinite;
      z-index: var(--z-sticky);
    }
    
    .floating-ai-btn:hover {
      transform: scale(1.1);
      box-shadow: var(--shadow-4), 0 0 0 8px rgba(124, 179, 66, 0.2);
    }
    
    .floating-ai-btn:active {
      transform: scale(0.95);
    }
    
    @keyframes pulse-green {
      0%, 100% {
        box-shadow: var(--shadow-3), 0 0 0 0 rgba(124, 179, 66, 0.7);
      }
      50% {
        box-shadow: var(--shadow-3), 0 0 0 12px rgba(124, 179, 66, 0);
      }
    }
  </style>
</head>
<body>
  <!-- 顶部宠物选择器 -->
  <div class="pet-selector">
    <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200&h=200&fit=crop" alt="豆包">
    <span class="pet-selector-name">豆包</span>
    <span class="pet-selector-arrow">▼</span>
  </div>
  
  <div class="page-content">
    <!-- 宠物信息卡片 -->
    <div class="pet-card">
      <div class="pet-card-header">
        <img class="pet-avatar" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300&h=300&fit=crop" alt="豆包">
        <div class="pet-info">
          <h2>豆包</h2>
          <div class="pet-breed">英短 · ♂ · 3岁2个月</div>
        </div>
      </div>
      <div class="pet-stats">
        <div class="stat-item">
          <div class="stat-value">5.2kg</div>
          <div class="stat-label">体重</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">1186天</div>
          <div class="stat-label">在一起</div>
        </div>
      </div>
    </div>
    
    <!-- 今日计划 -->
    <div class="card">
      <div class="card-title">
        <span class="title-icon">🍃</span>
        <span>今日计划</span>
      </div>
      <div class="plan-item">
        <div class="plan-checkbox checked"></div>
        <div class="plan-content">
          <div class="plan-time">08:00</div>
          <div class="plan-text">早餐 - 皇家猫粮 40g</div>
        </div>
      </div>
      <div class="plan-item">
        <div class="plan-checkbox"></div>
        <div class="plan-content">
          <div class="plan-time">12:00</div>
          <div class="plan-text">午餐 - 妙鲜包 1袋</div>
        </div>
      </div>
      <div class="plan-item">
        <div class="plan-checkbox"></div>
        <div class="plan-content">
          <div class="plan-time">19:00</div>
          <div class="plan-text">晚餐 - 皇家猫粮 40g</div>
        </div>
      </div>
    </div>
    
    <!-- 今日提醒 -->
    <div class="card">
      <div class="card-title">
        <span class="title-icon">🔔</span>
        <span>今日提醒</span>
      </div>
      <div class="reminder-item">
        <span class="reminder-icon">💊</span>
        <span class="reminder-text">下午3点记得给豆包喂驱虫药</span>
      </div>
      <div class="reminder-item">
        <span class="reminder-icon">⚖️</span>
        <span class="reminder-text">本周还没有记录体重哦</span>
      </div>
    </div>
    
    <!-- 快速记录区 -->
    <div class="card">
      <div class="card-title">
        <span class="title-icon">⚡</span>
        <span>快速记录</span>
      </div>
      <div class="quick-actions">
        <button class="action-btn">
          <span class="action-icon">🌱</span>
          <span class="action-label">喂食</span>
        </button>
        <button class="action-btn">
          <span class="action-icon">💧</span>
          <span class="action-label">饮水</span>
        </button>
        <button class="action-btn">
          <span class="action-icon">⚖️</span>
          <span class="action-label">体重</span>
        </button>
        <button class="action-btn">
          <span class="action-icon">🍂</span>
          <span class="action-label">排便</span>
        </button>
        <button class="action-btn">
          <span class="action-icon">🌸</span>
          <span class="action-label">照片</span>
        </button>
        <button class="action-btn">
          <span class="action-icon">🍃</span>
          <span class="action-label">事件</span>
        </button>
      </div>
    </div>
    
    <!-- AI发现卡片 -->
    <div class="ai-card">
      <div class="ai-card-header">
        <span class="ai-icon">🌿</span>
        <span class="ai-title">AI 发现</span>
      </div>
      <div class="ai-content">
        豆包最近食欲很好,体重稳定增长。建议继续保持现有的喂养计划,每周记录一次体重变化。
      </div>
    </div>
    
    <!-- 最近回忆 -->
    <div class="card">
      <div class="card-title">
        <span class="title-icon">🌸</span>
        <span>最近回忆</span>
      </div>
      <div class="memory-item">
        <img class="memory-photo" src="https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=200&h=200&fit=crop" alt="回忆">
        <div class="memory-content">
          <div class="memory-date">2天前</div>
          <div class="memory-text">豆包今天特别活泼,在客厅追逐了半小时的逗猫棒</div>
        </div>
      </div>
      <div class="memory-item">
        <img class="memory-photo" src="https://images.unsplash.com/photo-1529778873920-4da4926a72c2?w=200&h=200&fit=crop" alt="回忆">
        <div class="memory-content">
          <div class="memory-date">5天前</div>
          <div class="memory-text">第一次尝试新口味的罐头,吃得很香</div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 浮动AI按钮 -->
  <button class="floating-ai-btn">🌿</button>
</body>
</html>
