<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaFa - 喂食记录</title>
  <link rel="stylesheet" href="../../.design_library/NoteGather/colors_and_type.css">
  <link rel="stylesheet" href="../../.design_library/NoteGather/components.css">
  <style>
    body {
      background: var(--gradient-spring);
      width: 375px;
      margin: 0 auto;
      padding-bottom: 20px;
    }
    
    /* 顶部导航 - 毛玻璃 */
    .nav-bar {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--color-glass-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
    }
    
    .nav-back {
      font-size: 18px;
      color: var(--color-text-primary);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    
    .nav-back:hover {
      color: var(--notegather-primary-500);
    }
    
    .nav-title {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
    }
    
    .nav-add {
      width: 32px;
      height: 32px;
      background: var(--gradient-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-inverse);
      font-size: 20px;
      cursor: pointer;
      border: none;
      box-shadow: var(--shadow-2);
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .nav-add:hover {
      transform: scale(1.1);
      box-shadow: var(--shadow-3);
    }
    
    .nav-add:active {
      transform: scale(0.95);
    }
    
    /* 时间筛选tabs */
    .filter-tabs {
      background: var(--color-surface-primary);
      display: flex;
      padding: 8px 16px;
      gap: 8px;
      border-bottom: 1px solid var(--color-border-subtle);
    }
    
    .tab-item {
      padding: 6px 16px;
      border-radius: var(--radius-full);
      font-size: 14px;
      color: var(--color-text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .tab-item.active {
      background: var(--notegather-primary-500);
      color: var(--color-text-inverse);
      box-shadow: var(--shadow-2);
    }
    
    .tab-item:hover:not(.active) {
      background: var(--color-brand-primary-alpha);
      color: var(--notegather-primary-600);
    }
    
    /* 页面内容 */
    .page-content {
      padding: 16px;
    }
    
    /* AI分析卡片 - 森林渐变 */
    .ai-card {
      background: var(--gradient-forest);
      border: 2px dashed var(--notegather-primary-500);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 16px;
      transition: all var(--duration-normal) var(--ease-bounce);
      box-shadow: var(--shadow-2);
    }
    
    .ai-card:hover {
      border-style: solid;
      transform: translateY(-2px);
      box-shadow: var(--shadow-3);
    }
    
    .ai-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .ai-icon {
      font-size: 18px;
    }
    
    .ai-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--notegather-primary-700);
    }
    
    .ai-content {
      font-size: 14px;
      color: var(--color-text-secondary);
      line-height: 1.5;
    }
    
    /* 日期分组 */
    .date-group {
      margin-bottom: 20px;
    }
    
    .date-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--notegather-primary-600);
      padding: 8px 4px;
      position: sticky;
      top: 60px;
      background: var(--gradient-spring);
      z-index: 1;
    }
    
    /* 记录列表项 - 毛玻璃 */
    .record-list {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--color-glass-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-2);
    }
    
    .record-item {
      display: flex;
      align-items: center;
      padding: 16px;
      gap: 12px;
      border-bottom: 1px solid var(--color-border-subtle);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    
    .record-item:last-child {
      border-bottom: none;
    }
    
    .record-item:hover {
      background: var(--color-brand-primary-alpha);
      padding-left: 20px;
    }
    
    .record-time {
      font-size: 12px;
      color: var(--color-text-tertiary);
      min-width: 45px;
    }
    
    .record-content {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .record-food {
      font-size: 16px;
      color: var(--color-text-primary);
    }
    
    .record-amount {
      font-size: 16px;
      color: var(--notegather-primary-600);
      font-weight: 600;
      margin-left: auto;
    }
    
    .record-arrow {
      font-size: 14px;
      color: var(--color-border-default);
      transition: all var(--duration-fast);
    }
    
    .record-item:hover .record-arrow {
      color: var(--notegather-primary-500);
      transform: translateX(4px);
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="nav-bar">
    <span class="nav-back">←</span>
    <span class="nav-title">喂食记录</span>
    <button class="nav-add">+</button>
  </div>
  
  <!-- 时间筛选tabs -->
  <div class="filter-tabs">
    <button class="tab-item active">本周</button>
    <button class="tab-item">本月</button>
    <button class="tab-item">全部</button>
    <button class="tab-item">筛选</button>
  </div>
  
  <div class="page-content">
    <!-- AI分析卡片 -->
    <div class="ai-card">
      <div class="ai-card-header">
        <span class="ai-icon">🌿</span>
        <span class="ai-title">本周喂食分析</span>
      </div>
      <div class="ai-content">
        本周平均每日喂食 73g，比上周减少约 4%。豆包的食欲保持稳定，建议继续观察体重变化。
      </div>
    </div>
    
    <!-- 今天 -->
    <div class="date-group">
      <div class="date-header">今天</div>
      <div class="record-list">
        <div class="record-item">
          <span class="record-time">08:15</span>
          <div class="record-content">
            <span class="record-food">皇家猫粮</span>
            <span class="record-amount">40g</span>
            <span class="record-arrow">→</span>
          </div>
        </div>
        <div class="record-item">
          <span class="record-time">12:30</span>
          <div class="record-content">
            <span class="record-food">妙鲜包·金枪鱼味</span>
            <span class="record-amount">1袋</span>
            <span class="record-arrow">→</span>
          </div>
        </div>
        <div class="record-item">
          <span class="record-time">19:00</span>
          <div class="record-content">
            <span class="record-food">皇家猫粮</span>
            <span class="record-amount">40g</span>
            <span class="record-arrow">→</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 昨天 -->
    <div class="date-group">
      <div class="date-header">昨天</div>
      <div class="record-list">
        <div class="record-item">
          <span class="record-time">08:00</span>
          <div class="record-content">
            <span class="record-food">皇家猫粮</span>
            <span class="record-amount">40g</span>
            <span class="record-arrow">→</span>
          </div>
        </div>
        <div class="record-item">
          <span class="record-time">13:15</span>
          <div class="record-content">
            <span class="record-food">鸡胸肉条</span>
            <span class="record-amount">20g</span>
            <span class="record-arrow">→</span>
          </div>
        </div>
        <div class="record-item">
          <span class="record-time">18:45</span>
          <div class="record-content">
            <span class="record-food">皇家猫粮</span>
            <span class="record-amount">45g</span>
            <span class="record-arrow">→</span>
          </div>
        </div>
        <div class="record-item">
          <span class="record-time">21:30</span>
          <div class="record-content">
            <span class="record-food">冻干零食</span>
            <span class="record-amount">5g</span>
            <span class="record-arrow">→</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 8月16日 -->
    <div class="date-group">
      <div class="date-header">8月16日 周五</div>
      <div class="record-list">
        <div class="record-item">
          <span class="record-time">08:20</span>
          <div class="record-content">
            <span class="record-food">皇家猫粮</span>
            <span class="record-amount">38g</span>
            <span class="record-arrow">→</span>
          </div>
        </div>
        <div class="record-item">
          <span class="record-time">12:00</span>
          <div class="record-content">
            <span class="record-food">妙鲜包·三文鱼味</span>
            <span class="record-amount">1袋</span>
            <span class="record-arrow">→</span>
          </div>
        </div>
        <div class="record-item">
          <span class="record-time">19:15</span>
          <div class="record-content">
            <span class="record-food">皇家猫粮</span>
            <span class="record-amount">42g</span>
            <span class="record-arrow">→</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
