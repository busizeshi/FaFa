<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaFa - 体重记录</title>
  <link rel="stylesheet" href="../../.design_library/NoteGather/colors_and_type.css">
  <link rel="stylesheet" href="../../.design_library/NoteGather/components.css">
  <style>
    body {
      background: var(--gradient-spring);
      width: 375px;
      margin: 0 auto;
      padding-bottom: 20px;
    }
    
    /* 顶部导航 - 毛玻璃 */
    .nav-bar {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--color-glass-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
    }
    
    .nav-back {
      font-size: 18px;
      color: var(--color-text-primary);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    
    .nav-back:hover {
      color: var(--notegather-primary-500);
    }
    
    .nav-title {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
    }
    
    .nav-add {
      width: 32px;
      height: 32px;
      background: var(--gradient-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-inverse);
      font-size: 20px;
      cursor: pointer;
      border: none;
      box-shadow: var(--shadow-2);
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .nav-add:hover {
      transform: scale(1.1);
      box-shadow: var(--shadow-3);
    }
    
    /* 页面内容 */
    .page-content {
      padding: 16px;
    }
    
    /* 当前体重卡片 - 3D阴影 */
    .current-weight-card {
      background: var(--gradient-card);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-3d);
      text-align: center;
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .current-weight-card:hover {
      transform: translateY(-4px) rotateX(2deg);
      box-shadow: var(--shadow-3d), 0 12px 24px rgba(124, 179, 66, 0.25);
    }
    
    .weight-label {
      font-size: 14px;
      color: var(--color-text-secondary);
      margin-bottom: 8px;
    }
    
    .weight-value {
      font-size: 48px;
      font-weight: 600;
      color: var(--notegather-primary-500);
      margin-bottom: 4px;
    }
    
    .weight-unit {
      font-size: 24px;
      color: var(--color-text-secondary);
    }
    
    .weight-change {
      font-size: 14px;
      color: var(--notegather-primary-600);
      margin-top: 8px;
    }
    
    /* 图表卡片 - 毛玻璃 */
    .chart-card {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--color-glass-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-2);
    }
    
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    
    .chart-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-primary);
    }
    
    .chart-range {
      display: flex;
      gap: 8px;
    }
    
    .range-btn {
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      color: var(--color-text-secondary);
      background: transparent;
      border: 1px solid var(--color-border-default);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .range-btn.active {
      background: var(--notegather-primary-500);
      color: var(--color-text-inverse);
      border-color: var(--notegather-primary-500);
    }
    
    .range-btn:hover:not(.active) {
      border-color: var(--notegather-primary-400);
      color: var(--notegather-primary-600);
    }
    
    #weightChart {
      width: 100%;
      height: 200px;
      border-radius: var(--radius-md);
    }
    
    /* AI分析按钮 - pill样式 */
    .ai-analysis-btn {
      background: var(--gradient-primary);
      border: none;
      border-radius: var(--radius-full);
      padding: 12px 20px;
      width: 100%;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-inverse);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-2);
      transition: all var(--duration-normal) var(--ease-bounce);
      margin-bottom: 16px;
    }
    
    .ai-analysis-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-3);
    }
    
    .ai-analysis-btn:active {
      transform: translateY(0);
    }
    
    /* 历史记录列表 */
    .history-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 12px;
      padding-left: 4px;
    }
    
    .history-list {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--color-glass-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-2);
    }
    
    .history-item {
      display: flex;
      align-items: center;
      padding: 16px;
      gap: 12px;
      border-bottom: 1px solid var(--color-border-subtle);
      transition: all var(--duration-fast);
    }
    
    .history-item:last-child {
      border-bottom: none;
    }
    
    .history-item:hover {
      background: var(--color-brand-primary-alpha);
      padding-left: 20px;
    }
    
    .history-date {
      flex: 1;
    }
    
    .history-date-main {
      font-size: 14px;
      color: var(--color-text-primary);
      margin-bottom: 2px;
    }
    
    .history-date-sub {
      font-size: 12px;
      color: var(--color-text-tertiary);
    }
    
    .history-weight {
      font-size: 20px;
      font-weight: 600;
      color: var(--notegather-primary-600);
    }
    
    .history-change {
      min-width: 60px;
      text-align: right;
      font-size: 14px;
    }
    
    .change-up {
      color: var(--notegather-accent-red);
    }
    
    .change-down {
      color: var(--notegather-primary-600);
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="nav-bar">
    <span class="nav-back">←</span>
    <span class="nav-title">体重记录</span>
    <button class="nav-add">+</button>
  </div>
  
  <div class="page-content">
    <!-- 当前体重 -->
    <div class="current-weight-card">
      <div class="weight-label">当前体重</div>
      <div>
        <span class="weight-value">5.2</span>
        <span class="weight-unit">kg</span>
      </div>
      <div class="weight-change">较上次 +0.1kg ↑</div>
    </div>
    
    <!-- 体重趋势图 -->
    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">体重趋势</span>
        <div class="chart-range">
          <button class="range-btn">周</button>
          <button class="range-btn active">月</button>
          <button class="range-btn">年</button>
        </div>
      </div>
      <canvas id="weightChart"></canvas>
    </div>
    
    <!-- AI分析按钮 -->
    <button class="ai-analysis-btn">
      <span>🌿</span>
      <span>查看 AI 体重分析</span>
    </button>
    
    <!-- 历史记录 -->
    <div class="history-title">历史记录</div>
    <div class="history-list">
      <div class="history-item">
        <div class="history-date">
          <div class="history-date-main">8月18日</div>
          <div class="history-date-sub">今天 09:30</div>
        </div>
        <div class="history-weight">5.2kg</div>
        <div class="history-change change-up">+0.1kg</div>
      </div>
      <div class="history-item">
        <div class="history-date">
          <div class="history-date-main">8月11日</div>
          <div class="history-date-sub">上周日</div>
        </div>
        <div class="history-weight">5.1kg</div>
        <div class="history-change change-down">-0.05kg</div>
      </div>
      <div class="history-item">
        <div class="history-date">
          <div class="history-date-main">8月4日</div>
          <div class="history-date-sub">两周前</div>
        </div>
        <div class="history-weight">5.15kg</div>
        <div class="history-change change-up">+0.08kg</div>
      </div>
      <div class="history-item">
        <div class="history-date">
          <div class="history-date-main">7月28日</div>
          <div class="history-date-sub">三周前</div>
        </div>
        <div class="history-weight">5.07kg</div>
        <div class="history-change change-up">+0.12kg</div>
      </div>
      <div class="history-item">
        <div class="history-date">
          <div class="history-date-main">7月21日</div>
          <div class="history-date-sub">四周前</div>
        </div>
        <div class="history-weight">4.95kg</div>
        <div class="history-change">--</div>
      </div>
    </div>
  </div>
  
  <script>
    // 体重趋势图 - 春日绿配色
    const canvas = document.getElementById('weightChart');
    const ctx = canvas.getContext('2d');
    
    // 设置Canvas实际尺寸
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    
    // 数据
    const data = [4.95, 5.07, 5.15, 5.1, 5.2];
    const labels = ['7/21', '7/28', '8/4', '8/11', '8/18'];
    
    // 计算坐标
    const padding = 40;
    const chartWidth = rect.width - padding * 2;
    const chartHeight = rect.height - padding * 2;
    const maxValue = Math.max(...data) + 0.1;
    const minValue = Math.min(...data) - 0.1;
    const valueRange = maxValue - minValue;
    
    const points = data.map((value, index) => ({
      x: padding + (chartWidth / (data.length - 1)) * index,
      y: padding + chartHeight - ((value - minValue) / valueRange) * chartHeight
    }));
    
    // 绘制渐变填充区域 - 春日绿
    const gradient = ctx.createLinearGradient(0, padding, 0, rect.height - padding);
    gradient.addColorStop(0, 'rgba(124, 179, 66, 0.3)');
    gradient.addColorStop(1, 'rgba(124, 179, 66, 0.05)');
    
    ctx.beginPath();
    ctx.moveTo(points[0].x, rect.height - padding);
    points.forEach((point, index) => {
      if (index === 0) {
        ctx.lineTo(point.x, point.y);
      } else {
        ctx.lineTo(point.x, point.y);
      }
    });
    ctx.lineTo(points[points.length - 1].x, rect.height - padding);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();
    
    // 绘制折线 - 春日绿
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    points.forEach((point, index) => {
      if (index > 0) {
        ctx.lineTo(point.x, point.y);
      }
    });
    ctx.strokeStyle = '#7CB342';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
    
    // 绘制数据点 - 樱花粉
    points.forEach((point, index) => {
      // 外圈光晕
      ctx.beginPath();
      ctx.arc(point.x, point.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(124, 179, 66, 0.2)';
      ctx.fill();
      
      // 内圈数据点
      ctx.beginPath();
      ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#FFCDD2';
      ctx.fill();
      ctx.strokeStyle = '#7CB342';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
    
    // 绘制X轴标签
    ctx.fillStyle = '#8E918F';
    ctx.font = '12px Inter, sans-serif';
    ctx.textAlign = 'center';
    labels.forEach((label, index) => {
      ctx.fillText(label, points[index].x, rect.height - 15);
    });
    
    // 绘制Y轴数值
    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      const value = minValue + (valueRange / 4) * i;
      const y = rect.height - padding - (chartHeight / 4) * i;
      ctx.fillText(value.toFixed(2) + 'kg', padding - 10, y + 4);
    }
  </script>
</body>
</html>
