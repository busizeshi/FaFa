<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaFa - 记录</title>
  <link rel="stylesheet" href="../.design_library/NoteGather/colors_and_type.css">
  <link rel="stylesheet" href="../.design_library/NoteGather/components.css">
  <style>
    body {
      background: var(--gradient-spring);
      width: 375px;
      margin: 0 auto;
      padding-bottom: 20px;
    }
    
    /* 顶部导航 - 毛玻璃 */
    .nav-bar {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--color-glass-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
    }
    
    .nav-back {
      font-size: 18px;
      color: var(--color-text-primary);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    
    .nav-back:hover {
      color: var(--notegather-primary-500);
    }
    
    .nav-title {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
    }
    
    .pet-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    
    .pet-selector:hover {
      opacity: 0.8;
    }
    
    .pet-selector img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--notegather-primary-500);
    }
    
    .pet-selector-name {
      font-size: 14px;
      color: var(--color-text-primary);
    }
    
    .pet-selector-arrow {
      font-size: 10px;
      color: var(--color-text-tertiary);
    }
    
    /* 页面内容 */
    .page-content {
      padding: 16px;
    }
    
    /* 本周数据概览 - 3D阴影 */
    .stats-overview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      background: var(--gradient-card);
      border-radius: var(--radius-lg);
      padding: 16px 12px;
      text-align: center;
      box-shadow: var(--shadow-3d);
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .stat-card:hover {
      transform: translateY(-6px) rotateX(2deg);
      box-shadow: var(--shadow-3d), 0 10px 20px rgba(124, 179, 66, 0.2);
    }
    
    .stat-number {
      font-size: 28px;
      font-weight: 600;
      color: var(--notegather-primary-500);
      margin-bottom: 4px;
    }
    
    .stat-unit {
      font-size: 14px;
      color: var(--color-text-secondary);
    }
    
    .stat-label {
      font-size: 12px;
      color: var(--color-text-tertiary);
      margin-top: 4px;
    }
    
    /* 分组标题 */
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 12px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .section-icon {
      font-size: 20px;
    }
    
    /* 记录类型入口网格 */
    .record-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    
    .record-item {
      background: var(--color-surface-primary);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px 16px;
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-bounce);
      box-shadow: var(--shadow-2);
      display: flex;
      flex-direction: column;
      height: 100px;
    }
    
    .record-item:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--notegather-primary-400);
    }
    
    .record-item:active {
      transform: translateY(0);
    }
    
    .record-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: auto;
    }
    
    .record-icon {
      font-size: 32px;
    }
    
    .record-arrow {
      font-size: 16px;
      color: var(--color-border-default);
      transition: all var(--duration-fast);
    }
    
    .record-item:hover .record-arrow {
      color: var(--notegather-primary-500);
      transform: translateX(4px);
    }
    
    .record-label {
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 4px;
    }
    
    .record-count {
      font-size: 14px;
      color: var(--color-text-secondary);
    }
    
    .record-count-number {
      color: var(--notegather-primary-600);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="nav-bar">
    <span class="nav-back">←</span>
    <span class="nav-title">记录</span>
    <div class="pet-selector">
      <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200&h=200&fit=crop" alt="豆包">
      <span class="pet-selector-name">豆包</span>
      <span class="pet-selector-arrow">▼</span>
    </div>
  </div>
  
  <div class="page-content">
    <!-- 本周数据概览 -->
    <div class="stats-overview">
      <div class="stat-card">
        <div class="stat-number">28</div>
        <div class="stat-unit">次</div>
        <div class="stat-label">本周喂食</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">5</div>
        <div class="stat-unit">次</div>
        <div class="stat-label">本周体重</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">7</div>
        <div class="stat-unit">条</div>
        <div class="stat-label">本周事件</div>
      </div>
    </div>
    
    <!-- 记录类型入口 -->
    <div class="section-title">
      <span class="section-icon">🍃</span>
      <span>所有记录</span>
    </div>
    <div class="record-grid">
      <div class="record-item">
        <div class="record-header">
          <span class="record-icon">🌱</span>
          <span class="record-arrow">→</span>
        </div>
        <div class="record-label">喂食记录</div>
        <div class="record-count">共 <span class="record-count-number">92</span> 条</div>
      </div>
      
      <div class="record-item">
        <div class="record-header">
          <span class="record-icon">⚖️</span>
          <span class="record-arrow">→</span>
        </div>
        <div class="record-label">体重记录</div>
        <div class="record-count">共 <span class="record-count-number">12</span> 条</div>
      </div>
      
      <div class="record-item">
        <div class="record-header">
          <span class="record-icon">💧</span>
          <span class="record-arrow">→</span>
        </div>
        <div class="record-label">饮水记录</div>
        <div class="record-count">共 <span class="record-count-number">45</span> 条</div>
      </div>
      
      <div class="record-item">
        <div class="record-header">
          <span class="record-icon">🍂</span>
          <span class="record-arrow">→</span>
        </div>
        <div class="record-label">排便记录</div>
        <div class="record-count">共 <span class="record-count-number">38</span> 条</div>
      </div>
      
      <div class="record-item">
        <div class="record-header">
          <span class="record-icon">🍃</span>
          <span class="record-arrow">→</span>
        </div>
        <div class="record-label">事件记录</div>
        <div class="record-count">共 <span class="record-count-number">23</span> 条</div>
      </div>
      
      <div class="record-item">
        <div class="record-header">
          <span class="record-icon">🌸</span>
          <span class="record-arrow">→</span>
        </div>
        <div class="record-label">照片回忆</div>
        <div class="record-count">共 <span class="record-count-number">156</span> 张</div>
      </div>
    </div>
  </div>
</body>
</html>
