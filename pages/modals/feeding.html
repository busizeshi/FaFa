<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaFa - 喂食记录</title>
  <link rel="stylesheet" href="../../.design_library/NoteGather/colors_and_type.css">
  <link rel="stylesheet" href="../../.design_library/NoteGather/components.css">
  <style>
    body {
      background: var(--gradient-spring);
      width: 375px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    /* 模糊背景蒙层 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: var(--z-modal);
      animation: fadeIn var(--duration-normal) var(--ease-smooth);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    /* 弹窗主体 - 毛玻璃 */
    .modal {
      position: relative;
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--color-glass-border);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 340px;
      box-shadow: var(--shadow-4);
      z-index: calc(var(--z-modal) + 1);
      animation: modalSlideIn var(--duration-slow) var(--ease-bounce);
    }
    
    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    /* 弹窗头部 */
    .modal-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .title-icon {
      font-size: 20px;
    }
    
    .modal-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--color-surface-secondary);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    
    .modal-close:hover {
      background: var(--color-surface-tertiary);
      color: var(--color-text-primary);
    }
    
    /* 弹窗内容 */
    .modal-body {
      padding: 20px;
    }
    
    /* 表单项 */
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 8px;
      display: block;
    }
    
    .required {
      color: var(--notegather-accent-red);
      margin-left: 2px;
    }
    
    /* 输入框 - 焦点态春日绿 */
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--color-text-primary);
      background: var(--color-surface-primary);
      transition: all var(--duration-normal) var(--ease-smooth);
      box-sizing: border-box;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--notegather-primary-500);
      box-shadow: 0 0 0 3px rgba(124, 179, 66, 0.1);
    }
    
    /* 时间选择器 */
    .time-picker {
      display: flex;
      gap: 8px;
    }
    
    .time-input {
      flex: 1;
    }
    
    /* 快捷按钮组 */
    .quick-buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    
    .quick-btn {
      padding: 6px 12px;
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-full);
      font-size: 12px;
      color: var(--color-text-secondary);
      background: var(--color-surface-primary);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .quick-btn:hover {
      border-color: var(--notegather-primary-400);
      color: var(--notegather-primary-600);
      background: var(--color-brand-primary-alpha);
    }
    
    .quick-btn.active {
      border-color: var(--notegather-primary-500);
      background: var(--notegather-primary-500);
      color: var(--color-text-inverse);
    }
    
    /* 弹窗底部 */
    .modal-footer {
      padding: 16px 20px 20px;
      display: flex;
      gap: 12px;
    }
    
    .btn {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-full);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-bounce);
      border: none;
    }
    
    .btn-cancel {
      background: var(--color-surface-secondary);
      color: var(--color-text-primary);
    }
    
    .btn-cancel:hover {
      background: var(--color-surface-tertiary);
    }
    
    .btn-submit {
      background: var(--gradient-primary);
      color: var(--color-text-inverse);
      box-shadow: var(--shadow-2);
    }
    
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-3);
    }
    
    .btn-submit:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <!-- 背景蒙层 -->
  <div class="modal-overlay"></div>
  
  <!-- 弹窗主体 -->
  <div class="modal">
    <!-- 头部 -->
    <div class="modal-header">
      <div class="modal-title">
        <span class="title-icon">🌱</span>
        <span>记录喂食</span>
      </div>
      <button class="modal-close">×</button>
    </div>
    
    <!-- 内容 -->
    <div class="modal-body">
      <form>
        <!-- 食物名称 -->
        <div class="form-group">
          <label class="form-label">
            食物名称
            <span class="required">*</span>
          </label>
          <input type="text" class="form-input" placeholder="例如：皇家猫粮" value="">
          <div class="quick-buttons">
            <button type="button" class="quick-btn">皇家猫粮</button>
            <button type="button" class="quick-btn">妙鲜包</button>
            <button type="button" class="quick-btn">鸡胸肉</button>
          </div>
        </div>
        
        <!-- 食用量 -->
        <div class="form-group">
          <label class="form-label">
            食用量
            <span class="required">*</span>
          </label>
          <input type="text" class="form-input" placeholder="例如：40g 或 1袋" value="">
          <div class="quick-buttons">
            <button type="button" class="quick-btn">30g</button>
            <button type="button" class="quick-btn">40g</button>
            <button type="button" class="quick-btn">50g</button>
            <button type="button" class="quick-btn">1袋</button>
          </div>
        </div>
        
        <!-- 时间 -->
        <div class="form-group">
          <label class="form-label">时间</label>
          <div class="time-picker">
            <input type="date" class="form-input time-input" value="2026-08-18">
            <input type="time" class="form-input time-input" value="08:15">
          </div>
        </div>
        
        <!-- 备注 -->
        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea class="form-input" rows="2" placeholder="记录一些特别的信息..." style="resize: vertical;"></textarea>
        </div>
      </form>
    </div>
    
    <!-- 底部 -->
    <div class="modal-footer">
      <button class="btn btn-cancel">取消</button>
      <button class="btn btn-submit">保存</button>
    </div>
  </div>
</body>
</html>
