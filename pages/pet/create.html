<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaFa - 新建宠物</title>
  <link rel="stylesheet" href="../.design_library/NoteGather/colors_and_type.css">
  <link rel="stylesheet" href="../.design_library/NoteGather/components.css">
  <style>
    body {
      background: var(--gradient-spring);
      width: 375px;
      margin: 0 auto;
      padding-bottom: 20px;
    }
    
    /* 顶部导航 - 毛玻璃 */
    .nav-bar {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--color-glass-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
    }
    
    .nav-back {
      font-size: 18px;
      color: var(--color-text-primary);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    
    .nav-back:hover {
      color: var(--notegather-primary-500);
    }
    
    .nav-title {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
    }
    
    /* 页面内容 */
    .page-content {
      padding: 16px;
    }
    
    /* 表单卡片 - 毛玻璃 */
    .form-card {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--color-glass-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-2);
    }
    
    /* 头像上传 */
    .avatar-upload {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .avatar-preview {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--color-surface-secondary);
      border: 3px dashed var(--notegather-primary-400);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .avatar-preview:hover {
      border-color: var(--notegather-primary-500);
      border-style: solid;
      transform: scale(1.05);
    }
    
    .avatar-icon {
      font-size: 40px;
    }
    
    .avatar-text {
      font-size: 14px;
      color: var(--color-text-tertiary);
    }
    
    /* 表单项 */
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 8px;
      display: block;
    }
    
    .required {
      color: var(--notegather-accent-red);
      margin-left: 2px;
    }
    
    /* 输入框 - 焦点态春日绿 */
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--color-text-primary);
      background: var(--color-surface-primary);
      transition: all var(--duration-normal) var(--ease-smooth);
      box-sizing: border-box;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--notegather-primary-500);
      box-shadow: 0 0 0 3px rgba(124, 179, 66, 0.1);
    }
    
    .form-input::placeholder {
      color: var(--color-text-placeholder);
    }
    
    /* 单选按钮组 */
    .radio-group {
      display: flex;
      gap: 12px;
    }
    
    .radio-item {
      flex: 1;
      position: relative;
    }
    
    .radio-item input[type="radio"] {
      position: absolute;
      opacity: 0;
    }
    
    .radio-label {
      display: block;
      padding: 12px;
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 14px;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-bounce);
      background: var(--color-surface-primary);
    }
    
    .radio-item input[type="radio"]:checked + .radio-label {
      border-color: var(--notegather-primary-500);
      background: var(--notegather-primary-500);
      color: var(--color-text-inverse);
      box-shadow: var(--shadow-2);
    }
    
    .radio-label:hover {
      border-color: var(--notegather-primary-400);
    }
    
    /* 日期输入 */
    .form-input[type="date"] {
      color-scheme: light;
    }
    
    /* 提示文本 */
    .form-help {
      font-size: 12px;
      color: var(--color-text-tertiary);
      margin-top: 6px;
    }
    
    /* 保存按钮 - 春日绿渐变 */
    .save-btn {
      width: 100%;
      padding: 14px;
      background: var(--gradient-primary);
      border: none;
      border-radius: var(--radius-full);
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text-inverse);
      cursor: pointer;
      box-shadow: var(--shadow-2);
      transition: all var(--duration-normal) var(--ease-bounce);
      margin-top: 8px;
    }
    
    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-3);
    }
    
    .save-btn:active {
      transform: translateY(0);
    }
    
    /* 温馨提示卡片 */
    .tip-card {
      background: linear-gradient(135deg, var(--notegather-secondary-200) 0%, var(--color-surface-primary) 100%);
      border: 1px solid var(--notegather-primary-300);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .tip-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .tip-icon {
      font-size: 18px;
    }
    
    .tip-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--notegather-primary-700);
    }
    
    .tip-content {
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="nav-bar">
    <span class="nav-back">←</span>
    <span class="nav-title">新建宠物</span>
  </div>
  
  <div class="page-content">
    <!-- 温馨提示 -->
    <div class="tip-card">
      <div class="tip-header">
        <span class="tip-icon">🌿</span>
        <span class="tip-title">温馨提示</span>
      </div>
      <div class="tip-content">
        完善宠物信息后，AI助手将为您提供更精准的健康建议和喂养计划。
      </div>
    </div>
    
    <!-- 表单卡片 -->
    <div class="form-card">
      <form>
        <!-- 头像上传 -->
        <div class="avatar-upload">
          <div class="avatar-preview">
            <span class="avatar-icon">📷</span>
          </div>
          <div class="avatar-text">上传宠物照片</div>
        </div>
        
        <!-- 宠物名称 -->
        <div class="form-group">
          <label class="form-label">
            宠物名称
            <span class="required">*</span>
          </label>
          <input type="text" class="form-input" placeholder="给宝贝起个名字吧" value="豆包">
        </div>
        
        <!-- 宠物品种 -->
        <div class="form-group">
          <label class="form-label">
            品种
            <span class="required">*</span>
          </label>
          <input type="text" class="form-input" placeholder="例如：英国短毛猫" value="英国短毛猫">
        </div>
        
        <!-- 性别 -->
        <div class="form-group">
          <label class="form-label">
            性别
            <span class="required">*</span>
          </label>
          <div class="radio-group">
            <div class="radio-item">
              <input type="radio" name="gender" id="male" checked>
              <label class="radio-label" for="male">♂ 公</label>
            </div>
            <div class="radio-item">
              <input type="radio" name="gender" id="female">
              <label class="radio-label" for="female">♀ 母</label>
            </div>
          </div>
        </div>
        
        <!-- 生日 -->
        <div class="form-group">
          <label class="form-label">
            生日
            <span class="required">*</span>
          </label>
          <input type="date" class="form-input" value="2023-06-15">
          <div class="form-help">系统将根据生日自动计算年龄</div>
        </div>
        
        <!-- 体重 -->
        <div class="form-group">
          <label class="form-label">当前体重</label>
          <input type="number" class="form-input" placeholder="例如：5.2" step="0.1" value="5.2">
          <div class="form-help">单位：千克（kg）</div>
        </div>
        
        <!-- 领养日期 -->
        <div class="form-group">
          <label class="form-label">领养日期</label>
          <input type="date" class="form-input" value="2023-07-01">
          <div class="form-help">记录你们在一起的日子</div>
        </div>
        
        <!-- 芯片号 -->
        <div class="form-group">
          <label class="form-label">芯片号</label>
          <input type="text" class="form-input" placeholder="如已植入芯片，请输入芯片号">
        </div>
        
        <!-- 备注 -->
        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea class="form-input" rows="3" placeholder="记录一些特别的信息，如过敏史、饮食偏好等" style="resize: vertical;"></textarea>
        </div>
        
        <!-- 保存按钮 -->
        <button type="submit" class="save-btn">保存</button>
      </form>
    </div>
  </div>
</body>
</html>
