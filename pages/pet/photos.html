<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaFa - 照片相册</title>
  <link rel="stylesheet" href="../.design_library/NoteGather/colors_and_type.css">
  <link rel="stylesheet" href="../.design_library/NoteGather/components.css">
  <style>
    body {
      background: var(--gradient-spring);
      width: 375px;
      margin: 0 auto;
      padding-bottom: 20px;
    }
    
    /* 顶部导航 - 毛玻璃 */
    .nav-bar {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--color-glass-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
    }
    
    .nav-back {
      font-size: 18px;
      color: var(--color-text-primary);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    
    .nav-back:hover {
      color: var(--notegather-primary-500);
    }
    
    .nav-title {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
    }
    
    .nav-add {
      width: 32px;
      height: 32px;
      background: var(--gradient-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-inverse);
      font-size: 20px;
      cursor: pointer;
      border: none;
      box-shadow: var(--shadow-2);
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .nav-add:hover {
      transform: scale(1.1);
      box-shadow: var(--shadow-3);
    }
    
    /* 页面内容 */
    .page-content {
      padding: 16px;
    }
    
    /* 统计卡片 - 3D阴影 */
    .stats-card {
      background: var(--gradient-card);
      border-radius: var(--radius-xl);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-3d);
      display: flex;
      justify-content: space-around;
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .stats-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-3d), 0 12px 24px rgba(124, 179, 66, 0.25);
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-value {
      font-size: 28px;
      font-weight: 600;
      color: var(--notegather-primary-500);
      margin-bottom: 4px;
    }
    
    .stat-label {
      font-size: 12px;
      color: var(--color-text-tertiary);
    }
    
    /* 时间轴标题 */
    .timeline-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--notegather-primary-600);
      padding: 12px 4px;
      position: sticky;
      top: 60px;
      background: var(--gradient-spring);
      z-index: 1;
    }
    
    /* 照片网格 */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .photo-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow-3d);
      transition: all var(--duration-normal) var(--ease-bounce);
    }
    
    .photo-item:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-3d), 0 8px 16px rgba(124, 179, 66, 0.3);
      z-index: 2;
    }
    
    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .photo-date {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.6), transparent);
      color: white;
      font-size: 10px;
      padding: 8px 6px 4px;
      opacity: 0;
      transition: opacity var(--duration-fast);
    }
    
    .photo-item:hover .photo-date {
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->

</html>
