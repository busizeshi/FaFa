<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" font-family="'STXinwei','华文新魏','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="mHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FC79B"/>
      <stop offset="0.6" stop-color="#58B8E8"/>
      <stop offset="1" stop-color="#9C8CE8"/>
    </linearGradient>
    <g id="paw3">
      <ellipse cx="0" cy="4" rx="7.5" ry="6"/>
      <ellipse cx="-8.5" cy="-4.5" rx="3.4" ry="4.4" transform="rotate(-24 -8.5 -4.5)"/>
      <ellipse cx="-2.6" cy="-8" rx="3.4" ry="4.6" transform="rotate(-8 -2.6 -8)"/>
      <ellipse cx="3.6" cy="-8" rx="3.4" ry="4.6" transform="rotate(8 3.6 -8)"/>
      <ellipse cx="9.2" cy="-4.5" rx="3.4" ry="4.4" transform="rotate(24 9.2 -4.5)"/>
    </g>
    <!-- 简易照片占位：渐变 + 猫剪影 -->
    <g id="photo">
      <rect width="100" height="120" rx="16"/>
      <circle cx="50" cy="58" r="22"/>
      <path d="M32 46 l6 -14 10 9 M68 46 l-6 -14 -10 9"/>
      <ellipse cx="50" cy="92" rx="24" ry="14"/>
    </g>
    <!-- 照片占位渐变（拍立得底色） -->
    <linearGradient id="pA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD9A8"/><stop offset="1" stop-color="#FFC489"/></linearGradient>
    <linearGradient id="pB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9EBDD"/><stop offset="1" stop-color="#A9DFC7"/></linearGradient>
    <linearGradient id="pC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6C6D3"/><stop offset="1" stop-color="#F2AFC5"/></linearGradient>
    <linearGradient id="pD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BFE3F5"/><stop offset="1" stop-color="#A2D5F0"/></linearGradient>
    <linearGradient id="pE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE3B3"/><stop offset="1" stop-color="#FFD58E"/></linearGradient>
    <linearGradient id="pF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D7D2F2"/><stop offset="1" stop-color="#C4BCEC"/></linearGradient>
    <linearGradient id="pG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC9D6"/><stop offset="1" stop-color="#FFAFBF"/></linearGradient>
    <linearGradient id="pH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CDEEDD"/><stop offset="1" stop-color="#AEE5C8"/></linearGradient>
    <linearGradient id="pI" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5E3C0"/><stop offset="1" stop-color="#EED4A2"/></linearGradient>
  </defs>

  <rect width="375" height="812" fill="#F2FAF6"/>

  <!-- 状态栏 -->
  <text x="24" y="24" font-size="13" font-weight="600" fill="#22423A">9:41</text>
  <g fill="#22423A">
    <rect x="316" y="14" width="20" height="10" rx="3" opacity="0.9"/>
    <rect x="292" y="15" width="16" height="8" rx="2.5" opacity="0.7"/>
  </g>

  <!-- 标题 -->
  <text x="24" y="64" font-size="20" font-weight="700" fill="#22423A">素材库</text>
  <text x="24" y="82" font-size="11" fill="#8FA8A0">128 张照片 · 12 段视频 · 已用 1.2GB / 2GB</text>

  <!-- ===== 语义搜索条（天空蓝） ===== -->
  <g>
    <rect x="20" y="96" width="335" height="44" rx="22" fill="#FFFFFF" stroke="#D5ECF8"/>
    <circle cx="44" cy="118" r="9" fill="none" stroke="#58B8E8" stroke-width="2"/>
    <path d="M51 125 l5 5" stroke="#58B8E8" stroke-width="2" stroke-linecap="round"/>
    <text x="62" y="115" font-size="11.5" fill="#8FA8A0">搜"年糕在窗台晒太阳"…</text>
    <text x="62" y="131" font-size="9.5" fill="#58B8E8">✨ AI 语义搜索 · 本月剩余 8 次</text>
    <rect x="296" y="104" width="50" height="28" rx="14" fill="url(#mHero)"/>
    <text x="321" y="122" font-size="10.5" font-weight="600" fill="#fff" text-anchor="middle">搜索</text>
  </g>

  <!-- ===== 宠物筛选 chips ===== -->
  <g font-size="11">
    <rect x="20" y="152" width="56" height="28" rx="14" fill="url(#mHero)"/>
    <text x="48" y="170" font-weight="600" fill="#fff" text-anchor="middle">全部</text>
    <rect x="82" y="152" width="66" height="28" rx="14" fill="#FFFFFF" stroke="#DCEDE5"/>
    <circle cx="98" cy="166" r="7" fill="#F5B971"/>
    <text x="110" y="170" fill="#5C7A70">年糕</text>
    <rect x="154" y="152" width="66" height="28" rx="14" fill="#FFFFFF" stroke="#DCEDE5"/>
    <circle cx="170" cy="166" r="7" fill="#8FB8E8"/>
    <text x="182" y="170" fill="#5C7A70">豆豆</text>
    <rect x="226" y="152" width="76" height="28" rx="14" fill="#FFFFFF" stroke="#DCEDE5"/>
    <text x="264" y="170" fill="#5C7A70" text-anchor="middle"># 玩耍</text>
    <rect x="308" y="152" width="47" height="28" rx="14" fill="#FFFFFF" stroke="#DCEDE5"/>
    <text x="331" y="170" fill="#5C7A70" text-anchor="middle"># 憨</text>
  </g>

  <!-- ===== 精选时刻渐变卡 ===== -->
  <g>
    <rect x="20" y="194" width="335" height="96" rx="20" fill="url(#mHero)"/>
    <use href="#paw3" fill="#FFFFFF" opacity="0.15" transform="translate(330 210) scale(1.5) rotate(20)"/>
    <use href="#paw3" fill="#FFFFFF" opacity="0.1" transform="translate(240 280) scale(1.2) rotate(-12)"/>
    <text x="40" y="226" font-size="14" font-weight="700" fill="#FFFFFF">✨ 本周精选时刻</text>
    <text x="40" y="246" font-size="11" fill="#FFFFFF" opacity="0.92">AI 自动挑出最出片的 6 张，回顾年糕的一周</text>
    <!-- 内嵌三张小图 -->
    <g opacity="0.95">
      <rect x="40" y="256" width="52" height="26" rx="8" fill="#FFFFFF" opacity="0.28"/>
      <rect x="98" y="256" width="52" height="26" rx="8" fill="#FFFFFF" opacity="0.28"/>
      <rect x="156" y="256" width="52" height="26" rx="8" fill="#FFFFFF" opacity="0.28"/>
      <rect x="214" y="256" width="52" height="26" rx="8" fill="#FFFFFF" opacity="0.28"/>
      <rect x="272" y="256" width="52" height="26" rx="8" fill="#FFFFFF" opacity="0.5"/>
      <text x="298" y="273" font-size="10" fill="#fff" text-anchor="middle">查看 ›</text>
    </g>
  </g>

  <!-- ===== 照片瀑布流 ===== -->
  <text x="24" y="322" font-size="15" font-weight="700" fill="#22423A">最近上传</text>
  <text x="337" y="322" font-size="11" fill="#0F7A5F">时间线 ›</text>
  <g>
    <!-- 左列 -->
    <use href="#photo" x="20" y="336" fill="url(#pA)"/>
    <rect x="20" y="456" width="100" height="18" rx="9" fill="#FFF1E7"/>
    <text x="70" y="469" font-size="9" fill="#B26120" text-anchor="middle">年糕 · 晒太阳</text>
    <use href="#photo" x="20" y="486" fill="url(#pB)"/>
    <rect x="20" y="606" width="100" height="18" rx="9" fill="#DFF6EE"/>
    <text x="70" y="619" font-size="9" fill="#0F7A5F" text-anchor="middle">豆豆 · 打盹</text>
    <use href="#photo" x="20" y="636" fill="url(#pC)"/>
    <!-- 中列 -->
    <use href="#photo" x="138" y="336" fill="url(#pD)"/>
    <rect x="138" y="456" width="100" height="18" rx="9" fill="#E9F5FC"/>
    <text x="188" y="469" font-size="9" fill="#2A7CA8" text-anchor="middle">玩耍 · 逗猫棒</text>
    <use href="#photo" x="138" y="486" fill="url(#pE)"/>
    <rect x="138" y="606" width="100" height="18" rx="9" fill="#FFF6DE"/>
    <text x="188" y="619" font-size="9" fill="#9A7418" text-anchor="middle">年糕 · 生日会</text>
    <use href="#photo" x="138" y="636" fill="url(#pF)"/>
    <!-- 右列 -->
    <use href="#photo" x="256" y="336" fill="url(#pG)"/>
    <rect x="256" y="456" width="99" height="18" rx="9" fill="#FFEDF1"/>
    <text x="305" y="469" font-size="9" fill="#C2556E" text-anchor="middle">新年 · 拜年装</text>
    <use href="#photo" x="256" y="486" fill="url(#pH)"/>
    <rect x="256" y="606" width="99" height="18" rx="9" fill="#DFF6EE"/>
    <text x="305" y="619" font-size="9" fill="#0F7A5F" text-anchor="middle">体检 · 很勇敢</text>
    <use href="#photo" x="256" y="636" fill="url(#pI)"/>
  </g>

  <!-- 上传浮动按钮 -->
  <g>
    <circle cx="323" cy="700" r="28" fill="url(#mHero)"/>
    <path d="M323 688 v24 M311 700 h24" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="335" cy="682" r="11" fill="#FFC94D"/>
    <text x="335" y="686.5" font-size="10" font-weight="700" fill="#7A5A00" text-anchor="middle">AI</text>
  </g>

  <!-- 底部 TabBar -->
  <rect x="0" y="752" width="375" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="752" x2="375" y2="752" stroke="#E3F1EA"/>
  <g transform="translate(60 776)">
    <use href="#paw3" fill="#8FA8A0" transform="scale(0.85)"/>
    <text x="0" y="24" font-size="10" fill="#8FA8A0" text-anchor="middle">首页</text>
  </g>
  <g transform="translate(150 776)">
    <rect x="-12" y="-10" width="24" height="20" rx="6" fill="none" stroke="#8FA8A0" stroke-width="1.8"/>
    <path d="M-5 0 h10 M-5 4 h7" stroke="#8FA8A0" stroke-width="1.8" stroke-linecap="round"/>
    <text x="0" y="25" font-size="10" fill="#8FA8A0" text-anchor="middle">健康</text>
  </g>
  <g transform="translate(225 775)">
    <rect x="-11" y="-9" width="22" height="18" rx="5" fill="#DFF6EE"/>
    <circle cx="-3" cy="0" r="3" fill="#1FAE85"/>
    <circle cx="5" cy="-2" r="2.2" fill="#1FAE85"/>
    <text x="0" y="25" font-size="10" font-weight="700" fill="#1FAE85" text-anchor="middle">素材</text>
  </g>
  <g transform="translate(310 776)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#8FA8A0" stroke-width="1.8"/>
    <path d="M4 4 l5 5" stroke="#8FA8A0" stroke-width="1.8" stroke-linecap="round"/>
    <text x="0" y="25" font-size="10" fill="#8FA8A0" text-anchor="middle">我的</text>
  </g>
  <rect x="128" y="800" width="120" height="4" rx="2" fill="#22423A" opacity="0.2"/>
</svg>
