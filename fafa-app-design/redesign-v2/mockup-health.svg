<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" font-family="'STXinwei','华文新魏','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="hBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFF6EE"/>
      <stop offset="1" stop-color="#F2FAF6"/>
    </linearGradient>
    <linearGradient id="hRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADEB8"/>
      <stop offset="1" stop-color="#1FAE85"/>
    </linearGradient>
    <g id="paw2">
      <ellipse cx="0" cy="4" rx="7.5" ry="6"/>
      <ellipse cx="-8.5" cy="-4.5" rx="3.4" ry="4.4" transform="rotate(-24 -8.5 -4.5)"/>
      <ellipse cx="-2.6" cy="-8" rx="3.4" ry="4.6" transform="rotate(-8 -2.6 -8)"/>
      <ellipse cx="3.6" cy="-8" rx="3.4" ry="4.6" transform="rotate(8 3.6 -8)"/>
      <ellipse cx="9.2" cy="-4.5" rx="3.4" ry="4.4" transform="rotate(24 9.2 -4.5)"/>
    </g>
    <!-- 日出渐变：医疗关怀 -->
    <linearGradient id="gSunrise" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB36B"/><stop offset="1" stop-color="#FF8FA8"/></linearGradient>
    <!-- 六维打卡图标底渐变 -->
    <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D5F2E6"/><stop offset="1" stop-color="#C0EAD8"/></linearGradient>
    <linearGradient id="gLemon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEFC2"/><stop offset="1" stop-color="#FFF9E6"/></linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFEAF9"/><stop offset="1" stop-color="#F0F9FE"/></linearGradient>
    <linearGradient id="gFeed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE3CC"/><stop offset="1" stop-color="#FFF4EA"/></linearGradient>
    <linearGradient id="gMed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD9E3"/><stop offset="1" stop-color="#FFF1F4"/></linearGradient>
    <linearGradient id="gWarm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE3CC"/><stop offset="1" stop-color="#FFF4EA"/></linearGradient>
    <!-- 体重趋势面积渐变 -->
    <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FC79B" stop-opacity="0.22"/><stop offset="1" stop-color="#2FC79B" stop-opacity="0"/></linearGradient>
  </defs>

  <rect width="375" height="812" fill="url(#hBg)"/>
  <use href="#paw2" fill="#C9EBDD" transform="translate(340 90) scale(1.4) rotate(15)"/>
  <use href="#paw2" fill="#FFE3B3" transform="translate(30 300) scale(1) rotate(-18)"/>

  <!-- 状态栏 -->
  <text x="24" y="24" font-size="13" font-weight="600" fill="#22423A">9:41</text>
  <g fill="#22423A">
    <rect x="316" y="14" width="20" height="10" rx="3" opacity="0.9"/>
    <rect x="292" y="15" width="16" height="8" rx="2.5" opacity="0.7"/>
  </g>

  <!-- 顶部：页面标题 + 宠物切换 -->
  <text x="24" y="66" font-size="20" font-weight="700" fill="#22423A">宠物健康</text>
  <g>
    <rect x="258" y="46" width="97" height="30" rx="15" fill="#FFFFFF" stroke="#DCEDE5"/>
    <circle cx="274" cy="61" r="9" fill="#F5B971"/>
    <text x="290" y="65" font-size="11" font-weight="600" fill="#22423A">年糕 ▾</text>
  </g>

  <!-- ===== 健康总览大卡 ===== -->
  <g>
    <rect x="20" y="92" width="335" height="150" rx="24" fill="#FFFFFF"/>
    <rect x="20" y="92" width="335" height="150" rx="24" fill="none" stroke="#E3F1EA"/>
    <!-- 健康分环 -->
    <circle cx="86" cy="160" r="38" fill="none" stroke="#EFF7F2" stroke-width="9"/>
    <path d="M86 122 a38 38 0 1 1 -32 58.6" fill="none" stroke="url(#hRing)" stroke-width="9" stroke-linecap="round"/>
    <text x="86" y="158" font-size="24" font-weight="800" fill="#0F7A5F" text-anchor="middle">92</text>
    <text x="86" y="176" font-size="9.5" fill="#8FA8A0" text-anchor="middle">健康分</text>
    <use href="#paw2" fill="url(#gMint)" transform="translate(86 214) scale(0.8)"/>
    <!-- 右侧摘要 -->
    <text x="146" y="126" font-size="14" font-weight="700" fill="#22423A">状态不错，继续保持！</text>
    <text x="146" y="143" font-size="11" fill="#8FA8A0">较上周 +3 · 食欲稳定</text>
    <g font-size="10.5">
      <rect x="146" y="156" width="94" height="26" rx="13" fill="url(#gLemon)"/>
      <circle cx="160" cy="169" r="4" fill="#FFC94D"/>
      <text x="170" y="173" fill="#9A7418">体重 4.6kg ↓</text>
      <rect x="246" y="156" width="94" height="26" rx="13" fill="url(#gMint)"/>
      <circle cx="260" cy="169" r="4" fill="#2FC79B"/>
      <text x="270" y="173" fill="#0F7A5F">已打卡 7 天</text>
      <rect x="146" y="190" width="94" height="26" rx="13" fill="url(#gFeed)"/>
      <circle cx="160" cy="203" r="4" fill="#FF9F5C"/>
      <text x="170" y="207" fill="#B26120">喂食计划中</text>
      <rect x="246" y="190" width="94" height="26" rx="13" fill="url(#gMed)"/>
      <circle cx="260" cy="203" r="4" fill="url(#gSunrise)"/>
      <text x="270" y="207" fill="#C2556E">1条健康提醒</text>
    </g>
  </g>

  <!-- ===== 今日打卡（六维胶囊） ===== -->
  <text x="24" y="278" font-size="15" font-weight="700" fill="#22423A">今日打卡</text>
  <rect x="286" y="264" width="69" height="24" rx="12" fill="url(#hRing)"/>
  <text x="320" y="280" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">全部正常</text>
  <g>
    <g transform="translate(20 292)">
      <rect width="107" height="58" rx="16" fill="#FFFFFF" stroke="#E3F1EA"/>
      <circle cx="24" cy="22" r="9" fill="url(#gMint)"/>
      <text x="24" y="26" font-size="10" text-anchor="middle">🍖</text>
      <text x="40" y="20" font-size="10.5" fill="#8FA8A0">食欲</text>
      <text x="40" y="36" font-size="12" font-weight="700" fill="#22423A">好</text>
      <circle cx="92" cy="26" r="6" fill="#2FC79B"/>
      <path d="M89.5 26 l2 2 3.5 -4" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(134 292)">
      <rect width="107" height="58" rx="16" fill="#FFFFFF" stroke="#E3F1EA"/>
      <circle cx="24" cy="22" r="9" fill="url(#gLemon)"/>
      <text x="24" y="26" font-size="10" text-anchor="middle">⚡</text>
      <text x="40" y="20" font-size="10.5" fill="#8FA8A0">精神</text>
      <text x="40" y="36" font-size="12" font-weight="700" fill="#22423A">活泼</text>
      <circle cx="92" cy="26" r="6" fill="#2FC79B"/>
      <path d="M89.5 26 l2 2 3.5 -4" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(248 292)">
      <rect width="107" height="58" rx="16" fill="#FFFFFF" stroke="#E3F1EA"/>
      <circle cx="24" cy="22" r="9" fill="url(#gSky)"/>
      <text x="24" y="26" font-size="10" text-anchor="middle">💧</text>
      <text x="40" y="20" font-size="10.5" fill="#8FA8A0">饮水</text>
      <text x="40" y="36" font-size="12" font-weight="700" fill="#22423A">正常</text>
      <circle cx="92" cy="26" r="6" fill="#2FC79B"/>
      <path d="M89.5 26 l2 2 3.5 -4" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(20 358)">
      <rect width="107" height="58" rx="16" fill="#FFFFFF" stroke="#E3F1EA"/>
      <circle cx="24" cy="22" r="9" fill="url(#gFeed)"/>
      <text x="24" y="26" font-size="10" text-anchor="middle">💩</text>
      <text x="40" y="20" font-size="10.5" fill="#8FA8A0">便便</text>
      <text x="40" y="36" font-size="12" font-weight="700" fill="#22423A">成型</text>
      <circle cx="92" cy="26" r="6" fill="#2FC79B"/>
      <path d="M89.5 26 l2 2 3.5 -4" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(134 358)">
      <rect width="107" height="58" rx="16" fill="#FFFFFF" stroke="#E3F1EA"/>
      <circle cx="24" cy="22" r="9" fill="url(#gMed)"/>
      <text x="24" y="26" font-size="10" text-anchor="middle">🤮</text>
      <text x="40" y="20" font-size="10.5" fill="#8FA8A0">呕吐</text>
      <text x="40" y="36" font-size="12" font-weight="700" fill="#C2556E">1 次 ⚠</text>
      <circle cx="92" cy="26" r="6" fill="url(#gSunrise)"/>
      <text x="92" y="29.5" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">!</text>
    </g>
    <g transform="translate(248 358)">
      <rect width="107" height="58" rx="16" fill="#FFFFFF" stroke="#E3F1EA"/>
      <circle cx="24" cy="22" r="9" fill="url(#gSky)"/>
      <text x="24" y="26" font-size="10" text-anchor="middle">🚽</text>
      <text x="40" y="20" font-size="10.5" fill="#8FA8A0">排尿</text>
      <text x="40" y="36" font-size="12" font-weight="700" fill="#22423A">正常</text>
      <circle cx="92" cy="26" r="6" fill="#2FC79B"/>
      <path d="M89.5 26 l2 2 3.5 -4" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ===== 体重趋势卡 ===== -->
  <g>
    <rect x="20" y="436" width="335" height="130" rx="20" fill="#FFFFFF" stroke="#E3F1EA"/>
    <text x="40" y="466" font-size="13" font-weight="700" fill="#22423A">体重趋势</text>
    <text x="40" y="484" font-size="10" fill="#8FA8A0">近90天 · 节食初见成效</text>
    <rect x="268" y="452" width="71" height="24" rx="12" fill="#F2FAF6"/>
    <text x="303" y="468" font-size="10" font-weight="600" fill="#0F7A5F" text-anchor="middle">月 ▾</text>
    <!-- 折线 -->
    <polyline points="40,540 80,532 120,536 160,524 200,516 240,510 280,506 335,500" fill="none" stroke="#2FC79B" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="40,540 80,532 120,536 160,524 200,516 240,510 280,506 335,500 335,556 40,556" fill="url(#trendFill)"/>
    <circle cx="335" cy="500" r="4.5" fill="#FFFFFF" stroke="#1FAE85" stroke-width="2.5"/>
    <rect x="292" y="478" width="43" height="17" rx="8.5" fill="#22423A"/>
    <text x="313.5" y="490" font-size="9" fill="#fff" text-anchor="middle">4.6kg</text>
  </g>

  <!-- ===== 健康提醒卡（珊瑚粉） ===== -->
  <g>
    <rect x="20" y="582" width="335" height="92" rx="20" fill="#FFF3F5"/>
    <rect x="20" y="582" width="335" height="92" rx="20" fill="none" stroke="#FFD9E1"/>
    <rect x="36" y="600" width="38" height="38" rx="13" fill="url(#gSunrise)"/>
    <path d="M48 630 v-9 a7 7 0 0 1 14 0 v9 Z" fill="#fff"/>
    <path d="M51 616 l1.5 -5 h3 l1.5 5" fill="#fff" opacity="0.5"/>
    <text x="88" y="608" font-size="13" font-weight="700" fill="#C2556E">连续呕吐提醒</text>
    <text x="88" y="626" font-size="11" fill="#A0707E">近24小时呕吐1次 + 食欲下降，建议观察</text>
    <text x="88" y="642" font-size="11" fill="#A0707E">如持续请及时就医 🏥</text>
    <rect x="292" y="622" width="48" height="24" rx="12" fill="url(#gSunrise)"/>
    <text x="316" y="638" font-size="10.5" font-weight="600" fill="#fff" text-anchor="middle">已知悉</text>
  </g>

  <!-- ===== 医疗快捷入口 ===== -->
  <g>
    <rect x="20" y="690" width="163" height="46" rx="15" fill="#FFFFFF" stroke="#E3F1EA"/>
    <rect x="34" y="701" width="24" height="24" rx="8" fill="url(#gMint)"/>
    <path d="M46 706 v14 M39 713 h14" stroke="#1FAE85" stroke-width="2.2" stroke-linecap="round"/>
    <text x="66" y="718" font-size="11.5" font-weight="600" fill="#22423A">就诊记录</text>
    <rect x="192" y="690" width="163" height="46" rx="15" fill="#FFFFFF" stroke="#E3F1EA"/>
    <rect x="206" y="701" width="24" height="24" rx="8" fill="url(#gFeed)"/>
    <rect x="212" y="707" width="12" height="12" rx="3" fill="none" stroke="#FF9F5C" stroke-width="1.8"/>
    <path d="M215 710 h6 M215 714 h6" stroke="#FF9F5C" stroke-width="1.5" stroke-linecap="round"/>
    <text x="238" y="718" font-size="11.5" font-weight="600" fill="#22423A">用药计划</text>
  </g>

  <!-- 底部 TabBar -->
  <rect x="0" y="752" width="375" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="752" x2="375" y2="752" stroke="#E3F1EA"/>
  <g transform="translate(60 776)">
    <use href="#paw2" fill="#8FA8A0" transform="scale(0.85)"/>
    <text x="0" y="24" font-size="10" fill="#8FA8A0" text-anchor="middle">首页</text>
  </g>
  <g transform="translate(150 775)">
    <rect x="-12" y="-10" width="24" height="20" rx="6" fill="url(#gMint)"/>
    <path d="M-5 0 h10 M-5 4 h7" stroke="#1FAE85" stroke-width="1.8" stroke-linecap="round"/>
    <text x="0" y="25" font-size="10" font-weight="700" fill="#1FAE85" text-anchor="middle">健康</text>
  </g>
  <g transform="translate(225 776)">
    <rect x="-11" y="-9" width="22" height="18" rx="5" fill="none" stroke="#8FA8A0" stroke-width="1.8"/>
    <circle cx="-3" cy="0" r="3" fill="#8FA8A0"/>
    <circle cx="5" cy="-2" r="2.2" fill="#8FA8A0"/>
    <text x="0" y="25" font-size="10" fill="#8FA8A0" text-anchor="middle">素材</text>
  </g>
  <g transform="translate(310 776)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#8FA8A0" stroke-width="1.8"/>
    <path d="M4 4 l5 5" stroke="#8FA8A0" stroke-width="1.8" stroke-linecap="round"/>
    <text x="0" y="25" font-size="10" fill="#8FA8A0" text-anchor="middle">我的</text>
  </g>
  <rect x="128" y="800" width="120" height="4" rx="2" fill="#22423A" opacity="0.2"/>
</svg>
