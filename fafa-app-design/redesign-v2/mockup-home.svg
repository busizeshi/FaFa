<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" font-family="'STXinwei','华文新魏','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <!-- 页面顶部渐变：淡青 → 奶油黄 -->
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DFF6EE"/>
      <stop offset="0.55" stop-color="#F2FAF6"/>
      <stop offset="1" stop-color="#FFF3DC"/>
    </linearGradient>
    <!-- 品牌主按钮渐变 -->
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADEB8"/>
      <stop offset="1" stop-color="#1FAE85"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2FC79B"/>
      <stop offset="1" stop-color="#58B8E8"/>
    </linearGradient>
    <!-- 功能图标底 / 点缀卡 渐变 -->
    <linearGradient id="gFeed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE3CC"/><stop offset="1" stop-color="#FFF4EA"/></linearGradient>
    <linearGradient id="gCheck" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEFC2"/><stop offset="1" stop-color="#FFF9E6"/></linearGradient>
    <linearGradient id="gMed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD9E3"/><stop offset="1" stop-color="#FFF1F4"/></linearGradient>
    <linearGradient id="gPay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFEAF9"/><stop offset="1" stop-color="#F0F9FE"/></linearGradient>
    <linearGradient id="gWarm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE7D3"/><stop offset="1" stop-color="#FFD9E3"/></linearGradient>
    <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D5F2E6"/><stop offset="1" stop-color="#C0EAD8"/></linearGradient>
    <!-- 爪印符号 -->
    <g id="paw">
      <ellipse cx="0" cy="4" rx="7.5" ry="6"/>
      <ellipse cx="-8.5" cy="-4.5" rx="3.4" ry="4.4" transform="rotate(-24 -8.5 -4.5)"/>
      <ellipse cx="-2.6" cy="-8" rx="3.4" ry="4.6" transform="rotate(-8 -2.6 -8)"/>
      <ellipse cx="3.6" cy="-8" rx="3.4" ry="4.6" transform="rotate(8 3.6 -8)"/>
      <ellipse cx="9.2" cy="-4.5" rx="3.4" ry="4.4" transform="rotate(24 9.2 -4.5)"/>
    </g>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="375" height="812" fill="#F2FAF6"/>
  <path d="M0 0 H375 V240 C300 268 250 230 190 252 C120 276 60 246 0 262 Z" fill="url(#heroBg)"/>
  <use href="#paw" fill="#C9EBDD" transform="translate(322 118) scale(1.5) rotate(18)"/>
  <use href="#paw" fill="#FFE3B3" transform="translate(40 210) scale(1.1) rotate(-14)"/>
  <circle cx="345" cy="196" r="26" fill="#FFDFE4" opacity="0.7"/>
  <circle cx="18" cy="150" r="14" fill="#D8F3EC" opacity="0.9"/>

  <!-- ===== 状态栏 ===== -->
  <text x="24" y="24" font-size="13" font-weight="600" fill="#22423A">9:41</text>
  <g fill="#22423A">
    <rect x="316" y="14" width="20" height="10" rx="3" opacity="0.9"/>
    <rect x="292" y="15" width="16" height="8" rx="2.5" opacity="0.7"/>
  </g>

  <!-- ===== 顶部问候 ===== -->
  <text x="24" y="66" font-size="12" fill="#5C7A70">10月7日 周三 · 晴</text>
  <text x="24" y="92" font-size="22" font-weight="700" fill="#22423A">早安，铲屎官<tspan fill="#FF9F5C"> ☀</tspan></text>
  <text x="24" y="112" font-size="12" fill="#8FA8A0">年糕今天在等你打卡哦～</text>
  <!-- 铃铛按钮 -->
  <g>
    <circle cx="337" cy="82" r="19" fill="#FFFFFF" stroke="#DCEDE5" stroke-width="1"/>
    <path d="M337 74 c-4 0 -6.5 3 -6.5 6.5 v3.5 l-2 3 h17 l-2 -3 v-3.5 c0 -3.5 -2.5 -6.5 -6.5 -6.5 Z" fill="none" stroke="#22423A" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M334.5 90 a2.6 2.6 0 0 0 5 0" fill="none" stroke="#22423A" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="343" cy="72" r="4" fill="#FF8FA8" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>

  <!-- ===== 宠物主卡 ===== -->
  <g>
    <rect x="20" y="132" width="335" height="112" rx="24" fill="#FFFFFF"/>
    <rect x="20" y="132" width="335" height="112" rx="24" fill="none" stroke="#E3F1EA" stroke-width="1"/>
    <!-- 宠物头像：奶油底 + 简笔猫 -->
    <circle cx="72" cy="184" r="34" fill="#FFF1DA"/>
    <path d="M56 176 l4 -10 8 6 M88 176 l-4 -10 -8 6" fill="#F5B971"/>
    <circle cx="72" cy="184" r="17" fill="#F5B971"/>
    <circle cx="65.5" cy="181" r="2.2" fill="#3B2E22"/>
    <circle cx="78.5" cy="181" r="2.2" fill="#3B2E22"/>
    <path d="M69.5 188 q2.5 2.4 5 0" fill="none" stroke="#3B2E22" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M72 184 v2.4 M69 187.5 l3 -1 3 1" fill="none" stroke="#3B2E22" stroke-width="1.2" stroke-linecap="round"/>
    <!-- 信息 -->
    <text x="118" y="176" font-size="16" font-weight="700" fill="#22423A">年糕</text>
    <text x="152" y="176" font-size="11" fill="#8FA8A0">英短 · 2岁3个月</text>
    <g font-size="10.5" fill="#5C7A70">
      <rect x="118" y="188" width="62" height="22" rx="11" fill="#F2FAF6"/>
      <text x="129" y="202">4.6 kg</text>
      <rect x="186" y="188" width="70" height="22" rx="11" fill="url(#gFeed)"/>
      <text x="197" y="202" fill="#D97B3D">晚餐 18:30</text>
    </g>
    <!-- 渐变胶囊：今日已打卡 -->
    <rect x="278" y="150" width="66" height="26" rx="13" fill="url(#brandGrad)"/>
    <text x="311" y="167" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">已打卡 ✓</text>
    <!-- 健康环 -->
    <circle cx="311" cy="210" r="14" fill="none" stroke="#EAF4EF" stroke-width="5"/>
    <path d="M311 196 a14 14 0 0 1 12.1 21" fill="none" stroke="#2FC79B" stroke-width="5" stroke-linecap="round"/>
    <text x="311" y="214" font-size="9" font-weight="700" fill="#0F7A5F" text-anchor="middle">86</text>
  </g>

  <!-- ===== 快捷入口 ===== -->
  <text x="24" y="282" font-size="15" font-weight="700" fill="#22423A">今天要做的事</text>
  <text x="24" y="298" font-size="11" fill="#8FA8A0">轻快点一下，毛孩子的日常就安排好了</text>
  <g>
    <g transform="translate(24 316)">
      <rect width="76" height="76" rx="20" fill="#FFFFFF" stroke="#E3F1EA"/>
      <rect x="20" y="14" width="36" height="36" rx="12" fill="url(#gFeed)"/>
      <path d="M28 30 h20 M28 36 h20 M28 42 h12" stroke="#FF9F5C" stroke-width="2.6" stroke-linecap="round"/>
      <text x="38" y="66" font-size="11" font-weight="600" fill="#22423A" text-anchor="middle">喂食</text>
    </g>
    <g transform="translate(112 316)">
      <rect width="76" height="76" rx="20" fill="#FFFFFF" stroke="#E3F1EA"/>
      <rect x="20" y="14" width="36" height="36" rx="12" fill="url(#gCheck)"/>
      <path d="M38 24 c6 4 8 9 8 13 a8 8 0 0 1 -16 0 c0 -4 2 -9 8 -13 Z" fill="#FFC94D"/>
      <text x="38" y="66" font-size="11" font-weight="600" fill="#22423A" text-anchor="middle">打卡</text>
    </g>
    <g transform="translate(200 316)">
      <rect width="76" height="76" rx="20" fill="#FFFFFF" stroke="#E3F1EA"/>
      <rect x="20" y="14" width="36" height="36" rx="12" fill="url(#gMed)"/>
      <rect x="31" y="24" width="14" height="17" rx="4" fill="#FF8FA8"/>
      <rect x="34" y="20" width="8" height="6" rx="2" fill="#FF8FA8"/>
      <text x="38" y="66" font-size="11" font-weight="600" fill="#22423A" text-anchor="middle">用药</text>
    </g>
    <g transform="translate(288 316)">
      <rect width="76" height="76" rx="20" fill="#FFFFFF" stroke="#E3F1EA"/>
      <rect x="20" y="14" width="36" height="36" rx="12" fill="url(#gPay)"/>
      <circle cx="38" cy="32" r="9" fill="none" stroke="#58B8E8" stroke-width="2.4"/>
      <path d="M38 27 v10 M35 30.5 h6" stroke="#58B8E8" stroke-width="2" stroke-linecap="round"/>
      <text x="38" y="66" font-size="11" font-weight="600" fill="#22423A" text-anchor="middle">花销</text>
    </g>
  </g>

  <!-- ===== 待办提醒卡 ===== -->
  <text x="24" y="428" font-size="15" font-weight="700" fill="#22423A">即将到来</text>
  <text x="337" y="428" font-size="11" fill="#0F7A5F">全部 ›</text>
  <g>
    <rect x="20" y="440" width="335" height="60" rx="18" fill="#FFFFFF" stroke="#E3F1EA"/>
    <rect x="34" y="454" width="32" height="32" rx="11" fill="url(#gMed)"/>
    <path d="M43 472 l6 -8 4 5 6 -6" fill="none" stroke="#FF8FA8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="465" font-size="13" font-weight="600" fill="#22423A">猫三联疫苗 · 第2针</text>
    <text x="78" y="483" font-size="11" fill="#8FA8A0">明天 10:00 · 安安宠物医院</text>
    <rect x="290" y="460" width="52" height="22" rx="11" fill="url(#gMint)"/>
    <text x="316" y="475" font-size="10" font-weight="600" fill="#0F7A5F" text-anchor="middle">提醒中</text>
  </g>
  <g>
    <rect x="20" y="508" width="335" height="60" rx="18" fill="#FFFFFF" stroke="#E3F1EA"/>
    <rect x="34" y="522" width="32" height="32" rx="11" fill="url(#gFeed)"/>
    <path d="M42 546 v-8 a8 8 0 0 1 16 0 v8 Z" fill="none" stroke="#FF9F5C" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="50" cy="549" r="2" fill="#FF9F5C"/>
    <text x="78" y="533" font-size="13" font-weight="600" fill="#22423A">晚餐喂食 · 冻干拌粮</text>
    <text x="78" y="551" font-size="11" fill="#8FA8A0">今天 18:30 · 45g</text>
    <rect x="290" y="528" width="52" height="22" rx="11" fill="url(#gMint)"/>
    <text x="316" y="543" font-size="10" font-weight="600" fill="#0F7A5F" text-anchor="middle">提醒中</text>
  </g>

  <!-- ===== AI 助手横条 ===== -->
  <g>
    <rect x="20" y="590" width="335" height="66" rx="20" fill="url(#aiGrad)"/>
    <use href="#paw" fill="#FFFFFF" opacity="0.18" transform="translate(330 600) scale(1.6) rotate(20)"/>
    <use href="#paw" fill="#FFFFFF" opacity="0.12" transform="translate(230 645) scale(1.2) rotate(-15)"/>
    <circle cx="52" cy="623" r="17" fill="#FFFFFF" opacity="0.9"/>
    <path d="M46 620 q6 -8 12 0 q-2 8 -6 8 q-4 0 -6 -8 Z" fill="#2FC79B"/>
    <circle cx="52" cy="631" r="2.4" fill="#2FC79B"/>
    <text x="80" y="619" font-size="13" font-weight="700" fill="#FFFFFF">问问发发 AI</text>
    <text x="80" y="637" font-size="11" fill="#FFFFFF" opacity="0.92">"年糕最近胃口怎么样？" 随便聊，它都懂</text>
    <path d="M330 620 l-10 4 10 4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" transform="rotate(180 325 624)"/>
  </g>

  <!-- ===== 成长点滴横滑 ===== -->
  <text x="24" y="692" font-size="15" font-weight="700" fill="#22423A">成长点滴</text>
  <text x="337" y="692" font-size="11" fill="#0F7A5F">相册 ›</text>
  <g>
    <rect x="20" y="704" width="108" height="72" rx="16" fill="url(#gWarm)"/>
    <circle cx="44" cy="728" r="10" fill="#FF9F5C"/>
    <text x="62" y="726" font-size="10" font-weight="600" fill="#B26120">体重 -0.2kg</text>
    <text x="62" y="742" font-size="9" fill="#C9885A">节食计划第3周</text>
    <rect x="140" y="704" width="108" height="72" rx="16" fill="url(#gMint)"/>
    <circle cx="164" cy="728" r="10" fill="#2FC79B"/>
    <text x="182" y="726" font-size="10" font-weight="600" fill="#0F7A5F">驱虫已完成</text>
    <text x="182" y="742" font-size="9" fill="#5E9A82">体外 · 10月2日</text>
    <rect x="260" y="704" width="95" height="72" rx="16" fill="url(#gMed)"/>
    <circle cx="284" cy="728" r="10" fill="#FF8FA8"/>
    <text x="302" y="726" font-size="10" font-weight="600" fill="#C2556E">剪指甲</text>
    <text x="302" y="742" font-size="9" fill="#D98CA0">全程很乖 ✨</text>
  </g>

  <!-- ===== 底部 TabBar ===== -->
  <rect x="0" y="752" width="375" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="752" x2="375" y2="752" stroke="#E3F1EA"/>
  <!-- Tab 1 激活 -->
  <g transform="translate(60 774)">
    <use href="#paw" fill="#1FAE85" transform="scale(0.9)"/>
    <text x="0" y="26" font-size="10" font-weight="700" fill="#1FAE85" text-anchor="middle">首页</text>
  </g>
  <g transform="translate(150 775)">
    <rect x="-12" y="-10" width="24" height="20" rx="6" fill="none" stroke="#8FA8A0" stroke-width="1.8"/>
    <path d="M-5 0 h10 M-5 4 h7" stroke="#8FA8A0" stroke-width="1.8" stroke-linecap="round"/>
    <text x="0" y="25" font-size="10" fill="#8FA8A0" text-anchor="middle">健康</text>
  </g>
  <g transform="translate(225 775)">
    <rect x="-11" y="-9" width="22" height="18" rx="5" fill="none" stroke="#8FA8A0" stroke-width="1.8"/>
    <circle cx="-3" cy="0" r="3" fill="#8FA8A0"/>
    <circle cx="5" cy="-2" r="2.2" fill="#8FA8A0"/>
    <text x="0" y="25" font-size="10" fill="#8FA8A0" text-anchor="middle">素材</text>
  </g>
  <g transform="translate(310 775)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#8FA8A0" stroke-width="1.8"/>
    <path d="M4 4 l5 5" stroke="#8FA8A0" stroke-width="1.8" stroke-linecap="round"/>
    <text x="0" y="25" font-size="10" fill="#8FA8A0" text-anchor="middle">我的</text>
  </g>
  <!-- Home Indicator -->
  <rect x="128" y="800" width="120" height="4" rx="2" fill="#22423A" opacity="0.2"/>
</svg>
