    <style id="theme-vars">
/* ============================================================
   FaFa · Warm Sage visual system
   保留原有新魏字体、字号和线性图标；以暖色辅助和轻透表面增加层次
   ============================================================ */
:root {
  /* 品牌绿：保留原有鼠尾草主色 */
  --fafa-primary: #5C9E71;
  --fafa-primary-foreground: #FFFFFF;
  --fafa-primary-action: #3E7A52;
  --fafa-primary-action-hover: #326946;
  --fafa-primary-soft: #E6F2E8;
  --fafa-primary-soft-2: #D4EAD9;
  --fafa-primary-soft-foreground: #3E7A52;
  --fafa-primary-tint-border: #C5DFC9;

  /* 页面与文字 */
  --fafa-background: #FAFBF7;
  --fafa-foreground: #293A31;
  --fafa-card: #FFFFFF;
  --fafa-card-foreground: #293A31;
  --fafa-muted: #EEF4EC;
  --fafa-muted-foreground: #65796B;
  --fafa-border: #E2E9DF;
  --fafa-input: #FFFFFF;
  --fafa-ring: #5C9E71;

  /* 辅助色：健康绿、影像雾蓝、AI 薰衣草紫、日常杏橘与暖金 */
  --fafa-accent-coral: #D97B61;
  --fafa-accent-coral-soft: #FFF0EA;
  --fafa-accent-amber: #B77B24;
  --fafa-accent-amber-soft: #FFF4DE;
  --fafa-accent-sky: #4E88A2;
  --fafa-accent-sky-soft: #EAF4F8;
  --fafa-accent-lavender: #7869A6;
  --fafa-accent-lavender-soft: #F1EDFA;
  --fafa-accent-mint: #468B79;
  --fafa-accent-mint-soft: #E8F4EF;

  /* 玻璃表面：不支持 backdrop-filter 时仍有足够不透明度 */
  --fafa-glass-surface: rgba(255, 255, 255, 0.86);
  --fafa-glass-surface-strong: rgba(255, 255, 255, 0.94);
  --fafa-glass-border: rgba(255, 255, 255, 0.88);
  --fafa-gradient-canvas:
    radial-gradient(ellipse at 7% 0%, rgba(244, 194, 138, 0.17), transparent 36%),
    radial-gradient(ellipse at 100% 23%, rgba(140, 197, 179, 0.15), transparent 40%),
    #FAFBF7;
  --fafa-gradient-ai: linear-gradient(128deg, #E8F4E7 0%, #E9F4F2 54%, #F1ECF8 100%);
  --fafa-gradient-sunshine: linear-gradient(135deg, #F4D58A 0%, #F2AD82 53%, #E9967E 100%);
  --fafa-gradient-action: linear-gradient(135deg, #4B8D63 0%, #3E7A52 100%);
  --fafa-gradient-action-hover: linear-gradient(135deg, #3E7A52 0%, #326946 100%);

  /* 圆角刻度：保留现有 4 / 8 / 12 / full 规范 */
  --fafa-radius-sm: 4px;
  --fafa-radius-md: 8px;
  --fafa-radius-lg: 12px;
  --fafa-radius-full: 9999px;

  /* 轻量层次：浅灰绿投影与玻璃高光 */
  --fafa-shadow-sm: 0 2px 6px rgba(41, 58, 49, 0.045);
  --fafa-shadow-md: 0 8px 20px rgba(41, 58, 49, 0.075);
  --fafa-shadow-card: 0 5px 18px rgba(54, 78, 63, 0.055), inset 0 1px 0 rgba(255, 255, 255, 0.9);

  /* 字体保持 fafa-app-design 原有设计，不在本轮替换或嵌入字体文件 */
  --fafa-font-sans: "STXinwei", "华文新魏", "KaiTi", "楷体", "STKaiti", "华文楷体",
    "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
}

body {
  background: var(--fafa-background);
  color: var(--fafa-foreground);
  font-family: var(--fafa-font-sans);
  -webkit-font-smoothing: antialiased;
}

    <style id="fafa-visual-polish">
/* FaFa Warm Sage · glass and semantic color layer
   Keep the existing page DOM, spacing, line-icon shapes and interaction hooks intact. */
html {
  background: var(--fafa-background);
}
html body {
  background: var(--fafa-gradient-canvas) !important;
  color: var(--fafa-foreground);
}
html body .page-frame {
  background: transparent !important;
}

/* Apple-like translucent headers and the existing four-item tab bar.
   Opaque fallback surfaces above stay readable where blur is unavailable. */
html body .appbar,
html body [data-mobile-nav="global"] {
  background: var(--fafa-glass-surface) !important;
  border-color: var(--fafa-glass-border) !important;
  box-shadow: 0 5px 18px rgba(45, 68, 54, 0.045);
}
html body .appbar {
  border-bottom-color: rgba(205, 221, 207, 0.72) !important;
}
html body [data-mobile-nav="global"] {
  border-top-color: rgba(205, 221, 207, 0.72) !important;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html body .appbar,
  html body [data-mobile-nav="global"] {
    -webkit-backdrop-filter: blur(18px) saturate(1.18);
    backdrop-filter: blur(18px) saturate(1.18);
  }
}

/* Card edges retain the original thin-line language with a quiet lift. */
html body .page-frame .page-main [class*="-card"] {
  border-color: var(--fafa-border);
  box-shadow: var(--fafa-shadow-card);
}
html body .page-frame .page-main .ai-card {
  background: var(--fafa-gradient-ai) !important;
  border-color: rgba(197, 223, 201, 0.86) !important;
  box-shadow: 0 10px 26px rgba(69, 117, 87, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.92);
}
html body .page-frame .ai-avatar {
  background: linear-gradient(135deg, #68A77A, #8EBFC0 58%, #9F91C7) !important;
  color: #FFFFFF !important;
  box-shadow: 0 4px 10px rgba(76, 130, 99, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

/* Home quick actions: four calm semantic colors instead of four identical mint icons. */
html body .page-frame .qa-item:nth-child(1) .qa-icon {
  color: var(--fafa-accent-mint);
  background: linear-gradient(145deg, #E8F4EF, #D9EEE4);
}
html body .page-frame .qa-item:nth-child(2) .qa-icon {
  color: var(--fafa-accent-sky);
  background: linear-gradient(145deg, #EDF6FA, #DFEEF5);
}
html body .page-frame .qa-item:nth-child(3) .qa-icon {
  color: var(--fafa-accent-coral);
  background: linear-gradient(145deg, #FFF3EC, #FBE5D9);
}
html body .page-frame .qa-item:nth-child(4) .qa-icon {
  color: var(--fafa-accent-lavender);
  background: linear-gradient(145deg, #F4F0FB, #EAE5F7);
}
html body .page-frame .qa-icon {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92);
}
html body .page-frame .metric-cell:nth-child(1) .metric-icon { color: var(--fafa-accent-amber); }
html body .page-frame .metric-cell:nth-child(2) .metric-icon { color: var(--fafa-accent-sky); }
html body .page-frame .metric-cell:nth-child(3) .metric-icon { color: var(--fafa-accent-coral); }

/* Semantic colors keep the existing Lucide outline icon set, adding meaning through hue. */

/* Frosted input surfaces for search, chat and forms; no dimensions or handlers change. */
html body .page-frame .inputbar,

@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {

<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
  /* ===== FaFa 喂养分析 · 关键静态布局（不依赖 Tailwind 运行时） ===== */
  * { box-sizing: border-box; }
  html { background: var(--fafa-background); }
  body {
    margin: 0;
    background: var(--fafa-background);
    color: var(--fafa-foreground);
    font-family: var(--fafa-font-sans);
    font-size: 13px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* 防止 Tailwind 编译后 font-sans 工具类覆盖品牌字体 */
  body.min-h-screen.font-sans.antialiased { font-family: var(--fafa-font-sans); }
  h1, h2, h3, p, ol, li { margin: 0; padding: 0; }
  ol { list-style: none; }
  button { font-family: inherit; font-size: inherit; border: none; background: transparent; padding: 0; cursor: pointer; color: inherit; }
  a { text-decoration: none; color: inherit; cursor: pointer; }

  /* 根框架：mobile 内容容器 100% / max-width 480px 居中，文档流滚动 */
  .page-frame {
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--fafa-background);
  }

  /* A1 二级页顶部应用栏（44px） */
  .appbar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    height: 44px;
    background: var(--fafa-background);
    border-bottom: 1px solid var(--fafa-border);
  }
  .appbar-side { flex: none; width: 88px; display: flex; align-items: center; }
  .appbar-side--right { justify-content: flex-end; }
  .appbar-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: var(--fafa-radius-full);
    color: var(--fafa-foreground);
  }
  .appbar-back svg { width: 20px; height: 20px; }
  .appbar-title {
    flex: 1 1 auto;
    min-width: 0;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pet-chip {
    display: inline-flex;
    align-items: center;
    height: 26px;
    padding: 0 10px;
    border-radius: var(--fafa-radius-full);
    background: var(--fafa-card);
    border: 1px solid var(--fafa-border);
    font-size: 12px;
    color: var(--fafa-foreground);
    white-space: nowrap;
  }

  .page-main { flex: 1 0 auto; width: 100%; padding: 20px 16px 36px; }
  .page-section { margin: 0 0 24px; }
  .page-section:last-child { margin-bottom: 0; }

  /* 分区标题行 */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .section-title { font-size: 15px; font-weight: 600; line-height: 1.3; }

  /* 1. 周期切换 chips（本周选中 · 本月） */
  .period-switch {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 4px;
    margin-bottom: 12px;
    padding: 3px;
    background: var(--fafa-muted);
    border-radius: var(--fafa-radius-full);
  }
  .period-item {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 44px;
    border-radius: var(--fafa-radius-full);
    font-size: 13px;
    color: var(--fafa-muted-foreground);
    white-space: nowrap;
  }
  .period-item svg { width: 14px; height: 14px; }
  .period-item.is-active {
    background: var(--fafa-card);
    color: var(--fafa-primary);
    font-weight: 600;
    box-shadow: var(--fafa-shadow-sm);
  }

  /* 2. 统计卡组（analysis-stats，2×2 网格 + 细分隔线） */
  .stats-card {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    background: var(--fafa-card);
    border: 1px solid var(--fafa-border);
    border-radius: var(--fafa-radius-lg);
    overflow: hidden;
  }
  .stat-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 0;
    padding: 14px 12px 16px;
    text-align: center;
  }
  .stat-cell:nth-child(odd) { border-right: 1px solid var(--fafa-border); }
  .stat-cell:nth-child(-n+2) { border-bottom: 1px solid var(--fafa-border); }
  .stat-icon { width: 20px; height: 20px; color: var(--fafa-primary); }
  .stat-value {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat-unit { font-size: 12px; font-weight: 400; color: var(--fafa-muted-foreground); margin-left: 2px; }
  .stat-label { font-size: 12px; color: var(--fafa-muted-foreground); }
  .stat-bar {
    width: 100%;
    max-width: 96px;
    height: 5px;
    margin-top: 6px;
    border-radius: var(--fafa-radius-full);
    background: var(--fafa-muted);
    overflow: hidden;
  }
  .stat-bar-fill {
    width: 86%;
    height: 100%;
    border-radius: var(--fafa-radius-full);
    background: var(--fafa-primary);
  }
  .unit-note {
    margin-top: 8px;
    font-size: 12px;
    color: var(--fafa-muted-foreground);
    line-height: 1.5;
    padding: 0 2px;
  }

  /* 3. 观察卡组（analysis-observations，单卡 + 分隔线） */
  .obs-card {
    background: var(--fafa-card);
    border: 1px solid var(--fafa-border);
    border-radius: var(--fafa-radius-lg);
    padding: 4px 16px;
  }
  .obs-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    min-height: 52px;
    padding: 13px 0;
  }
  .obs-row + .obs-row { border-top: 1px solid var(--fafa-border); }
