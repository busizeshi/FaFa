/* ============================================================
   FaFa · Warm Sage visual system
   保留原有新魏字体、字号和线性图标；以暖色辅助和轻透表面增加层次
   ============================================================ */
:root {
  /* 品牌绿：保留原有鼠尾草主色 */
  --fafa-primary: #5C9E71;
  --fafa-primary-foreground: #FFFFFF;
  --fafa-primary-action: #3E7A52;
  --fafa-primary-action-hover: #326946;
  --fafa-primary-soft: #E6F2E8;
  --fafa-primary-soft-2: #D4EAD9;
  --fafa-primary-soft-foreground: #3E7A52;
  --fafa-primary-tint-border: #C5DFC9;

  /* 页面与文字 */
  --fafa-background: #FAFBF7;
  --fafa-foreground: #293A31;
  --fafa-card: #FFFFFF;
  --fafa-card-foreground: #293A31;
  --fafa-muted: #EEF4EC;
  --fafa-muted-foreground: #65796B;
  --fafa-border: #E2E9DF;
  --fafa-input: #FFFFFF;
  --fafa-ring: #5C9E71;

  /* 辅助色：健康绿、影像雾蓝、AI 薰衣草紫、日常杏橘与暖金 */
  --fafa-accent-coral: #D97B61;
  --fafa-accent-coral-soft: #FFF0EA;
  --fafa-accent-amber: #B77B24;
  --fafa-accent-amber-soft: #FFF4DE;
  --fafa-accent-sky: #4E88A2;
  --fafa-accent-sky-soft: #EAF4F8;
  --fafa-accent-lavender: #7869A6;
  --fafa-accent-lavender-soft: #F1EDFA;
  --fafa-accent-mint: #468B79;
  --fafa-accent-mint-soft: #E8F4EF;

  /* 玻璃表面：不支持 backdrop-filter 时仍有足够不透明度 */
  --fafa-glass-surface: rgba(255, 255, 255, 0.86);
  --fafa-glass-surface-strong: rgba(255, 255, 255, 0.94);
  --fafa-glass-border: rgba(255, 255, 255, 0.88);
  --fafa-gradient-canvas:
    radial-gradient(ellipse at 7% 0%, rgba(244, 194, 138, 0.17), transparent 36%),
    radial-gradient(ellipse at 100% 23%, rgba(140, 197, 179, 0.15), transparent 40%),
    #FAFBF7;
  --fafa-gradient-ai: linear-gradient(128deg, #E8F4E7 0%, #E9F4F2 54%, #F1ECF8 100%);
  --fafa-gradient-sunshine: linear-gradient(135deg, #F4D58A 0%, #F2AD82 53%, #E9967E 100%);
  --fafa-gradient-action: linear-gradient(135deg, #4B8D63 0%, #3E7A52 100%);
  --fafa-gradient-action-hover: linear-gradient(135deg, #3E7A52 0%, #326946 100%);

  /* 圆角刻度：保留现有 4 / 8 / 12 / full 规范 */
  --fafa-radius-sm: 4px;
  --fafa-radius-md: 8px;
  --fafa-radius-lg: 12px;
  --fafa-radius-full: 9999px;

  /* 轻量层次：浅灰绿投影与玻璃高光 */
  --fafa-shadow-sm: 0 2px 6px rgba(41, 58, 49, 0.045);
  --fafa-shadow-md: 0 8px 20px rgba(41, 58, 49, 0.075);
  --fafa-shadow-card: 0 5px 18px rgba(54, 78, 63, 0.055), inset 0 1px 0 rgba(255, 255, 255, 0.9);

  /* 字体保持 fafa-app-design 原有设计，不在本轮替换或嵌入字体文件 */
  --fafa-font-sans: "STXinwei", "华文新魏", "KaiTi", "楷体", "STKaiti", "华文楷体",
    "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
}

body {
  background: var(--fafa-background);
  color: var(--fafa-foreground);
  font-family: var(--fafa-font-sans);
  -webkit-font-smoothing: antialiased;
}

    <style id="fafa-visual-polish">
/* FaFa Warm Sage · glass and semantic color layer
   Keep the existing page DOM, spacing, line-icon shapes and interaction hooks intact. */
html {
  background: var(--fafa-background);
}
html body {
  background: var(--fafa-gradient-canvas) !important;
  color: var(--fafa-foreground);
}
html body .page-frame {
  background: transparent !important;
}

/* Apple-like translucent headers and the existing four-item tab bar.
   Opaque fallback surfaces above stay readable where blur is unavailable. */
html body .appbar,
html body [data-mobile-nav="global"] {
  background: var(--fafa-glass-surface) !important;
  border-color: var(--fafa-glass-border) !important;
  box-shadow: 0 5px 18px rgba(45, 68, 54, 0.045);
}
html body .appbar {
  border-bottom-color: rgba(205, 221, 207, 0.72) !important;
}
html body [data-mobile-nav="global"] {
  border-top-color: rgba(205, 221, 207, 0.72) !important;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html body .appbar,
  html body [data-mobile-nav="global"] {
    -webkit-backdrop-filter: blur(18px) saturate(1.18);
    backdrop-filter: blur(18px) saturate(1.18);
  }
}

/* Card edges retain the original thin-line language with a quiet lift. */
html body .page-frame .page-main [class*="-card"] {
  border-color: var(--fafa-border);
  box-shadow: var(--fafa-shadow-card);
}
html body .page-frame .page-main .ai-card {
  background: var(--fafa-gradient-ai) !important;
  border-color: rgba(197, 223, 201, 0.86) !important;
  box-shadow: 0 10px 26px rgba(69, 117, 87, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.92);
}
html body .page-frame .ai-avatar {
  background: linear-gradient(135deg, #68A77A, #8EBFC0 58%, #9F91C7) !important;
  color: #FFFFFF !important;
  box-shadow: 0 4px 10px rgba(76, 130, 99, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

/* Home quick actions: four calm semantic colors instead of four identical mint icons. */
html body .page-frame .qa-item:nth-child(1) .qa-icon {
  color: var(--fafa-accent-mint);
  background: linear-gradient(145deg, #E8F4EF, #D9EEE4);
}
html body .page-frame .qa-item:nth-child(2) .qa-icon {
  color: var(--fafa-accent-sky);
  background: linear-gradient(145deg, #EDF6FA, #DFEEF5);
}
html body .page-frame .qa-item:nth-child(3) .qa-icon {
  color: var(--fafa-accent-coral);
  background: linear-gradient(145deg, #FFF3EC, #FBE5D9);
}
html body .page-frame .qa-item:nth-child(4) .qa-icon {
  color: var(--fafa-accent-lavender);
  background: linear-gradient(145deg, #F4F0FB, #EAE5F7);
}
html body .page-frame .qa-icon {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92);
}
html body .page-frame .metric-cell:nth-child(1) .metric-icon { color: var(--fafa-accent-amber); }
html body .page-frame .metric-cell:nth-child(2) .metric-icon { color: var(--fafa-accent-sky); }
html body .page-frame .metric-cell:nth-child(3) .metric-icon { color: var(--fafa-accent-coral); }

/* Semantic colors keep the existing Lucide outline icon set, adding meaning through hue. */

/* Frosted input surfaces for search, chat and forms; no dimensions or handlers change. */
html body .page-frame .inputbar,
html body .page-frame .ai-input-row,
html body .page-frame .search-box,
html body .page-frame .search-field,
html body .page-frame .search-wrap,

html body .page-frame input:not([type="checkbox"]):not([type="radio"]),

@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html body .page-frame .inputbar,

  html body .page-frame .search-box,

html body .page-frame input:focus,

<body class="min-h-screen font-sans antialiased">
<style id="critical-layout">
  /* ===== FaFa 日常记录 · 鼠尾草 · 关键静态布局（不依赖 Tailwind 运行时） ===== */
  * { box-sizing: border-box; }
  html { background: var(--fafa-background); }
  body {
    margin: 0;
    background: var(--fafa-background);
    color: var(--fafa-foreground);
    font-family: var(--fafa-font-sans);
    font-size: 13px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p, ol, ul, li { margin: 0; padding: 0; }
  ol, ul { list-style: none; }
  img { display: block; max-width: 100%; }
  button { font-family: inherit; font-size: inherit; border: none; background: transparent; padding: 0; cursor: pointer; color: inherit; }
  a { text-decoration: none; color: inherit; cursor: pointer; }

  /* 警示令牌（页内唯一色相例外，仅用于异常行 / 异常卡 / 浅红点等危险区，全部 var() 引用） */
  :root {
    --fafa-danger: #B4543C;
    --fafa-danger-strong: color-mix(in srgb, var(--fafa-danger) 78%, var(--fafa-foreground));
    --fafa-danger-soft: color-mix(in srgb, var(--fafa-danger) 9%, var(--fafa-card));
    --fafa-danger-tint: color-mix(in srgb, var(--fafa-danger) 30%, var(--fafa-card));
    --fafa-danger-tint-border: color-mix(in srgb, var(--fafa-danger) 42%, var(--fafa-card));
  }

  /* 根框架：移动端文档流，max-width 480px 居中 */
  .page-frame { max-width: 480px; width: 100%; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--fafa-background); }
  .page-main { flex: 1 0 auto; width: 100%; padding: 16px 16px 40px; }
  .page-section { margin: 0 0 24px; }
  .page-section:last-child { margin-bottom: 0; }

  /* A1 二级页顶部应用栏（44px：返回 + 居中标题 + 右侧动作位） */
  .appbar { position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; height: 44px; padding: 0 10px 0 6px; background: var(--fafa-card); border-bottom: 1px solid var(--fafa-border); }
  .appbar-back { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--fafa-radius-md); color: var(--fafa-foreground); }
  .appbar-back svg { width: 22px; height: 22px; }
  .appbar-title { min-width: 0; text-align: center; font-size: 15px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar-action { display: flex; align-items: center; justify-content: flex-end; min-width: 44px; }

  /* 日期 chips（今天 ✓ / 昨天 / 10月5日） */
  .date-chips { display: flex; gap: 8px; }
  .date-chip { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 14px; border-radius: var(--fafa-radius-full); background: var(--fafa-card); border: 1px solid var(--fafa-border); color: var(--fafa-muted-foreground); font-size: 13px; white-space: nowrap; }
  .date-chip svg { width: 13px; height: 13px; }
  .date-chip.is-active { background: var(--fafa-primary-soft); border-color: var(--fafa-primary-tint-border); color: var(--fafa-primary-soft-foreground); font-weight: 600; }

  /* 当日六维度徽标行（单卡 + 分隔线分组） */
  .summary-card { margin-top: 12px; background: var(--fafa-card); border: 1px solid var(--fafa-border); border-radius: var(--fafa-radius-lg); padding: 2px 16px; }
  .dim-row { position: relative; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 0; border-top: 1px solid var(--fafa-border); }
  .dim-row:first-child { border-top: none; }
  .dim-row.is-alert::before { content: ''; position: absolute; left: -16px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--fafa-danger); }
  .dim-ic { flex: none; width: 28px; height: 28px; border-radius: var(--fafa-radius-full); background: var(--fafa-muted); color: var(--fafa-primary); display: inline-flex; align-items: center; justify-content: center; }
  .dim-ic svg { width: 15px; height: 15px; }
  .dim-row.is-alert .dim-ic { background: var(--fafa-danger-soft); color: var(--fafa-danger); }
  .dim-name { flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 600; }
  .dim-chip { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: var(--fafa-radius-full); font-size: 12px; white-space: nowrap; }
  .dim-chip svg { width: 12px; height: 12px; }
  .chip-ok { background: var(--fafa-primary-soft); color: var(--fafa-primary-soft-foreground); }
  .chip-warn { background: var(--fafa-danger-soft); border: 1px solid var(--fafa-danger-tint-border); color: var(--fafa-danger-strong); }
  .chip-plain { background: var(--fafa-muted); color: var(--fafa-foreground); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* 异常区：浅红边卡 */
  .alert-card { background: var(--fafa-danger-soft); border: 1px solid var(--fafa-danger-tint-border); border-radius: var(--fafa-radius-lg); padding: 14px 16px; }
  .alert-head { display: flex; align-items: center; gap: 8px; }
  .alert-head svg { flex: none; width: 17px; height: 17px; color: var(--fafa-danger); }
  .alert-title { min-width: 0; font-size: 14px; font-weight: 600; color: var(--fafa-danger-strong); }
  .alert-advice { margin-top: 8px; font-size: 13px; line-height: 1.6; color: var(--fafa-foreground); }
  .adv-label { margin-right: 6px; color: var(--fafa-danger-strong); font-weight: 600; }

  /* 备注列表 */
  .notes-card { margin-top: 12px; background: var(--fafa-card); border: 1px solid var(--fafa-border); border-radius: var(--fafa-radius-lg); padding: 2px 16px; }
  .notes-head { display: flex; align-items: center; min-height: 44px; }
  .notes-title { font-size: 14px; font-weight: 600; }
  .note-item { display: flex; align-items: center; min-height: 48px; padding: 10px 0; border-top: 1px solid var(--fafa-border); font-size: 13px; line-height: 1.55; color: var(--fafa-foreground); }

  /* 体重区块：信息-动作双列（信息侧伸缩、动作侧固定） */
  .weight-card { background: var(--fafa-card); border: 1px solid var(--fafa-border); border-radius: var(--fafa-radius-lg); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .weight-info { flex: 1 1 auto; min-width: 0; }
  .weight-label { font-size: 12px; color: var(--fafa-muted-foreground); }
  .weight-value { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; }
  .w-num { font-size: 20px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .w-unit { font-size: 12px; color: var(--fafa-muted-foreground); }
  .w-trend { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; color: var(--fafa-primary-soft-foreground); white-space: nowrap; }
  .weight-cta { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: var(--fafa-radius-full); background: var(--fafa-primary); color: var(--fafa-primary-foreground); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .weight-cta svg { width: 14px; height: 14px; }

  /* 近 7 日迷你条 */
  .week-card { margin-top: 12px; background: var(--fafa-card); border: 1px solid var(--fafa-border); border-radius: var(--fafa-radius-lg); padding: 14px 16px 16px; }
  .week-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .week-title { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
  .week-title svg { width: 14px; height: 14px; color: var(--fafa-primary); }
  .week-range { font-size: 11px; color: var(--fafa-muted-foreground); white-space: nowrap; }
  .week-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 14px; }
  .week-day { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; }
  .week-dot { width: 10px; height: 10px; border-radius: var(--fafa-radius-full); background: var(--fafa-primary); }
  .week-dot.is-warn { background: var(--fafa-danger-tint); border: 1px solid var(--fafa-danger-tint-border); }
  .week-date { font-size: 11px; color: var(--fafa-muted-foreground); white-space: nowrap; }
  .week-day.is-today .week-date { color: var(--fafa-foreground); font-weight: 600; }

  /* 交互状态：CSS transition 0.15s 级，触控设备禁用 hover 过渡，reduced-motion 降级 */
  .appbar-back, .date-chip, .weight-cta { transition: background-color 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.15s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .weight-cta svg { transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @media (hover: hover) {

    .weight-cta:hover { background: var(--fafa-primary-soft-foreground); }
    .weight-cta:hover svg { transform: translateY(1px); }
  }
  .appbar-back:focus-visible, .date-chip:focus-visible, .weight-cta:focus-visible { outline: 2px solid var(--fafa-ring); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .appbar-back, .date-chip, .weight-cta, .weight-cta svg { transition-duration: 0.01ms; }
  }
