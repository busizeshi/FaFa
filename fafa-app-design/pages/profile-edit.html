/* ============================================================
   FaFa · Warm Sage visual system
   保留原有新魏字体、字号和线性图标；以暖色辅助和轻透表面增加层次
   ============================================================ */
:root {
  /* 品牌绿：保留原有鼠尾草主色 */
  --fafa-primary: #5C9E71;
  --fafa-primary-foreground: #FFFFFF;
  --fafa-primary-action: #3E7A52;
  --fafa-primary-action-hover: #326946;
  --fafa-primary-soft: #E6F2E8;
  --fafa-primary-soft-2: #D4EAD9;
  --fafa-primary-soft-foreground: #3E7A52;
  --fafa-primary-tint-border: #C5DFC9;

  /* 页面与文字 */
  --fafa-background: #FAFBF7;
  --fafa-foreground: #293A31;
  --fafa-card: #FFFFFF;
  --fafa-card-foreground: #293A31;
  --fafa-muted: #EEF4EC;
  --fafa-muted-foreground: #65796B;
  --fafa-border: #E2E9DF;
  --fafa-input: #FFFFFF;
  --fafa-ring: #5C9E71;

  /* 辅助色：健康绿、影像雾蓝、AI 薰衣草紫、日常杏橘与暖金 */
  --fafa-accent-coral: #D97B61;
  --fafa-accent-coral-soft: #FFF0EA;
  --fafa-accent-amber: #B77B24;
  --fafa-accent-amber-soft: #FFF4DE;
  --fafa-accent-sky: #4E88A2;
  --fafa-accent-sky-soft: #EAF4F8;
  --fafa-accent-lavender: #7869A6;
  --fafa-accent-lavender-soft: #F1EDFA;
  --fafa-accent-mint: #468B79;
  --fafa-accent-mint-soft: #E8F4EF;

  /* 玻璃表面：不支持 backdrop-filter 时仍有足够不透明度 */
  --fafa-glass-surface: rgba(255, 255, 255, 0.86);
  --fafa-glass-surface-strong: rgba(255, 255, 255, 0.94);
  --fafa-glass-border: rgba(255, 255, 255, 0.88);
  --fafa-gradient-canvas:
    radial-gradient(ellipse at 7% 0%, rgba(244, 194, 138, 0.17), transparent 36%),
    radial-gradient(ellipse at 100% 23%, rgba(140, 197, 179, 0.15), transparent 40%),
    #FAFBF7;
  --fafa-gradient-ai: linear-gradient(128deg, #E8F4E7 0%, #E9F4F2 54%, #F1ECF8 100%);
  --fafa-gradient-sunshine: linear-gradient(135deg, #F4D58A 0%, #F2AD82 53%, #E9967E 100%);
  --fafa-gradient-action: linear-gradient(135deg, #4B8D63 0%, #3E7A52 100%);
  --fafa-gradient-action-hover: linear-gradient(135deg, #3E7A52 0%, #326946 100%);

  /* 圆角刻度：保留现有 4 / 8 / 12 / full 规范 */
  --fafa-radius-sm: 4px;
  --fafa-radius-md: 8px;
  --fafa-radius-lg: 12px;
  --fafa-radius-full: 9999px;

  /* 轻量层次：浅灰绿投影与玻璃高光 */
  --fafa-shadow-sm: 0 2px 6px rgba(41, 58, 49, 0.045);
  --fafa-shadow-md: 0 8px 20px rgba(41, 58, 49, 0.075);
  --fafa-shadow-card: 0 5px 18px rgba(54, 78, 63, 0.055), inset 0 1px 0 rgba(255, 255, 255, 0.9);

  /* 字体保持 fafa-app-design 原有设计，不在本轮替换或嵌入字体文件 */
  --fafa-font-sans: "STXinwei", "华文新魏", "KaiTi", "楷体", "STKaiti", "华文楷体",
    "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
}

body {
  background: var(--fafa-background);
  color: var(--fafa-foreground);
  font-family: var(--fafa-font-sans);
  -webkit-font-smoothing: antialiased;
}

    <style id="fafa-visual-polish">
/* FaFa Warm Sage · glass and semantic color layer
   Keep the existing page DOM, spacing, line-icon shapes and interaction hooks intact. */
html {
  background: var(--fafa-background);
}
html body {
  background: var(--fafa-gradient-canvas) !important;
  color: var(--fafa-foreground);
}
html body .page-frame {
  background: transparent !important;
}

/* Apple-like translucent headers and the existing four-item tab bar.
   Opaque fallback surfaces above stay readable where blur is unavailable. */
html body .appbar,
html body [data-mobile-nav="global"] {
  background: var(--fafa-glass-surface) !important;
  border-color: var(--fafa-glass-border) !important;
  box-shadow: 0 5px 18px rgba(45, 68, 54, 0.045);
}
html body .appbar {
  border-bottom-color: rgba(205, 221, 207, 0.72) !important;
}
html body [data-mobile-nav="global"] {
  border-top-color: rgba(205, 221, 207, 0.72) !important;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html body .appbar,
  html body [data-mobile-nav="global"] {
    -webkit-backdrop-filter: blur(18px) saturate(1.18);
    backdrop-filter: blur(18px) saturate(1.18);
  }
}

/* Card edges retain the original thin-line language with a quiet lift. */
html body .page-frame .page-main [class*="-card"] {
  border-color: var(--fafa-border);
  box-shadow: var(--fafa-shadow-card);
}
html body .page-frame .page-main .ai-card {
  background: var(--fafa-gradient-ai) !important;
  border-color: rgba(197, 223, 201, 0.86) !important;
  box-shadow: 0 10px 26px rgba(69, 117, 87, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.92);
}
html body .page-frame .ai-avatar {
  background: linear-gradient(135deg, #68A77A, #8EBFC0 58%, #9F91C7) !important;
  color: #FFFFFF !important;
  box-shadow: 0 4px 10px rgba(76, 130, 99, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

/* Home quick actions: four calm semantic colors instead of four identical mint icons. */
html body .page-frame .qa-item:nth-child(1) .qa-icon {
  color: var(--fafa-accent-mint);
  background: linear-gradient(145deg, #E8F4EF, #D9EEE4);
}
html body .page-frame .qa-item:nth-child(2) .qa-icon {
  color: var(--fafa-accent-sky);
  background: linear-gradient(145deg, #EDF6FA, #DFEEF5);
}
html body .page-frame .qa-item:nth-child(3) .qa-icon {
  color: var(--fafa-accent-coral);
  background: linear-gradient(145deg, #FFF3EC, #FBE5D9);
}
html body .page-frame .qa-item:nth-child(4) .qa-icon {
  color: var(--fafa-accent-lavender);
  background: linear-gradient(145deg, #F4F0FB, #EAE5F7);
}
html body .page-frame .qa-icon {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92);
}
html body .page-frame .metric-cell:nth-child(1) .metric-icon { color: var(--fafa-accent-amber); }
html body .page-frame .metric-cell:nth-child(2) .metric-icon { color: var(--fafa-accent-sky); }
html body .page-frame .metric-cell:nth-child(3) .metric-icon { color: var(--fafa-accent-coral); }

/* Semantic colors keep the existing Lucide outline icon set, adding meaning through hue. */
html body .page-frame [data-lucide="heart"],
html body .page-frame [data-lucide="heart-pulse"],
html body .page-frame [data-lucide="stethoscope"],
html body .page-frame [data-lucide="pill"],
html body .page-frame [data-lucide="syringe"],
html body .page-frame [data-lucide="thermometer"],

}
html body .page-frame [data-lucide="image"],
html body .page-frame [data-lucide="images"],
html body .page-frame [data-lucide="camera"],
html body .page-frame [data-lucide="scan-line"],
html body .page-frame [data-lucide="search"],
html body .page-frame [data-lucide="gallery-horizontal"] {

}
html body .page-frame [data-lucide="sparkles"],
html body .page-frame [data-lucide="bot"],

}

/* Existing primary action geometry stays intact; deepen green under white labels. */
html body .page-frame .btn-hero,
html body .page-frame .btn-primary,
html body .page-frame .btn-submit,
html body .page-frame .btn-pill-primary,
html body .page-frame .btn-mid,
html body .page-frame .inputbar-send,
html body .page-frame .ai-send {
  background: var(--fafa-gradient-action) !important;

}
html body .page-frame .btn-hero:hover,
html body .page-frame .btn-primary:hover,
html body .page-frame .btn-submit:hover,
html body .page-frame .btn-pill-primary:hover,
html body .page-frame .btn-mid:hover,
html body .page-frame .inputbar-send:hover,
html body .page-frame .ai-send:hover {
  background: var(--fafa-gradient-action-hover) !important;
}
html body .page-frame .chip.is-active {
  background: var(--fafa-gradient-action) !important;
  border-color: var(--fafa-primary-action) !important;
}

/* AI conversation keeps its original bubble geometry with a richer brand-green surface. */
html body .page-frame .msg-user .bubble {
  background: var(--fafa-gradient-action) !important;
  color: #FFFFFF !important;
}

/* Frosted input surfaces for search, chat and forms; no dimensions or handlers change. */
html body .page-frame .inputbar,
html body .page-frame .ai-input-row,
html body .page-frame .search-box,
html body .page-frame .search-field,
html body .page-frame .search-wrap,
html body .page-frame .tab-hero-btn,
html body .page-frame .appbar-pill,
html body .page-frame .ask-chip,
html body .page-frame input:not([type="checkbox"]):not([type="radio"]),
html body .page-frame select,
html body .page-frame textarea {
  background-color: var(--fafa-glass-surface-strong);
  border-color: rgba(197, 215, 199, 0.82);
  box-shadow: 0 2px 10px rgba(55, 81, 64, 0.045), inset 0 1px 0 rgba(255, 255, 255, 0.92);
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html body .page-frame .inputbar,
  html body .page-frame .ai-input-row,
  html body .page-frame .search-box,
  html body .page-frame .search-field,
  html body .page-frame .search-wrap,
  html body .page-frame .tab-hero-btn,
  html body .page-frame .appbar-pill,
  html body .page-frame .ask-chip {
    -webkit-backdrop-filter: blur(14px) saturate(1.15);
    backdrop-filter: blur(14px) saturate(1.15);
  }
}
html body .page-frame input:focus,
html body .page-frame select:focus,
html body .page-frame textarea:focus {
  border-color: var(--fafa-primary) !important;
  box-shadow: 0 0 0 3px rgba(92, 158, 113, 0.13);
}

    </style>

<body class="min-h-screen font-sans antialiased">
    <style id="critical-layout">
* { box-sizing: border-box; margin: 0; padding: 0; }
img { display: block; max-width: 100%; }
.page-frame { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.page-main { flex: 1; padding: 20px 16px 36px; }
.page-section { margin: 0 0 24px; }
.page-section.last { margin-bottom: 8px; }
.card { background: var(--fafa-card); border: 1px solid var(--fafa-border); border-radius: var(--fafa-radius-lg); padding: 16px; box-shadow: var(--fafa-shadow-sm); }
.appbar { position: sticky; top: 0; z-index: 30; height: 44px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; background: var(--fafa-background); }
.appbar-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--fafa-foreground); border-radius: var(--fafa-radius-full); }
.appbar-btn svg { width: 22px; height: 22px; }
.appbar-title { text-align: center; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar-slot { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; }
a, button, input, label { font-family: inherit; color: inherit; text-decoration: none; }
a, button { transition: background-color 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.15s cubic-bezier(0.2, 0.8, 0.2, 1); }
:focus-visible { outline: 2px solid var(--fafa-ring); outline-offset: 2px; }
.avatar-card { display: flex; align-items: center; gap: 14px; }
.edit-avatar { position: relative; flex-shrink: 0; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; background: var(--fafa-primary-soft); border: 1px solid var(--fafa-primary-tint-border); border-radius: var(--fafa-radius-full); color: var(--fafa-primary); }
.edit-avatar > svg { width: 28px; height: 28px; }
.avatar-badge { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; background: var(--fafa-primary); color: var(--fafa-primary-foreground); border: 2px solid var(--fafa-card); border-radius: var(--fafa-radius-full); }
.avatar-badge svg { width: 11px; height: 11px; }
.avatar-meta { flex: 1; min-width: 0; }
.avatar-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 14px; background: var(--fafa-primary-soft); border: 1px solid var(--fafa-primary-tint-border); border-radius: var(--fafa-radius-full); font-size: 13px; color: var(--fafa-primary-soft-foreground); cursor: pointer; }
.avatar-btn svg { width: 15px; height: 15px; }
.avatar-input { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.avatar-hint { display: block; margin-top: 8px; font-size: 12px; color: var(--fafa-muted-foreground); }
.field + .field { margin-top: 16px; }
.field-label { display: flex; align-items: baseline; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; margin-bottom: 8px; }
.field-input { width: 100%; min-height: 44px; padding: 0 14px; background: var(--fafa-input); border: 1px solid var(--fafa-border); border-radius: var(--fafa-radius-md); font-family: inherit; font-size: 14px; color: var(--fafa-foreground); }
.field-input::placeholder { color: var(--fafa-muted-foreground); }
.field-input:focus { outline: none; border-color: var(--fafa-ring); box-shadow: 0 0 0 3px var(--fafa-primary-soft-2); }
.field-hint { margin-top: 6px; font-size: 12px; color: var(--fafa-muted-foreground); }
.gender-row { display: flex; gap: 8px; }
.gender-chip { position: relative; flex: 1; cursor: pointer; }
.gender-chip input { position: absolute; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.gender-chip span { display: flex; align-items: center; justify-content: center; min-height: 40px; background: var(--fafa-input); border: 1px solid var(--fafa-border); border-radius: var(--fafa-radius-md); font-size: 13px; color: var(--fafa-muted-foreground); }
.gender-chip input:checked + span { background: var(--fafa-primary-soft); border-color: var(--fafa-primary-tint-border); color: var(--fafa-primary-soft-foreground); font-weight: 600; }
.gender-chip input:focus-visible + span { outline: 2px solid var(--fafa-ring); outline-offset: 2px; }
.save-btn { width: 100%; min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--fafa-primary); color: var(--fafa-primary-foreground); border: none; border-radius: var(--fafa-radius-full); font-size: 16px; letter-spacing: 0.06em; cursor: pointer; box-shadow: var(--fafa-shadow-sm); }
.save-btn svg { width: 20px; height: 20px; }
.form-feedback { margin-top: 12px; padding: 10px 14px; background: var(--fafa-primary-soft); border: 1px solid var(--fafa-primary-tint-border); border-radius: var(--fafa-radius-md); font-size: 12px; line-height: 1.7; color: var(--fafa-primary-soft-foreground); }
.submit-note { margin-top: 10px; text-align: center; font-size: 12px; color: var(--fafa-muted-foreground); }
@media (hover: hover) {
  .appbar-btn:hover { background: var(--fafa-muted); }
  .avatar-btn:hover { filter: brightness(0.98); }
  .save-btn:hover { filter: brightness(0.96); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>

              <span class="avatar-meta">
                <label class="avatar-btn" for="avatar-file" data-dom-id="edit-avatar-btn"><i data-lucide="image"></i>更换头像</label>
                <input class="avatar-input" type="file" name="file" id="avatar-file" accept="image/jpeg, image/png">
                <span class="avatar-hint">支持 JPG / PNG，不超过 5MB</span>
              </span>
            </div>
          </section>
          <section class="page-section" id="edit-fields" data-dom-id="edit-fields">
            <div class="card">
              <div class="field">
                <label class="field-label" for="f-nickname">昵称</label>
                <input class="field-input" type="text" id="f-nickname" name="nickname" value="FaFa 家长" maxlength="50" data-dom-id="edit-field-nickname">
                <p class="field-hint">1-50 个字符，将展示给家庭成员</p>
              </div>
              <div class="field">
                <label class="field-label" for="f-phone">手机号</label>
                <input class="field-input" type="tel" id="f-phone" name="phone" placeholder="请输入 11 位手机号" maxlength="11" inputmode="numeric" data-dom-id="edit-field-phone">
                <p class="field-hint">账号登录手机号，仅用于安全验证</p>
              </div>
              <div class="field">
                <span class="field-label" id="gender-label">性别</span>
                <div class="gender-row" role="radiogroup" aria-labelledby="gender-label">
                  <label class="gender-chip"><input type="radio" name="gender" value="male" data-dom-id="edit-gender-male"><span>男</span></label>
                  <label class="gender-chip"><input type="radio" name="gender" value="female" data-dom-id="edit-gender-female"><span>女</span></label>
                  <label class="gender-chip"><input type="radio" name="gender" value="secret" checked data-dom-id="edit-gender-secret"><span>保密</span></label>
                </div>
              </div>
              <div class="field">
                <label class="field-label" for="f-age">年龄</label>
                <input class="field-input" type="number" id="f-age" name="age" placeholder="请输入年龄" min="0" max="150" inputmode="numeric" data-dom-id="edit-field-age">
                <p class="field-hint">0-150 之间的整数</p>
              </div>
              <div class="field">
                <label class="field-label" for="f-city">城市</label>
                <input class="field-input" type="text" id="f-city" name="city" placeholder="如：杭州" maxlength="50" data-dom-id="edit-field-city">
                <p class="field-hint">最多 50 个字符</p>
              </div>
            </div>
          </section>
          <section class="page-section last" id="edit-submit" data-dom-id="edit-submit">
            <button class="save-btn" type="button" data-dom-id="edit-save">
              <i data-lucide="check"></i>
              <span>保存修改</span>
            </button>
            <p class="form-feedback" data-dom-id="edit-error" hidden>保存失败：1001 昵称需为 1-50 个字符 · 1002 手机号格式不正确 · 1004 年龄需在 0-150 之间</p>
            <p class="submit-note">保存后将同步至家庭成员共享的照料信息</p>
          </section>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
