:root {

  --fafa-background: #FAFBF7;
  --fafa-foreground: #293A31;
  --fafa-card: #FFFFFF;
  --fafa-card-foreground: #293A31;
  --fafa-muted: #EEF4EC;
  --fafa-muted-foreground: #65796B;
  --fafa-border: #E2E9DF;
  --fafa-input: #FFFFFF;
  --fafa-ring: #5C9E71;

  /* 辅助色：健康绿、影像雾蓝、AI 薰衣草紫、日常杏橘与暖金 */
  --fafa-accent-coral: #D97B61;
  --fafa-accent-coral-soft: #FFF0EA;
  --fafa-accent-amber: #B77B24;
  --fafa-accent-amber-soft: #FFF4DE;
  --fafa-accent-sky: #4E88A2;
  --fafa-accent-sky-soft: #EAF4F8;
  --fafa-accent-lavender: #7869A6;
  --fafa-accent-lavender-soft: #F1EDFA;
  --fafa-accent-mint: #468B79;
  --fafa-accent-mint-soft: #E8F4EF;

  /* 玻璃表面：不支持 backdrop-filter 时仍有足够不透明度 */
  --fafa-glass-surface: rgba(255, 255, 255, 0.86);
  --fafa-glass-surface-strong: rgba(255, 255, 255, 0.94);
  --fafa-glass-border: rgba(255, 255, 255, 0.88);
  --fafa-gradient-canvas:
    radial-gradient(ellipse at 7% 0%, rgba(244, 194, 138, 0.17), transparent 36%),
    radial-gradient(ellipse at 100% 23%, rgba(140, 197, 179, 0.15), transparent 40%),
    #FAFBF7;
  --fafa-gradient-ai: linear-gradient(128deg, #E8F4E7 0%, #E9F4F2 54%, #F1ECF8 100%);
  --fafa-gradient-sunshine: linear-gradient(135deg, #F4D58A 0%, #F2AD82 53%, #E9967E 100%);
  --fafa-gradient-action: linear-gradient(135deg, #4B8D63 0%, #3E7A52 100%);
  --fafa-gradient-action-hover: linear-gradient(135deg, #3E7A52 0%, #326946 100%);

  /* 圆角刻度：保留现有 4 / 8 / 12 / full 规范 */
  --fafa-radius-sm: 4px;
  --fafa-radius-md: 8px;
  --fafa-radius-lg: 12px;
  --fafa-radius-full: 9999px;

  /* 轻量层次：浅灰绿投影与玻璃高光 */
  --fafa-shadow-sm: 0 2px 6px rgba(41, 58, 49, 0.045);
  --fafa-shadow-md: 0 8px 20px rgba(41, 58, 49, 0.075);
  --fafa-shadow-card: 0 5px 18px rgba(54, 78, 63, 0.055), inset 0 1px 0 rgba(255, 255, 255, 0.9);

  /* 字体保持 fafa-app-design 原有设计，不在本轮替换或嵌入字体文件 */
  --fafa-font-sans: "STXinwei", "华文新魏", "KaiTi", "楷体", "STKaiti", "华文楷体",
    "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
}

body {
  background: var(--fafa-background);
  color: var(--fafa-foreground);
  font-family: var(--fafa-font-sans);
  -webkit-font-smoothing: antialiased;
}

    <style id="fafa-visual-polish">
/* FaFa Warm Sage · glass and semantic color layer
   Keep the existing page DOM, spacing, line-icon shapes and interaction hooks intact. */
html {
  background: var(--fafa-background);
}
html body {
  background: var(--fafa-gradient-canvas) !important;
  color: var(--fafa-foreground);
}
html body .page-frame {
  background: transparent !important;
}

/* Apple-like translucent headers and the existing four-item tab bar.
   Opaque fallback surfaces above stay readable where blur is unavailable. */
html body .appbar,
html body [data-mobile-nav="global"] {
  background: var(--fafa-glass-surface) !important;
  border-color: var(--fafa-glass-border) !important;
  box-shadow: 0 5px 18px rgba(45, 68, 54, 0.045);
}
html body .appbar {
  border-bottom-color: rgba(205, 221, 207, 0.72) !important;
}
html body [data-mobile-nav="global"] {
  border-top-color: rgba(205, 221, 207, 0.72) !important;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html body .appbar,
  html body [data-mobile-nav="global"] {
    -webkit-backdrop-filter: blur(18px) saturate(1.18);
    backdrop-filter: blur(18px) saturate(1.18);
  }
}

/* Card edges retain the original thin-line language with a quiet lift. */
html body .page-frame .page-main [class*="-card"] {
  border-color: var(--fafa-border);
  box-shadow: var(--fafa-shadow-card);
}
html body .page-frame .page-main .ai-card {
  background: var(--fafa-gradient-ai) !important;
  border-color: rgba(197, 223, 201, 0.86) !important;
  box-shadow: 0 10px 26px rgba(69, 117, 87, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.92);
}
html body .page-frame .ai-avatar {
  background: linear-gradient(135deg, #68A77A, #8EBFC0 58%, #9F91C7) !important;
  color: #FFFFFF !important;
  box-shadow: 0 4px 10px rgba(76, 130, 99, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

/* Home quick actions: four calm semantic colors instead of four identical mint icons. */
html body .page-frame .qa-item:nth-child(1) .qa-icon {
  color: var(--fafa-accent-mint);
  background: linear-gradient(145deg, #E8F4EF, #D9EEE4);
}
html body .page-frame .qa-item:nth-child(2) .qa-icon {
  color: var(--fafa-accent-sky);
  background: linear-gradient(145deg, #EDF6FA, #DFEEF5);
}

  color: var(--fafa-accent-coral);
  background: linear-gradient(145deg, #FFF3EC, #FBE5D9);

  color: var(--fafa-accent-lavender);
  background: linear-gradient(145deg, #F4F0FB, #EAE5F7);

  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92);

/* Semantic colors keep the existing Lucide outline icon set, adding meaning through hue. */

/* Existing primary action geometry stays intact; deepen green under white labels. */

html body .page-frame .inputbar,

@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {

    <style id="critical-layout">
* { box-sizing: border-box; margin: 0; padding: 0; }
img { display: block; max-width: 100%; }
.page-frame { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.page-main { flex: 1; padding: 16px 16px 40px; }
.page-section { margin: 0 0 24px; }
.page-section.last { margin-bottom: 8px; }
.card { background: var(--fafa-card); border: 1px solid var(--fafa-border); border-radius: var(--fafa-radius-lg); padding: 16px; box-shadow: var(--fafa-shadow-sm); }
a, button { font-family: inherit; color: inherit; text-decoration: none; transition: background-color 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.15s cubic-bezier(0.2, 0.8, 0.2, 1); }
:focus-visible { outline: 2px solid var(--fafa-ring); outline-offset: 2px; }
.page-title { font-size: 24px; font-weight: 600; letter-spacing: 0.02em; margin-bottom: 14px; }
.profile-card { display: flex; align-items: center; gap: 14px; }
.profile-avatar { flex-shrink: 0; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: var(--fafa-primary-soft); border: 1px solid var(--fafa-primary-tint-border); border-radius: var(--fafa-radius-full); color: var(--fafa-primary); }
.profile-avatar svg { width: 26px; height: 26px; }
.profile-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.profile-name { font-size: 17px; font-weight: 600; }
.profile-sub { font-size: 12px; color: var(--fafa-muted-foreground); }
.section-title { font-size: 13px; font-weight: 600; color: var(--fafa-muted-foreground); letter-spacing: 0.04em; margin-bottom: 10px; }
.pet-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--fafa-card); border: 1px solid var(--fafa-border); border-radius: var(--fafa-radius-lg); box-shadow: var(--fafa-shadow-sm); }
.pet-row + .pet-row { margin-top: 10px; }
.pet-row-img { flex-shrink: 0; width: 44px; height: 44px; object-fit: cover; border-radius: var(--fafa-radius-md); border: 1px solid var(--fafa-border); }
.pet-row-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pet-row-name { font-size: 14px; font-weight: 600; }
.pet-row-sub { font-size: 12px; color: var(--fafa-muted-foreground); }
.current-badge { display: inline-flex; padding: 3px 10px; background: var(--fafa-primary); color: var(--fafa-primary-foreground); font-size: 11px; border-radius: var(--fafa-radius-full); white-space: nowrap; }
.pets-manage { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 13px 14px; background: var(--fafa-primary-soft); border: 1px solid var(--fafa-primary-tint-border); border-radius: var(--fafa-radius-lg); color: var(--fafa-primary-soft-foreground); font-size: 14px; font-weight: 600; }
.pets-manage svg { width: 18px; height: 18px; flex-shrink: 0; }
.pets-manage-label { flex: 1; min-width: 0; text-align: left; }
.service-row { display: flex; align-items: center; gap: 12px; }
.service-row + .service-row { margin-top: 12px; }
.service-icon { flex-shrink: 0; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: var(--fafa-primary-soft); border-radius: var(--fafa-radius-md); color: var(--fafa-primary-soft-foreground); }
.service-icon svg { width: 19px; height: 19px; }
.service-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.service-name { font-size: 14px; }
.service-desc { font-size: 12px; color: var(--fafa-muted-foreground); }
.row-chevron { flex-shrink: 0; width: 18px; height: 18px; color: var(--fafa-muted-foreground); }
@media (hover: hover) {
  .service-row:hover { border-color: var(--fafa-primary-tint-border); }
  .pets-manage:hover { background: var(--fafa-primary-soft-2); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
