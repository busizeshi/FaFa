/* ============================================================
   FaFa · Warm Sage visual system
   保留原有新魏字体、字号和线性图标；以暖色辅助和轻透表面增加层次
   ============================================================ */
:root {
  /* 品牌绿：保留原有鼠尾草主色 */
  --fafa-primary: #5C9E71;
  --fafa-primary-foreground: #FFFFFF;
  --fafa-primary-action: #3E7A52;
  --fafa-primary-action-hover: #326946;
  --fafa-primary-soft: #E6F2E8;
  --fafa-primary-soft-2: #D4EAD9;
  --fafa-primary-soft-foreground: #3E7A52;
  --fafa-primary-tint-border: #C5DFC9;

  /* 页面与文字 */
  --fafa-background: #FAFBF7;
  --fafa-foreground: #293A31;
  --fafa-card: #FFFFFF;
  --fafa-card-foreground: #293A31;
  --fafa-muted: #EEF4EC;
  --fafa-muted-foreground: #65796B;
  --fafa-border: #E2E9DF;
  --fafa-input: #FFFFFF;
  --fafa-ring: #5C9E71;

  /* 辅助色：健康绿、影像雾蓝、AI 薰衣草紫、日常杏橘与暖金 */
  --fafa-accent-coral: #D97B61;
  --fafa-accent-coral-soft: #FFF0EA;
  --fafa-accent-amber: #B77B24;
  --fafa-accent-amber-soft: #FFF4DE;
  --fafa-accent-sky: #4E88A2;
  --fafa-accent-sky-soft: #EAF4F8;
  --fafa-accent-lavender: #7869A6;
  --fafa-accent-lavender-soft: #F1EDFA;
  --fafa-accent-mint: #468B79;
  --fafa-accent-mint-soft: #E8F4EF;

  /* 玻璃表面：不支持 backdrop-filter 时仍有足够不透明度 */
  --fafa-glass-surface: rgba(255, 255, 255, 0.86);
  --fafa-glass-surface-strong: rgba(255, 255, 255, 0.94);
  --fafa-glass-border: rgba(255, 255, 255, 0.88);
  --fafa-gradient-canvas:
    radial-gradient(ellipse at 7% 0%, rgba(244, 194, 138, 0.17), transparent 36%),
    radial-gradient(ellipse at 100% 23%, rgba(140, 197, 179, 0.15), transparent 40%),
    #FAFBF7;
  --fafa-gradient-ai: linear-gradient(128deg, #E8F4E7 0%, #E9F4F2 54%, #F1ECF8 100%);
  --fafa-gradient-sunshine: linear-gradient(135deg, #F4D58A 0%, #F2AD82 53%, #E9967E 100%);
  --fafa-gradient-action: linear-gradient(135deg, #4B8D63 0%, #3E7A52 100%);
  --fafa-gradient-action-hover: linear-gradient(135deg, #3E7A52 0%, #326946 100%);

  /* 圆角刻度：保留现有 4 / 8 / 12 / full 规范 */
  --fafa-radius-sm: 4px;
  --fafa-radius-md: 8px;
  --fafa-radius-lg: 12px;
  --fafa-radius-full: 9999px;

  /* 轻量层次：浅灰绿投影与玻璃高光 */
  --fafa-shadow-sm: 0 2px 6px rgba(41, 58, 49, 0.045);
  --fafa-shadow-md: 0 8px 20px rgba(41, 58, 49, 0.075);
  --fafa-shadow-card: 0 5px 18px rgba(54, 78, 63, 0.055), inset 0 1px 0 rgba(255, 255, 255, 0.9);

  /* 字体保持 fafa-app-design 原有设计，不在本轮替换或嵌入字体文件 */
  --fafa-font-sans: "STXinwei", "华文新魏", "KaiTi", "楷体", "STKaiti", "华文楷体",
    "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
}

body {
  background: var(--fafa-background);
  color: var(--fafa-foreground);
  font-family: var(--fafa-font-sans);
  -webkit-font-smoothing: antialiased;
}

    </style>

    <style id="fafa-visual-polish">
/* FaFa Warm Sage · glass and semantic color layer
   Keep the existing page DOM, spacing, line-icon shapes and interaction hooks intact. */
html {
  background: var(--fafa-background);
}
html body {
  background: var(--fafa-gradient-canvas) !important;
  color: var(--fafa-foreground);
}
html body .page-frame {
  background: transparent !important;
}

/* Apple-like translucent headers and the existing four-item tab bar.
   Opaque fallback surfaces above stay readable where blur is unavailable. */
html body .appbar,
html body [data-mobile-nav="global"] {
  background: var(--fafa-glass-surface) !important;
  border-color: var(--fafa-glass-border) !important;
  box-shadow: 0 5px 18px rgba(45, 68, 54, 0.045);
}
html body .appbar {
  border-bottom-color: rgba(205, 221, 207, 0.72) !important;
}
html body [data-mobile-nav="global"] {
  border-top-color: rgba(205, 221, 207, 0.72) !important;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  html body .appbar,
  html body [data-mobile-nav="global"] {
    -webkit-backdrop-filter: blur(18px) saturate(1.18);
    backdrop-filter: blur(18px) saturate(1.18);
  }
}

/* Card edges retain the original thin-line language with a quiet lift. */

<body class="min-h-screen font-sans antialiased">
    <style id="critical-layout">
  /* ===== FaFa 提醒中心 · 鼠尾草 · 关键静态布局（不依赖 Tailwind 运行时） ===== */
  * { box-sizing: border-box; }
  html { background: var(--fafa-background); }
  body {
    margin: 0;
    background: var(--fafa-background);
    color: var(--fafa-foreground);
    font-family: var(--fafa-font-sans);
    font-size: 13px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p, ol, ul, li { margin: 0; padding: 0; }
  ol, ul { list-style: none; }
  img { display: block; max-width: 100%; }
  button { font-family: inherit; font-size: inherit; border: none; background: transparent; padding: 0; cursor: pointer; color: inherit; }
  a { text-decoration: none; color: inherit; cursor: pointer; }

  /* 根框架：移动端文档流，max-width 480px 居中 */
  .page-frame { max-width: 480px; width: 100%; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--fafa-background); }
  .page-main { flex: 1 0 auto; width: 100%; padding: 16px 16px 40px; }
  .page-section { margin: 0 0 24px; }
  .page-section:last-child { margin-bottom: 0; }

  /* A1 二级页顶部应用栏（44px：返回 + 居中标题 + 右侧动作位） */
  .appbar { position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; height: 44px; padding: 0 10px 0 6px; background: var(--fafa-card); border-bottom: 1px solid var(--fafa-border); }
  .appbar-back { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--fafa-radius-md); color: var(--fafa-foreground); }
  .appbar-back svg { width: 22px; height: 22px; }
  .appbar-title { min-width: 0; text-align: center; font-size: 15px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar-action { display: flex; align-items: center; justify-content: flex-end; min-width: 44px; }

  /* 应用栏右侧计数胶囊（纯展示） */
  .appbar-pill { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: var(--fafa-radius-full); background: var(--fafa-muted); border: 1px solid var(--fafa-border); color: var(--fafa-primary-soft-foreground); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .appbar-pill svg { width: 13px; height: 13px; }

  /* 分区标题行 */
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .sec-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .sec-hint { font-size: 11px; color: var(--fafa-muted-foreground); white-space: nowrap; }

  /* 今日待办置顶卡 */
  .today-card { background: var(--fafa-card); border: 1px solid var(--fafa-primary-tint-border); border-radius: var(--fafa-radius-lg); padding: 14px 16px 2px; box-shadow: var(--fafa-shadow-sm); }
  .today-head { display: flex; align-items: center; gap: 8px; padding-bottom: 12px; }
  .today-icon { flex: none; width: 28px; height: 28px; border-radius: var(--fafa-radius-full); background: var(--fafa-primary-soft); color: var(--fafa-primary); display: inline-flex; align-items: center; justify-content: center; }
  .today-icon svg { width: 15px; height: 15px; }
  .today-title { min-width: 0; font-size: 14px; font-weight: 600; }
  .today-badge { flex: none; display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: var(--fafa-radius-full); background: var(--fafa-primary); color: var(--fafa-primary-foreground); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .today-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 0; border-top: 1px solid var(--fafa-border); }
  .today-time { flex: none; min-width: 42px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fafa-primary-soft-foreground); }
  .today-body { flex: 1 1 auto; min-width: 0; }
  .today-name { font-size: 13px; font-weight: 600; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .today-meta { margin-top: 1px; font-size: 11px; color: var(--fafa-muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .today-go { flex: none; width: 26px; height: 26px; border-radius: var(--fafa-radius-full); background: var(--fafa-muted); color: var(--fafa-primary); display: inline-flex; align-items: center; justify-content: center; }
  .today-go svg { width: 14px; height: 14px; }
  .today-item.is-done .today-name { color: var(--fafa-muted-foreground); text-decoration: line-through; }
  .today-item.is-done .today-time { color: var(--fafa-muted-foreground); }
  .today-item.is-done .today-go { background: var(--fafa-primary-soft-2); color: var(--fafa-primary-soft-foreground); }

  /* 9 类提醒分组（3 列网格） */
  .group-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .group-card { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 12px 11px; background: var(--fafa-card); border: 1px solid var(--fafa-border); border-radius: var(--fafa-radius-lg); }
  .group-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .group-icon { width: 30px; height: 30px; border-radius: var(--fafa-radius-full); background: var(--fafa-muted); color: var(--fafa-primary); display: inline-flex; align-items: center; justify-content: center; }
  .group-icon svg { width: 15px; height: 15px; }
  .group-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--fafa-radius-full); background: var(--fafa-primary-soft); color: var(--fafa-primary-soft-foreground); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; justify-content: center; }
  .group-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
