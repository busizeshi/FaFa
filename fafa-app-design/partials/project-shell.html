<!--
  ============================================================
  FaFa 宠物助手 · 共享外壳片段（shared shell fragment）
  ============================================================
  sharedRegion : bottom-tab-navigation（底部标签导航，4 标签）
  mutableSlot  : nav-active-key —— 由叶子页按所属标签设置：
                 首页=home · 相册=album · 聊天=chat · 我的=me
                 （二级页面不引入本片段，使用顶部应用栏返回）
  内联位置     : 建议粘贴在各页面 main 结束标签之后、body 结束标签之前
  换肤机制     : 片段内颜色全部引用 var(--fafa-*) 语义令牌，由各页面
                 head 内联的主题令牌驱动自动换肤，无需修改本文件
  结构纪律     : 下方 nav 规范标记（元素结构、class、data-nav-key、
                 aria-current、内联 style 与文案）必须逐字保留，
                 仅允许切换激活项（is-active / aria-current / 颜色 /
                 字重四项），禁止增删标签或属性
  ============================================================
-->
<style id="fafa-shell-critical">
  /* 外壳补充静态样式（scoped；不破坏规范标记行内样式的结构布局） */
  .fafa-tabbar {
    font-family: var(--fafa-font-sans, -apple-system, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .fafa-tab {
    text-decoration: none;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* 激活态轻量指示：激活标签文字下方的主题色短横线 */
  .fafa-tab.is-active span::after {
    content: '';
    display: block;
    width: 16px;
    height: 2px;
    background: var(--fafa-primary);
    margin: 3px auto 0;
  }
  /* 可访问性：键盘聚焦时使用主题色描边，不遮挡内容 */
  .fafa-tab:focus-visible {
    outline: 2px solid var(--fafa-primary);
    outline-offset: -2px;
  }
</style>
<nav data-mobile-nav="global" class="fafa-tabbar w-full h-[64px]" aria-label="底部导航" style="height:64px;display:flex;align-items:stretch;background:var(--fafa-card);border-top:1px solid var(--fafa-border);"><div class="w-full max-w-md mx-auto grid grid-cols-4 h-full" style="width:100%;height:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));"><a class="fafa-tab is-active min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full" data-dom-id="nav-home" data-nav-key="home" aria-current="page" style="min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 4px;height:100%;color:var(--fafa-primary);"><i data-lucide="home" class="w-5 h-5 shrink-0" style="width:22px;height:22px;flex-shrink:0;"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate" style="font-size:11px;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-weight:600;">首页</span></a><a class="fafa-tab min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full" data-dom-id="nav-album" data-nav-key="album" style="min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 4px;height:100%;color:var(--fafa-muted-foreground);"><i data-lucide="images" class="w-5 h-5 shrink-0" style="width:22px;height:22px;flex-shrink:0;"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate" style="font-size:11px;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;">相册</span></a><a class="fafa-tab min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full" data-dom-id="nav-chat" data-nav-key="chat" style="min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 4px;height:100%;color:var(--fafa-muted-foreground);"><i data-lucide="message-circle" class="w-5 h-5 shrink-0" style="width:22px;height:22px;flex-shrink:0;"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate" style="font-size:11px;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;">聊天</span></a><a class="fafa-tab min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full" data-dom-id="nav-me" data-nav-key="me" style="min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 4px;height:100%;color:var(--fafa-muted-foreground);"><i data-lucide="user" class="w-5 h-5 shrink-0" style="width:22px;height:22px;flex-shrink:0;"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate" style="font-size:11px;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;">我的</span></a></div></nav>
<script>(function(){var r=function(){if(window.lucide&&window.lucide.createIcons){window.lucide.createIcons();}};if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',r);}else{r();}})();</script>
